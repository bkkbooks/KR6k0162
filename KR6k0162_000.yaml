front:
  text: 終南山四分律鈔搜玄録序京師大興唐寺沙門釋澄觀尸羅曰淨戒所以懲惡勵行剋志貞節淨無珠璧之玷明有日月之照開一極之平地護萬德之崇墉也自佛日西沉茲風東吹御七衆以逈建應四依之挺生者宣公當之矣德動人天學情內外部之分派陶均一源提三藏之宏綱垂範千文簡理詣義圓事彰得其門者正覺如在然挹流申釋者各盡其所之耳未五百歲有姑蘇志鴻律師乃宣門之輔嗣也義自天假文資學成慨衆釋之詞枝傷簡易之理翳有斯録焉削謬瑩真索幽致遠燭之以誠例鏡之以明文索規賢規猷載採載演妄雲披於智月義天淨於文星搜揚古今成一家之美終南之風未泯吳江之作長流矣因造余門進夫玄趣得探賾佳致見乎深哀輒題數行以旌厥美冀其後學知宗源之有歸焉
