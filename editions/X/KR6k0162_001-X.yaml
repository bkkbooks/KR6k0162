body:
  text: 吳郡雙林寺沙門釋志鴻撰述開合隨於機宜異同生於情見故西天證大藏而為五宗東土行人體會四部還成一律昔分各分其所異今會並會其異同序九代所聞為發起之由致撮三藏玄旨證述作之有𠗦人說七眾教通一化先以當宗為本順受體而明隨諸部取同見之文經論採隨律之說或事有而文未足例決言而使周攝由途而暢前統別類而居後事難知而始終不略類易解而交暎不繁文約行分篇隨類聚當時傳授機利洞明自爾學之情昏莫曉雖廣尋批記而疑阻由多須覧羯磨戒心理相符契今搜彼玄義通會此文或事未明覆尋所引古人文句節義當而具書先得釋文顯理圓而必錄搜玄之目因此輙題十卷成文解其三軸庶體會宗伯鑒余行藏之意焉然文中所引皆顯其名解義不虗事成馮據智首律師鈔主取受羯磨戒心輕重儀鍾樣戒壇經並鈔主自撰西明寺慈律師有記文中云慈及西云者並是蒲州融濟律師泉州道深律師南泉寺景律師荊州曇勝律師文云當陽者是湖州琳律師大善寺海律師崇聖寺靈㟧律師光嚴寺崇福律師越州法花寺儼律師文云輔篇者是抗州花嚴寺大覺律師杭州靈隱寺弁常律師常州興寧寺義宣律師文云折中者是抗州天竺寺義威律師引云靈山及天竺者是蘇州報恩寺法興律師引云支硎者是越州開元寺曇一律師引云發心者是又立律師潤州三昧王寺懹倩律師引云集正及三昧王者是抗州雙林寺清巖律師引云富陽者是潤州慈和寺朗然律師引云慈和者是蘇州開元寺道恒律師自餘或此文載下引義中便出名位或有見義而不得名但錄其義而闕其名上據有鈔記流行於世自餘耳目未瞻者莫知其數依名引義則表戒律相承耳將欲釋文大分五別初明能說教主二明所說教藏三明結集住持四明翻譯時代第五隨文解釋今第一者分六初釋佛義二辨身多少三明身之體相四居土不同五辨說者何身六會三一不異所言佛者梵云佛陀或云浮陀佛䭾步他浮頭浮圖盖是傳音之訛耳此無其人以義翻之名為覺者具二義故言覺察者對煩惱障四住如賊聖覺獨知言覺悟者對於智障無明如睡惟聖獨悟無明有二迷事無明善覺三趣迷理無明覺法實性通而獨悟並名為覺復有三覺一者自覺異凡夫二者覺他異二乘三者覺滿異菩薩更有十種不能敘也問如佛覺者為是有心為無心耶若有心者即是癡貪若也無心以誰名覺覺尚無體誰覺自他今言覺者所謂空也以空心離念了達法界證真實相隨順假名說云覺也故起信云所言覺者謂心體離念離念相者等虗空界無處不遍法界一相即是如來平等法身依此法身說名為覺如是覺者為佛義也第二辨佛身多少者問佛有幾身答佛有三種法報化也法身之體本來無生妙出諸相不可為有圓具眾德不可言無住心即乖離念方契迷之則輪轉生死悟之則寂滅涅槃大功德所依故名法身也報身者萬行所成相好無邊感果酬因故名報身也三化身者法報身中之所流出應凡小根器故經云佛真法身猶若虗空應物現形如水中月是故有感則王宮現生感謝則雙林示滅神變不惻應現無方論跡似有去來語體湛然常住法身名毗盧遮那報身名盧舍那化身名釋迦牟尼三辨體者法身謂法性之理無為無漏常住無變報身謂脩行所感有為無漏相續為常化身謂隨機應跡有為有漏其性無常是三身體別也四居土不同者法身居常寂光報身處蓮花藏世界化身處娑婆世界是謂土別五能說是佛何身者問佛既有三身此毗尼教何身說耶答化身說也所以知者王宮化跡道樹旋真鹿苑頒宣故金光明經云言化身者恒轉法輪六會其三一身土不異問上判三身有異何故涅槃經云吾今此身即是法身維摩經云佛身者即法身也若也身必不殊則知居士無別故普賢經云釋迦牟尼亦名毗盧遮那遍一切處其佛住處名常寂光故知即三而常一即一而常三有一即有三非三即非一故王宮生而不生雙林滅而非滅也第二明所說教藏分二初列數二釋名初列數者約人有二菩薩聲聞約法有三謂經律論二釋名者初釋藏之總名二釋人法別稱言藏者莊嚴論云此三及二云何名藏答云由能攝故稱藏謂攝一切所應知義是故名藏三即是藏持業釋也二釋別名分二初人法別釋二將法三藏對人二藏辨其相攝初二先人後法言菩薩者是略梵音也具足應言菩提薩埵此無其人對番故存梵語秦言好略菩下除提薩下除埵故云菩薩菩提者此番為道薩埵者此曰有情盖是求道之有情故攝論云菩提是所緣境即所求果薩埵者謂能求人發大誓願求大菩提是求菩提之薩埵依主釋也又云菩提是所求境薩埵是所度有情以智上求菩提以悲下救眾生從境立名請菩提薩埵也言聲聞者謂佛說法所謂音聲聞聲悟道故曰聲聞即法花云若有眾生內有智性從佛世尊聞法信受慇懃精進欲速出三界自求涅槃是名聲聞乘問菩薩聲聞各別立藏如何緣覺不立藏耶答准普耀經說有三種藏一菩薩二獨覺三聲聞若依攝論第一不立緣覺藏猶彼獨覺教理少於聲聞從多為藏俱名聲聞藏也又獨覺者唯證生空斷其人執契證與聲聞是同攝入聲聞藏也問經立論不立者豈非相違答論不立者約其契證理同攝入聲聞經中立者由機不同根有利鈍少分依教教名乃別但說十二因緣故別立也言緣覺者緣謂所觀覺者能觀智此人體緣而悟道故名緣覺此有二種一者獨覺辟支出無佛世故瑜伽云常樂寂靜不欲雜居脩加行滿無師自悟永出三界故名獨覺此人以多生種解脫分善根猶利但見世間草木春生夏長秋衰冬落便悟無常自然契證故不假教二部行辟支出有佛世聞佛說法方得覺悟故經云為求緣覺者說應十二因緣法也第二約法三者一素怛亦名脩多羅脩覩路並梵語輕重此方言經經者常也唐三藏番為契經契謂契合謂能詮教契所詮理合有情機故名契經又經者貫攝義故佛地論第一云能貫能攝故名為經以佛聖教貫穿攝持所應知義故正番為線線能貫花風吹不散契經亦爾攝所說義令不分散如線貫花如經持緯經即藏持業釋也准雜心論有其五義一曰涌泉義味無盡二顯示義謂顯示真理三曰出生謂出生妙善四曰繩墨謂揩定耶正五曰結鬘謂貫穿法相二毗柰耶者亦名毗那亦名毗尼此番為律律者法也從教為名釋題具解三阿毗達磨亦名阿毗曇此番為論論理耶正問答辨相稱之為論亦名無比法阿之言無毗之言比達磨稱法故名無比法謂無漏之法慧中勝故更無有法勝此法故言無比法唐三藏云阿毗達磨此云對法言對法者謂無漏慧為能對智涅槃四諦理為所對法所對之法名為對法故俱舍云淨慧隨行名對法及能得此諸慧論此兩句上句約勝義諦對法下句約世俗諦對法言勝義者謂無漏名勝義有漏名世俗二人法相攝者將法三藏對人二藏辨相攝義也問三藏之中毗尼藏者何乘人攝答毗尼藏者聲聞藏收餘之二藏菩薩藏攝亦可三藏各含大小大乘三藏菩薩藏収小乘三藏聲聞藏攝第三結集任持略分部別文三初結集時節二五師任持三離分部別初結集者撰佛遺言稱之為結結謂撰結隨其事類各聚一處書於貝葉故名為集就中分二初明結集緣起二明時處初二初明緣起二明結集初緣起者如來出世隨機施化利同塵沙感盡應遷將歸泥曰受持正法委囑迦葉波離欲使採佛誠言載傳貝葉故付法藏傳云佛告迦葉汝今當知我於無量阿僧祇劫為眾生故懃脩苦行一心專求無上勝法如我昔願今已滿足今將涅槃以此深法用囑累汝汝當於後敬順我意廣宣流布令不斷絕迦葉言善哉受教奉持正法於時迦葉即辭如來往耆闍崛山賓鉢羅窟經行禪寂宣暢妙法度諸眾生至後世尊垂入涅槃放勝光明大地震動便作是念將非如來欲入涅槃現斯相耶即入三昧以天眼觀見於如來在熙連河側娑羅林間全身捨壽作是觀已慘然不悅如來涅槃何期駃哉世間眼滅不善增長即與徒眾向拘尸城若准部執疏云佛涅槃七日迦葉不知與諸徒眾往拘尸城於路逢一外道梵志名優婆抲迦葉問言汝從何來答言我從拘尸城來復問識我世尊不答識復問今在不答言不在世耶自涅槃來已經七日一切天人大設供養我從彼處得此曼陀羅花來迦葉聞之不悅時比丘聞是語已皆大悲惱舉身投地號哭哽咽淚下如雨律云時有䟦難陀釋子在於眾中而語眾言長老且止莫大憂愁我等於彼摩訶羅邊便得解脫彼在世時數教我等如是應作是不應作等今者便得自任欲作便作欲止又有外道譏慊沙門瞿曇法律若煙等迦葉聞之不悅四分律云迦葉闍維佛舍利已集比丘僧告言我先在道行時聞外道及䟦難陀惡比丘語我等今可共論法毗尼勿令外道以致餘言西域記云迦葉即往須彌山頂撾銅揵搥說此偈言佛諸弟子若念於佛當報佛恩莫入涅槃若有入者當得吉羅是揵搥聲傳迦葉語遍三千界皆悉得知佛諸弟子得神足者皆悉集會諸來大眾皆隨教住不入涅槃徒眾爾時有其五百顯揚論云是時如來將涅槃時即以無上教付囑迦葉波等而作是言汝等比丘當順我語先當集於佛教法勿取滅度二明結集將結集時先罸阿難五事得五吉羅一請度女人二足躡佛僧伽梨三不請佛住四不與世尊水五不問雜碎戒阿難言非我故作信大德語今應懺悔諸部所明有其七吉剩有世尊三請汝不肯作供養人及不遮女人令汙佛足准智論云迦葉入定觀見大眾誰未盡漏唯見阿難猶居學地從定起牽出汝未盡結不應住此語阿難言汝得漏盡然後入來阿難耻愧自念言我二十五年侍佛左右供養未曾受如是苦非我懈怠不得果證我侍世尊不取無學遂乃精進不懈少惓欲以亞臥頭未至枕便得漏盡准付法傳云阿難既得道已即飛騰虗空往賓鉢羅窟住門外立於是阿難即以神力從石壁入禮眾僧足隨次而坐准唐三藏記云阿難從戶鑰孔中入也准四分律五百羅漢次第而坐陀醯羅迦葉為上坐長老婆婆那為第二上座大迦葉為第三上座大周那為第四上座等善見論云時大迦葉問諸大眾今當應先結集何藏時諸羅漢咸皆答言先結毗尼藏何以故毗尼藏者佛法壽命毗尼藏住佛法即住故須先結此律下文大迦葉秉其單白羯磨和僧然後方結以三藏教同用此一番羯磨故文云大德僧聽乃至集法毗尼白如是迦葉白竟即便問波離言第一戒何處制等如是乃至調部增一毗尼總為毗尼藏次問阿難乃至法花等經何處說耶都集為修多羅藏次問諸論等為毗曇藏先令波離結集毗尼次令阿難結餘二藏也上來有二初明其緣次明結集兩段不同總當第一明結集緣起竟次當第二明其時處者四分律云於王舍城迦蘭陀竹園畢鉢羅窟於其一夏盡三月結集三藏方得究竟若准宗輪論疏云王舍城七葉巖中夏四月日在此安居撰集三藏阿闍世王為檀越其年十二月結集流通方畢上引諸教時處不同各有𠗦據今且依律第二五師任持五師者謂迦葉阿難末田地商那和修優波毱多付法藏傳云大聖法王將歸寂滅以三藏法付囑迦葉汝當於後廣宣流布梵云迦葉波此為飲光以身金色赫奕照一由旬暎蔽諸光悉不復現准傳云過毗婆尸佛時迦葉為鍛金師有一貧女乞丐得一金珠見佛塔中像面缺捨珠修補迦葉遂為治補像面因共願言我二人當為夫妻身真金色以是因緣九十一劫身真金色復生梵梵天壽盡生於人中為尼俱律陀婆羅門子深厭諸有投佛出家頭陀少欲迦葉於時護持正法廣利群生大作佛事化緣將畢語阿難言長老當知昔婆伽婆以法付我我今老朽將欲涅槃世間勝眼今將相付汝可精懃守護斯法王舍城中有長者子字商那和修汝可度之法其法藏阿難曰諾迦葉即便禮如來舍利及以四塔生處得道轉法輪入涅槃塔乃至入鷄足山山有三峰如仰鷄足尊者入中結跏趺坐作誠誓言願我此身并納衣鉢久住不壞乃至慈氏如來出世之時施作佛事發此願已尋般涅槃彼山三峰合成為一掩蔽尊者儼然而住准育王經入滅盡定非入涅槃第二阿難此云慶喜然此阿難多聞第一強識總持每受佛言如水傳器誦持八萬四千法門及諸羅漢所說悉能受持所以爾者乃往古世阿僧祇劫定光如來時為比丘畜一沙彌常令讀誦日夜誡勑若經少闕即便呵責時此沙彌為師乞食若少稽留經不充限為師所辱沙彌愁惱行乞誦經時有長者恠而問之沙彌答言我師嚴峻令誦經乞食稽留即不充限以是事故每行誦經長者答言勿生憂苦自今已後當相供給宜當精懃誦習經典時沙彌者是佛世尊施食長者今阿難是以斯福緣智慧深妙受佛法藏如海納流付法藏傳云阿難受迦葉囑已宣揚妙法化諸眾生後至一竹林中聞有比丘誦法句偈若人生百歲不見水澇涸不如生一日而得覩見之阿難聞已慘然而嘆即語之言此非佛語汝今當聽我演佛偈若人生百歲不解生滅法不如生一日而得解了之爾時比丘向本師說師告之曰阿難老朽至念無力智慧衰劣言多錯謬復說偈言若人老至矣其念力智念身力一切皆老汝依前誦莫隨彼語後時由聞誦其本偈即問其意答言尊者吾師告我阿難老朽不可信受但依前誦阿難思惟彼輕我言即入三昧觀之不見有人能迴彼意便作是言世間眾苦甚難久住吾當涅槃當時阿難向恒河上欲入涅槃地六震動時雪山中有五百仙人覩斯相已即便飛空至阿難所求哀出家即化恒河變成金地為諸仙人如應說法鬚𩯭自落成阿羅漢悉入涅槃最後弟子於恒河中出家名末田地時末田地作是說言如來最後與須䟦陀羅出家須䟦前涅槃我不樂見和上涅槃亦當聽我前入涅槃阿難語末田地言汝勿涅槃世尊已說我涅槃後當有比丘名末田地是其應持法藏入罽賓國流通答言爾付竟踊身虗空作十八變入風奮迅三昧分身為四分一分向忉利天與帝釋一分與大海娑伽羅龍王一分與毗舍離一分與阿闍世王如是四處各起塔供養第三末田地此云舍地准育王經說受阿難付囑如前所引在罽賓國流通律藏時人號為罽賓律師問末田地是最後度何故在商那前列耶答准育王經即阿難先付法藏與商那和脩後付末田地以臨涅槃時度末田地即入涅槃故更不別付和修處也今諸家取末田地先入涅槃所以前列和修又有付毱多處故所以後陳若論行化二人同時也第四商那和修此云胎衣准育王經乃往過去波羅柰國有一商主共五百商人入海採寶於其前路見辟支佛身嬰重病與諸商人即便停止而共療治病遂得差商主取商那衣浴辟支佛以衣施之辟支佛納受准付法藏傳云以上妙衣而用奉上乃至發願願我來世值遇聖師由斯願力於母胎中著商那衣生已與身俱共增長出家受戒得道涅槃是商那衣未曾離體因即號為商那和修阿難在恒河上涅槃時商那和修在摩伽陀國曼陀山中降二毒龍建立住處此人於後流布佛法療煩惱病阿難在日告商那言世尊者遊摩突羅國記彼國中有長者子名優婆毱多於禪法中最為第一雖無相好化度如我汝當於後度令出家若涅槃時付其法藏商那度彼毱多出家第四羯磨得羅漢果臨涅槃時以此法藏當將付之毱多答言唯然受教商那和修於諸眾生所應作已飛騰虗空作十八變還就本座而入涅槃一萬八千羅漢弟子起塔供養第五優婆毱多此云近護育王經於是毱多演暢妙法降魔波旬度人無量大醍醐山有一石窟長十八肘廣十二肘高亦如是所度弟子得羅漢者人取一籌置石窟中籌長四寸乃至一日之中有一萬八千羅漢取籌自立願言若所度人籌滿石窟當入涅槃於是名稱滿閻浮提世皆號為無相好佛毱多度人既多即起慢心問蓮花色尼尼聞欲來將鉢盛油置戶扇後毱多推門傾油數渧尼請坐訖即問尼言師佛在日度人得果何如于今尼反問言大德聞有六群比丘是何等人毱多云六群比丘甚為麤暴尼言大德佛在六群昔來我房未曾傾此油鉢大德今來傾之數渧毱多傷感淚流滿目尼言大德不須傷感去聖日遠眾生福薄諸惡熾盛故使然也尼言世尊中夜滅度至明相時一切微妙法門及以百千恒河沙諸三昧門皆悉滅沒況復今日毱多護持法藏化導人天石窟籌盈將欲滅度便即飛身虗空作十八變使諸四眾生大信心於無餘涅槃而般涅槃用石窟籌而以闍維十方羅漢亦入涅槃上來五師並三明內朗四辯外隆全一部大毗尼藏八十誦律第三離部者輔篇云但毱多未滅所化弟子各懷異見悟解不同遂分一典以為五部然諸經論所說不同或二或五十八二十二十二等若准唐三藏傳云百年分為五部二百年後分十八部部執宗輪語等或十八或十九部文殊問經有二十部舍利弗問經有二十二部然分部者鈔第十門中廣明不能此中敘之上來有三初結集二五師任持三明分部總當第三結集任持羅竟第四翻譯時代文二初明律本番譯時代二弁鈔興撰之時處初者案靜邁法師譯經圖記前後合兩譯前覺明後支法領但以諸說年月不同譯經圖記中即云覺明弘始五年譯法領再譯即云弘始十一年准前高僧傳弘始十二年譯至十五年方畢謂時前後不同不可通會准僧傳云佛陀耶舍此云覺明是罽賓人婆羅門種來至長安逍遙園四事供養悉不受之分衛一食耶舍髭赤善毗婆沙時人號為赤髭論主即以弘始十二年譯出四分律至十五年畢座後法領譯者飾宗云晉國支法領乃西越流沙路經于闐遇曇無德部體解大乘三藏沙門佛陀耶舍耶舍先來法領即於其國廣集異經以歲在戊申始達秦國即以其年重請出律藏時集持沙門三百餘人於長安中寺出之准傳及圖並云覺明譯本有四十五卷并四分戒本一卷法領後譯開為六十卷也次明鈔興撰之時處者分二初明鈔興之由二辨撰之時處問自聰律師已後覆光願首章疏大興因何於所學宗更撰事鈔為慊古人行事不足為欲功乎異端也答所撰之意如序具明今辨鈔興略引綱格顯其四種一明古人全不依律弘持但以智術行事二為先德雖依律藏能詮之教不明使所詮行事有失三恨古師章䟽不顯行於世事何足軌於來蒙四述今古羯磨雖顯論世事繁略不堪濟於新學略引四意要須撰鈔非是功乎異端至下發起序中廣明恐繁此不述也第二辨撰鈔之時處中二初辨撰之時處二明重修時處南山云余於唐武德九年六月內此是時也於京師終南山豐德寺撰集此是處也爾時屬搜楊僧伍無傷俗譽且閇戶依所學撰次但意在行用直筆書通不事虬文故言多塞陋想有識通士知余託志焉第二重修時處者准南山別傳於貞觀八年遊訪名山至濕州益詞谷因重修行事鈔及注戒本羯磨䟽等隨勘隨講五眾嘆異也第五隨文解中二初序判教文二四分下依文解釋前三初明科判所因二辨有無差別三總會諸德判鈔不同初所因者問佛教西傳此土誰科三別答道安開士智朗不群奧義窮源未萌先達分判教本總作三科後佛地論至乃東語西文果然兩契夫教不孤起必有所因論云教起因緣分此土號之為序緣起既彰必酬所為論云聖教所說分此土號為正宗豈惟現在獲益亦望被於將來論云依教奉行分此曰流通自爾後來咸依此判也二辨有無者然諸聖教或具不具且如花嚴涅槃唯明序正觀音有其中末心經初後全無勝鬘諸經三科多具故今判教不得雷同第三文二初序古次立今序古者總會諸德科鈔不同遠古近古先賢後賢科判鈔文不離兩意或分三段取別教為𠗦或但二科據其鈔本且三段者發正等云依佛地論初盡十門是其序分二標宗已下合二十九篇是其正宗三諸部別行一篇是流通分何以得知鈔合分三者准羯磨䟽䟽有十篇鈔主自科以為三段第一集法緣成為序分二諸界結解下八篇為正宗三雜法住持一篇為流通分彼既雜法為流通此諸部別行為勸學流通者謂得文意耳次立二者富陽等云但分二門序正如前無流通也立無所以云如佛說經有三義故立流通也一正對機說故二說竟時有機囑累故三說竟時四眾依命奉行故鈔不具之故不立也古人所立勸學令知是流通者佛制諸弟子所是三藏聖教並令學知不學制罪何獨此一篇無此理也若爾不立流通應不傳後學答夫流通有二一者勸學二者付囑勸學流通隨義皆有今此鈔文始從序分終盡正宗隨文顯義以濟新舊二學勸令行之是勸學流通也次立今者分二初正明二對辨經律鈔等二序正宗同異初今所立者據鈔本文自有科分何須別立題言鈔序二衣指十門為序有序理明上卷篇立標宗注科復云初出宗體即正宗之文可據無立流通之處未敢科分又鈔自約三行分篇不出流通之位又據諸雜要行篇首結上生下文云若遊途相攝具上諸門別類統收羅下三部三部之內不可分出一篇為流通分上准羯磨立者羯磨䟽別不可類也鈔本云乎那得輙判佛經尚有不具制造豈得一同必請上下求文不立理當最勝亦有欲立三者亦准鈔文求之上二依前三據諸雜要行篇首分別類統收為流通分亦是一家眉目異上獨取一篇任情兩存也二對辨經律二序鈔亦如之經二序者初曰證信謂如是我聞六成就也二發豈者如金剛般若云時長老須菩提問護付二善等是律二序者初勸信謂曇無德律主於佛滅後大毗尼藏中分出四分恐人不信故勸時生信則稽首禮諸佛等是二發起者謂身子託靜生念觀其先佛法住久近請佛制廣令法久住故名發起也鈔二序者初序戒學是佛法壽命住持功強佛及四依弘持不替但為像季時轉澆薄遵奉者希前修依行多迷教指古人制作繁略不濟時須以此發起情懷撰行事鈔故云斐然作命直筆具舒此為發起因源故是發起序也二列鈔中所取諸教事法行用物類相從作其名首統三藏之大綱攬束經律論等大詮科成十意明其隨機設教開制實被未來處判先處本宗無文許取他部當律示聽不具說文句毋論令直引要言妙詞則使時人見鈔刪補知是佛聽今鈔引來證誠可信輙分此序類於證勸二信故知經律鈔等二序並同證勸發起前後布置少有異也正宗近意三種對機理事不同三處遠意離過修成亦不異也問經律證勸居前發起皆居其後何故撰鈔發起在前證信居後者答然經本說發起居前佛臨涅槃遺囑令安證信律中身子發起本亦在前五部分時方安勸信今鈔不爾鈔主自撰無上經律遺囑分部兩緣同佛初說律經發起元來第一後恐時人學寡不知撮略刪補皆是佛聽故次引誠文證之令信則居後也上來諸義不同序判教文竟今當第二依文解釋於中分二初四分律已下盡十門為序分二四分律刪繁補闕行事鈔卷上盡三十篇為正宗兩段今初分二初釋攝序之通顯二夫戒德下依兩序而別解初二初釋所撰之法稱二京兆下辨能制之人名前二初釋新撰鈔之通名二注文下簡異古之別作問自古批科皆先釋題然始科於序正今𠗦何教先科序正然後序中方始出題可則此題便屬於序耶答極有意也此之通題攝於通序通序一部鈔意至於正宗三卷之首皆亦亦則於通名卷則約別上中下而不同題則約通無非刪繁補闕行事若不舉於通號序是誰家之序上中下卷依何名以立文故知非通無以收別上皆列於通題非別無以成通故於通下而列序及卷上中下別此則依文生見不隨記語亂心問依古人先釋通題後分序正有何過耶答約其分判不便若先釋鈔之通名次序之一字別標序分之目即合從此分成兩科初明序分二辨正宗若作此科簡異注文及與名位猶是其題在分門後故不便也又約古人先總釋題及與名位然後分出序正者更不便也序題先已釋竟更分序分一科解判理不合然制造必無斯義有上諸妨故作此科問此題屬序注文可則簡異序題答簡異注文三卷之首皆有而言詞似別上卷云作者非無標名題別中云著述者多立名簡異下卷云注撰非少立名標題此則三卷之首通途簡別則無論序正皆異古人據上所分細無不委至於講竟牒科收攝但收序正不牒題名狀似無題更須分判於中分二約釋鈔之通名二序之一字標章別釋則簡異注文及與名位不勞科之但臨時略述此不細碎通其大家思之今古釋題皆有廣略二判言略者福云四分律者舉本宗之都目刪繁等者旌述作之殊名梵云折埵理此番為四分四者數也分者支也總綰四支合成一部故云四分梵曰毗尼此譯為律律者法也七支晐淨負青松之歲寒六禁貞明無白珪之點缺嚴肅可觀故稱為法四分離中之別稱律者總內之通名總別雙標名四分律刪者削也繁者多也芟所咸反夷紊詞勦子小反截駢柯去濫留真義豐言約補者益也闕者少也博採貞實捃拾琉珠暈發虧光鴻裨未足行言顯作事云簡理理寂虗通圓融屬意此防身口故言行事鈔者略也華文疊彩妙義攸明為述作之標題貫群篇之眾首故云四分律乃至鈔二明廣解分二初之十字舉能貫一部之通稱二序之一字攝兩序之別標此是前科於上略釋須著序之一字若准後科云第二廣解分二初四分律三字舉所學之宗本二刪繁下七字標今作之通名古今釋其宗本皆有簡異靈山問云此四分與律何者先後答律合居先是佛自說又五師相傳同一律藏四分之名後起是末若爾律合居前何在四分之後耶答古今咸云為簡異故戒心䟽云四分者顯宗目也簡異餘部律者為簡餘藏乃是毗尼都號非別無以顯總故言四分非總無以收別故稱為律即四分亦別亦總別者對於餘部總者合攝四分律義亦爾總收五部別簡餘藏也前二先釋四分二言次解律之一字前三初明正解二辨非釋三顯人法差別言四分者付法藏傳云百年之後優波毱多有五弟子各執一見以為揩准遂分大藏以為五典四分別號從此而興古師云曇無德律主於大藏八十誦律中四度傳文盡所詮相故云四分即大僧戒本二十卷為初分尼律已下十五卷為第二分安居已下十四卷為第三分房舍已下十一卷為第四分靈山云此約誦為名十誦等律並同故智論云摩偷羅國毗尼本有八十部論自釋云八十部者約誦為名即八十誦律也次辨非釋者義淨三藏云盖是當時三藏將梵本來有其四筴此依四筴番出故稱四分十誦等律亦同此判彼立理云波離結集尚八十度昇座誦乃方畢豈得律主四度誦終一部無此理也依筴得名者發正破云且如覺明西來誦得梵本至此便譯豈得有四筴而得四名又十誦弗若三藏亦誦得本文無梵葉十筴何得稱十誦耶故知非也三顯人法差別者問此四分是人名法名耶答四分是其法名若從能秉人應云曇無德今癈人從法故言四分若人法雙標即如羯磨題云四分律曇無德羯磨者是曇無德者是梵語准費長房錄魏云法藏十八部中名法護二十部中名法密戒心䟽中名法尚羯磨疏中名法鏡或云法正等第二釋律分三初翻名二解律義三攝歸六釋初翻名者戒本疏云統敘眾名具有三種初梵曰毗尼此翻為律二梵言尸羅此番為戒三梵言波羅提木叉此云別別解脫問既有三名偏立於律有何意耶答律者教也能生解行大聖垂教具列行途五眾依資奉持圓德故名戒也依戒克翦葉斯亡名解脫也是則因果兩行皆由教生故舉律教用攝斯二也次釋義者戒疏云戒者何義義訓警也由警筞三業遠離緣非明其因也言解脫者如論所引道戒名解脫事戒名別脫也戒障有二一者業非二者煩惑戒淨障業或待智亡望分所除云別解脫後智除惑乃稱究竟名解脫也言毗尼者戒疏云古譯毗尼皆番為滅以七毗尼用彌四爭今以何義番為律律者法也從教為名斷割重輕開遮持犯非法不定故正翻之俗有九流法是其一故世付法皆在刑科道與俗違刑名乃異至於據斷必依恒法故使律字傍兼聿者為取筆也處刻胡德反決正非筆不定筆則法家之象致惟律番如增一中七種律也四分九法亦有其證古同為滅謂功能也滅爭能非律不靜如水滅火不名滅故律文言科約篇聚皆有軌轍同收法義餘何可論問律以法訓施造有儀與餘兩藏復有何別答不同也餘藏明理理在虗通隨達一門皆符道觀意在去滯何局文言律則不爾輕重開遮揩摸永定亂常敗續必據科治由此而言法義彌顯所以三藏此土本無不可番度律雖義約刑斷全乖科據有方言涉相似故且當譯見意便止何以知耶律者法也終始有儀於佛教中可成此義故篇聚之設三世同遵適化乃殊性戒常定俗律不爾代有㳂革古用肉刑故律云刑者成也一毀其肉終身永定不可復也今則苔杖徒流用代古法故不定也問佛教法定可用律番究其教相亦有不定即四重罪喻如斬首何故開懺得秉羯磨諸部見解輕重不倫如何訓法天常永定答重罪懺儐覆露兩殊法通開閇故有常准斷頭喻無聖分秉法據本戒儀適機見有重輕當部規模不失即斯量據非法何耶次辨六釋者四分與律具有幾釋㟧約能詮有二即持業帶數言持業者持謂任持業謂業用律能任持四分業用四分即律故云持業言帶數者四分是數四分律者即帶數釋發正約所詮有依主釋四分之戒依主釋也諸記廣列六釋章門非鈔要而不錄第二辨今作之通名七字分四初刪繁二補闕三行事四鈔言刪繁者靈山云刪削也所姧反三蒼云刪除也聲類云刪定也故孔子刪詩書定禮樂即其事也發正云冊從刀者冊謂竹簡板謂之牘即以古人無紙遂書簡牘後蔡倫造紙替彼冊牘古人筆之吏書脫錯者以刀削之是除改之意也然刪繁大旨不過二種一則刪取二曰刪除繁故也若聖教刪其繁長文云時所不行義同於廢章疏刪其濫述故云濫述必翦用成通意也靈山三義以解刪繁發正四義而釋理由未盡今約鈔文所引佛教並盡總而言之有甚九種一則先刪當律二諸部三小乘經四小乘論五大乘律六大乘經七大乘論八賢聖集九古人章疏一部鈔文不過此九第一刪當部律文者如僧尼二部戒本二十揵度每明一事皆有緣起佛在某處某甲犯某罪等若約戒本而言六百餘段並非急務又受戒法聚明其遮難皆有緣起初其受法則有善來上法三歸八戒敬及與滅爭諸揵度等自佛滅後除羯磨外諸法並無故總刪略文云誰能竅其條結等二刪諸部律者且知四分但有集僧之文而不論六相來處遠近今刪取諸部集僧遠近之文如可分別則取十誦文云隨聚落界即僧坊界不可分別聚落取僧祗之文水界取五分等此並刪取自外不盡之文並非鈔者之意故刪却也三刪小乘經者四分集僧云當敷座打揵搥諸律但言令舊住淨人沙彌打亦有得比丘打處文非明了即取增一阿含證成比丘得打增一云阿難昇講堂擊揵搥此是如來信皷以阿難自打證知比丘得為自外繁長刪而不取第四刪取小乘論者如自恣差五德中四分但言具二五德不言二人十誦僧祇並差二人為法五分中二人已上乃至多人為息作故十誦等律雖顯差人之數及息作之言意由未了即刪取三千威儀論論云要差二人者為僧自恣竟自相向出罪不得求餘人自恣以餘人僧不差故自外不盡之文悉刪不取五刪取大乘律者如釋盜賊戒三寶互用中僧祇等律廣明三寶不得互用而不出不得互用所以故刪取大乘律鈔言寶梁云佛法二物不得互用謂無人為佛法作主故復無可諮白不同僧物所以常住招提互有所謂營事比丘和僧索欲行籌和合得用自外不盡之文刪而不取故曰刪繁六刪取大乘經者諸部律等並言受施不如法信施難消寧以䥫葉葉身不受信心人衣服等而無厭治方法即刪取大集經彼云比丘著脫衣時作血塗爛臭可惡想執鉢作血塗髑髏想得乳酪時作膿血想得菜茹時如頭髮想乃至入房舍時作獄想是人即得如實法也略取此文以為興厭方便自外不盡之文刪而不取七刪取大乘論者然諸部等皆有嘿儐治人五分云梵壇法者一切七眾不往來交言雖有此文而不知不言所以即刪取智論文云若心強橫如梵天法治之以欲界語地亦通色有不語為惱違情故不語治之自外不盡之文悉刪不取八刪諸賢聖集五分諸律打四相者並打三通即三下也而不言長打故付法藏傳中罽膩吒王以大煞害死入千頭魚中釰輪遶身而轉隨斫隨生若聞鍾聲釰輪在空如是因緣白令長打今取長打充此行事自外不盡之文刪而不取九刪古人章疏者大約而言且舉四種若總而言則甚多矣一若論寺誥等刪其繁長二刪繁濫濫用知鍾寺是俗造云他物淨道俗通濫三刪迷教自然界方一夏之中但得三度受日及用七十三步半集僧通藍結淨不留僧住惡事不可學作等四刪繁惡非法僧制妄引五百福罸如此等文悉皆刪除故鈔云濫述必翦又云今欲刪其繁惡也問如上九種收文雖盡如刪本律古人濫說許是刪繁及諸部律論大小乘經而取彼文來成鈔體皆是補闕何得說為刪繁如斯釋義豈非雜亂耶答為欲補闕先刪取文且論取要除繁豈非刪也然引用彼文不可全寫望刪除處則是刪繁鈔云自外來不盡之文必欲尋其始末則非鈔者之意又云今並刪略止存文證據鈔自說以為刪繁斯即證也第二補闕者當陽云補謂填補令皃全義闕者缺也即是少義靈山四義釋發正云義三解於其鈔文理由未盡問為古人行事不周為是當律不了須補闕耶答古人行事盖不足論如序所破百無一本為五師異執捃拾遺文來至此方番譯多失隨其行事不足被時律本既無須取經論使機教兩具故須補也上有九種刪繁補闕亦有其九若四分律文不了即取他部補之餘部若無取小乘經補小乘經無取小乘論補小乘論無取大乘律補大乘律無取大乘經補大乘經無取大乘論補大乘論無取賢聖集補賢聖集無取古人章疏補古人章疏無鈔主約義就理舉例四種決通補即序中第五文義決通意文是也遂使一部鈔義文事無闕故文云三卷攝文無文不委庶令臨機有用無待訪於他人也第一取諸部補當律者其事盖多且舉一釋如自恣雜行中問安居竟謂離本處不答律云安居竟不去犯罪律中但言不去犯罪即無請處不作限及不請處之文今取五分以補之五分云安居已不去一宿者隨若不作限請若非受請處得住將其五分以補四分之文令行事周足第二取小乘經者且如捨戒中四分律云若不樂梵行聽捨戒還家若復欲於佛法修清淨行者還聽出家受大戒律文如此而不知得幾度捨戒諸律並無其文即取小乘經增一阿含補之經云開七返捨過此非法也第三小乘論者明淨生種中四分云比丘不應自作淨應置地使淨人作洗手受鈔云此對有人若無人者諸部無文取小乘論補明了論云自加行作疏解云非言自得作淨然自作有益如一聚果子若未淨者但食皮肉一一吉羅若食核者一一波逸提今以火一觸只得一吉合一聚果子俱得成淨免於多罪豈非利益故取彼文補此行事第四取大乘律者如盜十方現前亡五眾輕物四部律論並無明文即取善生補此行事善生者佛為善生長者說護戒相譯經圖中排為大乘律律云盜亡比丘輕物若未羯磨從十方僧得罪輕南山云謂計人不滿五故若已羯磨望現前僧得罪重南山云謂人數有限可滿五故若臨終時隨亡人囑授物盜者約所與人邊結罪也第五取大乘經者魚肉諸律並是五正食此是廢前之教今廢此教取大乘經補此行事涅槃云從今日後不聽弟子食肉夫食肉者斷大慈種水陸空行有命者怨故不令食廣如彼說又云前令食肉者謂非四生之肉但現身耳為度眾生故第六取大乘論者如結大界明量中經律無量大小之文律中但云十四日說戒十三日先往不得受欲為經明相故南山云雖有其文未明里數僧祇五分並云三由旬為量並不言由旬大小即取智論明文補之論云由旬有三種下者四十里即知量極大者百二十里准律由一日行故第七取賢聖集者如問遮中癩病律無明決引善見莫問赤白黑屏處增長不增長者得露處返前而不知如此惡病既辱佛法許受何益故引育王集云有疥癩須陀洹瘡痍阿羅漢有得果之益故屏處許受取此文來證許受有益第八取古人章疏且安居中間因事出界水陸道斷等難不得返界失夏不答律部無文即取古人章疏補之南山云昔高齊十統諸師共平並云得夏此是難緣非情過故第九義決者有其多種一律有其事約行用時文義俱闕舉例決通二律文中無道理合有文義俱闕就理決通三者有義無文決通四有文無義決通今且取律文中無道理合有文義俱無就理決通以釋如此律諸部但有狂痛惱等神亂不足數文秉法彼並不知如非是不足數義謂此律諸部並無醉人不足數文及與其義故鈔足數篇云義加醉人此人神亂與上痛惱不殊將彼文來而決令有眾僧秉法醉人不足之義與前不殊將彼義來決成此義如此之事律雖無文道理合有如後解也問當部律文有闕補即理然他部及經論等闕文何煩補也答為當部行事有闕即取諸部以補之諸部有闕引經及論補之令一部周圓約事無闕非謂將文補彼處經論問古人章疏既云通非囑意則合不取何亦取之補此行事者答俱懷優劣取優中之優除劣中之劣故鈔云長見必錄以輔博知濫述必翦用成通意也三行事者古今多釋發正約字釋云左彳右亍勅玉反故謂之行以左右足遞進之㒵也今此行者謂取行用之行當陽云對事即行故云行事文云即事即行豈復疑於罪福也事有三種一者法謂說戒自恣等二人事受戒懺罪是三事事如地衣是對上三事即行故云行事也言鈔者古今多釋初有二義一利用義即割削繁文二九固義如功臣賜䥫篆亦得名鈔令家久固不破鈔者被及於後時流行久固則類經之常典故下文云繁略取衷理何晦沒即其義也㟧云鈔者略也於其當宗及以諸部略取要義不盡於文名為鈔也有人云鈔字金邊作少三藏聖教古人妙解並如其金剛引要言妙詞直顯其義為少故文云固令撮略正文包括諸意也第二攝兩序之別標者言序者上題一部通號正攝此序也由是前科若准後科至於應云第二標章別釋分三初盡十門序一部鈔之總意為序分二四分下二十七而辨遊途相攝為行事之正宗三從沙彌下三而明別類統収廣後流通之益三段今初於中分二初標序顯二夫下依序科釋言序者標序題也輔篇云引禮云東庠西序虞學曰庠夏學為序郭璞注云序別內外也謂以此序居外別知內顯行世事周足也㟧云𦒱工記訓舒也謂舒展一部鈔文之大意也又毛詩云序述也謂序述作鈔之由及三藏大綱以為𠗦據也第二簡異古之別作亦是前科若准後判至此不科但略述之則分兩序今亦存在令鑒者知言作至別者今古多釋眾許慈和且引解也慈和云作者非無此句屬其古人之作鈔人多鈔多此則雙牒標名顯別此句屬今南山人鈔並異異此則雙簡義成故知簡人必簡著鈔簡鈔必帶於人若爾簡名注文令居名下何故居中耶答注居中者為欲上收於鈔下收於人為此今盡亦無失也今意不然鈔主依於所學撰四分鈔但云四分律鈔即得更標刪繁補闕行事者用之何為鈔注釋云作者非無謂於所學宗中作鈔者不無即甚多矣從理隱雲暉願洪勝首等並依所學宗中作鈔今標刪繁等名為簡別於餘抄故云標名顯別未即簡異於人至於題名方始約人異也又鈔中卷注云著述者多立名簡異抄下卷云注撰非少立名標題三卷之首注語皆殊簡異古鈔前後之意不別如將注文解上亦須古風但簡異鈔文義不迂曲任情思擇也第二弁能制之人名者亦是前科章疏講人多慊講鈔者細碎若依後判但略釋知亦是一意故兩存焉今亦有廣略二解初略者弁常云京兆舉天子所都之處崇義寺者是精舍之別名沙門出家之通稱釋則能仁之苗𧜟某甲鈔主之法號次比聖賢之所遺故云撰述第二廣解分六初弁京兆二釋寺名三解沙門四彰釋氏五敘名諱六明撰述言京兆者爾雅云大也謂天子所都大眾趍歸之處也發正云京兆者謂積數多即十億為兆十兆為京京兆即眾義亦云京師師眾也故知師兆俱是眾義白虎通云京師者千里之邑號也王制曰天子之國四方千里如是眾名不出天子所都大眾所聚故云京兆二崇義寺者案兩京塔寺記云西京長壽坊內本是隨朝延壽公于詮宅唐武德二年桂楊公主為附馬趙慈景之所置也妻為夫置故為崇義寺者聚也司也隨類聚在一處如太常司等農寺即淨行出家伴侶共居故稱為寺也仍別勅與西明與上座將欲撰鈔遂入終南豐德寺今取本住處之寺名也言沙門者折衷云乃緇衣之通號亦淨行之共名靈山云具足梵本云沙門那此云息心故瑞應經云息心達本源號為沙門也又云桑門梵音訛也若准俱舍婆沙沙門者是其果名謂四沙門果故彼論云聖果名沙門亦名婆羅門亦名為梵輪真梵所轉故言釋者能仁之苗𧜟也問上云沙門今復稱釋豈非犯重耶答為簡異故上言沙門者是出家者之通名外道出家亦號沙門故下別眾食戒云沙門施食時將知在釋子外出家者亦號為沙門也故今著釋名以簡之靈山云口稱姓釋不委來由一何可笑故俗書云乃有人孫不識祖名子不知父諱故略序之若具梵語應云釋迦此土好略存釋除迦也然晉魏之僧皆從師姓種種不同安法師云大師本元尊釋迦皆以釋氏命焉後增一阿含來果稱四河歸海無復本名四姓出家皆稱釋子然僧尼既承此姓不可不知准十二遊經云釋迦賢劫初姓瞿曇氏昔無量世時有一菩薩作大國王父母早喪讓國與弟出家學道遊履深山求覓師友見一婆羅門姓瞿曇氏因從學道師語之言可捨王服從吾法戒當授汝道即從其語受服法戒即姓瞿曇學道既久形體改常後歸本國人無識者於本城外甘蔗園中立一精舍坐禪行道時有群賊為王所討經由邊過王使追逐不得賊身便言菩薩藏隱即捉繫縛以木貫之血流於地瞿曇大師在於深山天眼見之乘空而至斂取地血以成泥團持至住處以呪呪之後十月滿左成男子右成女人亦因師姓姓瞿曇氏從此已後經八萬四千二百七十世為飛行皇帝壽八千七十年皆嫡嫡相承作轉輪聖王唯二世作閻浮提王㝡後王名皷摩王亦名摩王梵音輕重不同故五分云佛告諸比丘過去有王名摩王第二夫人有四子一名照目二名聰因三名調伏象四名尼樓聰明神武有大威德彼第一夫人有一子名曰長生頑薄醜陋眾人所賤夫人念言我子雖長才不及物而彼四子並有威德當設何方固子基業即便白王王之四子並有威德我子雖長才不及物承係大業必為陵奪若王儐斥我情乃安王言四子孝友於國無𠎝今云何儐夫人又言王此四子並有威德必相殄滅大國之祚王即呼子勑令出國時四子母及同生姉妹咸皆求同去一切人民多樂隨從王悉聽之到雪山北居舍夷林築城營邑人民熾盛遂成大國王後思見辭不肯還王聞三歎我子有能從是遂號釋迦種也尼樓有子名烏頭羅烏頭羅有子名瞿頭羅瞿頭羅有子名尼休羅尼休羅有四子一名淨飯二名白飯三名斛飯四名甘露飯淨飯王有二子一名菩薩二名難陀白飯王有二子一名阿難二名調達斛飯王有二子一名摩訶男二名阿那律甘露飯王有二子一名婆婆二名跋提菩薩有子名羅云從尼樓至佛身當其六代從德立姓姓釋迦氏准諸經說多不同不能繁敘言某甲者鈔主之名然講解相承或釋不釋若准俗禮諱而闕之君子相承亦是一轍若准佛名勸人稱念今是佛子理合同之道者法也宣者爾雅云遍也謂以三乘道法遍化有緣也俗姓錢氏吳興長城人尊君是䫂公十子之次七大師則士申二息之長兄學總名楊德難具述龍天幽贊豈筆能申凡所撰文及與感通如別傳顯也言撰述者撰說文云錄也述發正云言也夫子述而不作謂其古事也問述與作如何答真諦云如佛說經是作迦旃延造論直述佛意故但云述若爾撰述應不云作何故鈔注云作者非無豈非作耶答如迦旃延造論解釋佛語次比成論亦得為作今鈔亦爾謂撰錄聖教次比成文亦得稱作夫子述而不作者謂述古人之事而語弟子更不新作故云述而不作今鈔望其敘述成文撰成三卷濟其二學得其作名亦無失也上來六段不同總當第二弁能制人名竟上來二初釋所撰之法稱二弁能制之人名兩段不同當其第一釋攝序之通題竟今當第二依兩序而別解此並前科若依後判上來釋序題竟今當第二依序科釋於中分二初序戒學之興替發起撰述之因源二列篇已下述三藏大綱為作鈔所𠗦取證信依聖教發正云如來滅後菩薩作論申經雖弘聖教恐有魔事皆須先歸敬三寶請威加護如起信論歸命盡十方百論云頂禮佛足等今鈔何不歸三寶而直歎戒德者答若望如來滅後作者皆先歸敬三寶今鈔主曇無德宗師分部時已先歸敬訖故律序云稽首禮諸佛等是今承師後附彼律文不復別申敬耳初二初歎所詮戒德深廣定慧不如是撰之宗本二自大師下就能弘之人弁其興替發起撰述之意問此何約所詮戒德及能弘人興替科耶答准鈔標宗先明戒為萬行之宗次約人依律不依即結云故知興替在人也今准彼科此不依諸記也前二初總歎戒德功高約喻顯勝二為五乘別歎尸羅妙用獨絕無倫言夫至像者上句總歎下句喻顯也問此鈔何故先歎戒德耶答戒是比丘行事總宗萬行依之而立此行事鈔故先標也至標宗首廣明思之所言夫者發語之端唯識論云發端標舉之義花嚴云下蘊深旨稱之曰夫單言戒者簡於定慧即是遮詮合言戒德難思者即是持其體德又是表詮今解相承道俗分二初依俗解周易云以此齊戒韓康伯云淨心曰齊防患曰戒有云戒慎也鄭玄注儀禮云警也次道釋者梵云三上聲婆邏亦云尸羅戒䟽云此番為戒戒訓警也由警䇿三業遠離緣非明其因也羯磨疏云戒防身口未非應起不起如治更防城等德者老子音義云德猶得也謂得於物故稱為德字統云外得於人內得於己常無所失故謂之德古師咸云戒是因名德是果稱約其比丘受得此戒既行其因必有得果如地持云三十二相無差別因皆持戒所得故稱戒德即戒之德依主釋也難思者靈山云此雙歎因果也輔篇花嚴富陽聚處明之總有六義一體難思者謂三羯磨竟一剎那頃發得無作之體非色非心非色故不可議非心故不可思超思議之境一受已後未四捨前四心三性始末恒有不藉緣并灼然難思也二相難思者以其從體起行行相非一謂情非情空有二諦八萬法門塵沙境等一一境上皆發得戒如善生云虗空大地草木眾生等喻也三威勢難思者毗婆沙云佛於三千大千世界有威勢者皆尸羅之力乃至五百羅漢定力通力不能駈龍有一羅漢輕重等持語言賢面遠去龍聞即去皆是尸羅之威勢也四者防惡攝善難思即因戒德能防三惡險道能獲人天三乘樂果五者尊重稀有難思此之戒法如來所制聖賢同遵人天敬重唯佛出世樹立此法以希有故九十六種外道所無又六道之中唯人道得受餘道成難故六因深果遠難思以持戒深因能得無上菩提涅槃遠果發生諸禪定等冠超眾像者舉喻顯其勝義初弁喻次法合周禮云在首曰冠平聲謂在頭束髮又取冠帶之義故禮記云男子二十而冠舘音西云若未在首平聲若居頂上去聲儀服記云古者作其蟬冠蟬飲露而體輕像此作冠而戴之故君子誡慎之義也眾像去喻中衣服不一為眾像法中聖教非一八萬法門以為眾像輔篇法合云嚴色身之儀服冠㝡居首飾法身之功德戒為定慧諸法之上二類相似故喻冠超也第二別歎尸羅妙用獨絕無倫中四初為乘之軌二作寶之運三教下所詮自行則三學中勝四匡持佛日眾法則諸教不如前二合明後兩別釋言為五至航者謂明戒為乘寶軌則導引運載舟航也為五乘者先解五乘次明軌導五者數也乘者運載為義以五種法運載行人各有所至故名五乘帶數釋也初列數釋名二弁乘義然諸經論三五不同法花有三一聲聞二緣覺三菩薩釋名如上所說教法中弁智論五者三如上別加其人天為五也天名無愁惱常受快樂故人者涅槃云能多恩義是故名人上五是能乘之人次弁所乘之法者法花云為求聲聞者說應四諦法為求緣覺者說應十二因緣法為諸菩薩說應六波羅蜜法智論云應以人文善根而成熟者即為說上品十善及諸禪智慧是名天乘為說下品十善是名人乘通而言之乘有三種之義一運行令增二運惑令滅三運理令顯即此三種具於諸三德行增般若德惑滅解脫德顯理法身德若窮終盡理無二亦無三除佛方便說等次軌導者軌法則也論云能生物解有法則故導者左傳云通也引物使通故曰導也五乘之人但乘所乘之法若無無願毗尼及五八戒等防護身口七支隨緣壞行未免惡趣故須乘戒俱急以此戒法軌則引導定等善心定慧內防尸羅外護若但修有漏善根不持五戒如迦葉佛時有人但唯布施而不持戒為王家白象等是故支硎曰因戒引導皆到五乘之果何以得知如戒序曰欲得生天上若生人中者常當護戒足為二乘者如律序曰除結無罣礙縛著生此解又戒本流通云七佛為世尊滅除諸結使即是因戒獲得辟支聲聞若論佛者如戒流通偈云戒淨有智慧便得第一道故知五乘之人皆因戒為引導也寔三寶舟航者古人云戒德有任持之功運載之用喻如舟航靈山云寔猶是也寶喻也亦帶數釋亦三寶之義雖則如常不學不知故須略引今依輔篇四別一列數釋名二弁相三出體四立先後初列數者今古不同大小乘異海依戒疏立四種三寶一理體二化相三住持四一體靈山有三同前上三輔篇有三一體住持同前別相少異釋名中二初釋別名二釋總號戒疏云佛者梵云佛陀浮陀佛䭾步他浮頭浮圖盖是傳音之訛此無其人義番為覺覺謂覺悟覺察自他覺滿蓮花開敷十種義義如前弁所言法者梵云達摩曇摩曇無之異傳耳法有二義一自體解法如包等三聚各持自體不散失等二軌摸解法謂軌生物解如無常等法能生無常等解今據後義至聖演教意在承行如車從轍如器從摸法非自覩以喻成也僧者西天音具云僧伽此無其人以相番之號為眾也約體四人同六和也次釋寶之總號者戒䟽云此三益世近扶三有遠清二死希世獨遠所重名寶故寶性論云真寶世希有離垢及勢力能莊嚴世間㝡勝不變等約喻分六義一希有義世寶貧窮所無三寶福薄不遇二離垢義世寶體無瑕穢三寶絕離諸漏三勢力義世寶除貧去毒三寶共通難思四莊嚴義世寶嚴身令好三寶能嚴法身五㝡勝義世寶諸物中勝三寶諸有無上六不改義世寶練磨不變三寶八相不傾上雖六解同舉喻成覈論寶字同訓珍美二弁相者小乘有三大乘有二初小乘者依戒疏云一理體者如五分法身為佛寶滅理無為是法寶聲聞學無學功德是僧寶二化相者如釋迦道王三千為佛寶演布諦教為法寶物隣等五為僧寶三住持者形像塔廟為佛寶紙素所傳為法寶戒法儀相為僧寶大乘二者一體者輔篇云真如為體以一切法如為性故即如性中有具覺義名之為佛有軌持義為法無違爭義為僧故維摩云一切眾生皆如也一切法亦如也眾聖賢亦如也又云佛即是法法即是眾約義有三體唯一如故言一體二別相者謂自性受用變化等三身為佛寶大乘理教行果為法寶普賢文殊為僧寶此約三身體相各別相也三出體者大小乘別大乘一體如前所說真如為體故唐三藏云三寶之性不離真如別相體者謂自性等三身若自性身還是真如為體報身大圓鏡智等四智為體若化身即用佛身諸無漏法為體法者即大乘教理行果法為體僧者謂菩薩等身中諸無漏法為體若明小乘體者如前約相弁體是四立三先後者先立三所以次弁先後初輔篇云所以但立三寶而不多不少者答云法爾須三何者如世間療病先須醫人次須良藥及看病人要有此三方能治諸有情四大之病過即無用少又不足故智論第四云佛如醫王法如良藥僧為瞻病人要有此三能瘉眾生煩惱之病斯良證也次先後者發正云語其一體體無先後隨說皆得今以義次之輔篇弁諸三寶先後總為三約一約勝劣明先後佛者能覺為先方有所覺之法隨覺修學者僧次第如是即大乘別相及小乘理體化相三寶等勝劣同爾皆佛先次法後僧故律受戒揵度中說如來出家成道號佛次即說法後度陳如等五人即化儀次第不可乖也二約師資明先後者法則居先如涅槃云諸佛所師所謂法也以法常故諸佛亦常般若亦云一切諸佛乃至菩提法皆從此經出案上經文法先佛次後僧三約生物信明先後者僧即居初如舍利弗先見頞比丘威儀寂靜遂請說法聞法入道方與目連及二百五十弟子歸佛出家也故戒疏云僧初佛後者由道假人弘世途法爾故迦竺初達現僧儀相述五乘為善因明三途為惡果現法儀也斯法遠大非凡小所開故表畫像於凉臺推其所說現佛儀也故下鈔文立僧像致敬篇者意同此也舟航者初定舟航次解運載之義周易云刳木為舟舟船也航者說文云渡水曰航故知舟者約體而言航者約用彰號次解義者戒如其舟有任持之功令三寶萬載不墜喻之如航故為三寶之舟航也如花嚴經云具足受持威儀教法乃至三寶不斷法得久住論云毗尼藏住佛法則住也問舟航運載不墜之義如住持等三寶其理灼然若一體三寶此戒如何運載答然一體者還謂理釋不見一法是名為戒即喻如舟戒有防非之功不令隨境纏附喻之如航即不迷能覺及與所覺無遆爭等故於一體三寶恒存不變故須其戒以為舟航也言依至等者此明行勝謂依教下所詮戒行建立修行則功高定慧故云莫等古今咸云戒是初基能資定慧定慧由戒而生推功本故莫等者遺教經云依因此戒得生諸禪定及滅苦智慧是也靈山云若論三學各有其功若取識達耶正慧勝其餘若攝亂歸真以定為勝若防撿七支戒為㝡勝今偏歎者乃是將弘律藏也輔篇云文中舉教即合云經論不如若舉行應云依戒建修定慧莫等今鈔文勢初言依教下云定慧莫等將非雜亂者意謂不然行不自立必假教詮建修之功要在於行能所雙舉不可得也言住至唱者眾法住持勝群藉也即當教勝謂住持由於行法此行教詮行既住持中強詮文自然㝡勝定慧行教住持不得故息唱也前則舉教顯教下所詮今則舉行顯詮行之教住者玉篇云立也集正云謂安立佛法名之為住持謂維持依其律教駈擯呵責非法之徒令住法不滅即住持也如七羯磨奪三十五事威儀進止治罸綱網皆假明律可以施行餘行之教不明故云群籍息唱故戒經云此經久住世佛法得熾盛故律中簡集智人要是解毗尼方得餘經論學不取也第二就能弘之人弁其興替發起撰述意中二初引佛四依弘戒珠而圓潔但興翹仰之心二逮于嗟像季諸師傳律寶而殘缺發起撰述之意前二初佛在親自偏弘二爰及下弁其四依約續不替言自至典者自從也從大師在世則偏弘也佛三界中㝡故曰大師指上戒律云斯典典者大雅云常也謂三世諸佛戒法常定更無改易所言大者一約所行因大度一切眾生二約所期果大菩提果是三約所證理大真如廓周法界是四約能證智大大圓鏡等四智是也且約言之故云大也師者約所化之機受稱機既稟受乃名師也世有二種所化之機是有情世間所依止處即器世間在二種中住故云在世偏者大約有二初對戒律特弁偏弘二約經中亦偏弘戒前則花嚴發正總處明之且有五種前一是表詮後四是遮詮一如來在世為諸比丘制戒半月半月親自金口與諸弟子說教授波羅提木叉令正法久住酬身子請名偏弘二如說契經不論眾別戒則不爾界內外要須盡集若叛有罪亦名偏弘三如說契經不揀於時戒則不爾要在半月不得晨朝亦偏弘也四如諸契經隨處即說戒則不爾要在作法處說亦名偏弘五如諸契經道俗得聞戒則不爾要揀清淨大比丘僧破戒之徒亦不合聞名偏弘也故多論云如諸契經不揀時處及在僧中二初經中亦偏弘者支硎云且如涅槃窮終之教弁常住之果明長壽之因謂是其戒所以如來告諸比丘汝於戒律有所疑者今悉可問又云欲見佛往要因持戒等問佛何十二年後不自說耶戒疏云如律五年制廣便有犯人但㝡初不犯佛尚為說至十二年方有重犯如律佛言從今我不說戒汝今自說問佛何不為犯者說也答以無事不知無事不見犯人三問不答必有碎首等苦故不為說問佛僧二說俱為行淨如何一開一閇答佛眼無不觀了唯淨行者方聞僧制取報三根現淨得陳說戒佛說不應則神杵壞之僧說不應則無神可損也問十二年後因過不說何得偏弘答佛令弟子半月半月說者非偏何謂言爰至替者初佛自偏弘後及至四依亦偏弘也爰者說文云及也公羊云前後相接也及者於也遺者富陽云餘也風者教也謂風亦喻也風有靡草之能今律教軏則僧尼整肅如風之靡草也亦云法也替癈也謂如來十二年後滅度已來所制戒法及至於四依亦半月恒遵偏弘之風無替癈也四者數也依者𠗦也涅槃第六云有人出世具煩惱性八大人覺謂少欲知足寂靜精進正念正定正慧無戲論也是人雖行少欲等諸行不妨未斷煩惱是第一依斯須二果為第二依阿那含人為第三依阿羅漢人為第四依又初大小乘弁者小乘四者初七方便人為初依餘三同上大乘四者地前三賢為初依從初地至七地為第二依八九二地為第三依十地為第四依又有釋言謂迦葉阿難商那和修優波毱多等為其四依以是四人階其聖位弘大毗尼一味無缺故言無替後毱多已下五弟子等各執己見分大律藏則漸替廢甚有理也此並初能弘教故尅就人四依以弁竟古人因此弁法行二種四依據涅槃二十一云三種相假夫四依出世要須行四依行具四依法方能為世依𠗦不爾名外道不名為佛弟子行四依者受戒已後令著糞掃衣乞食樹下坐腐爛藥等此為四聖種緣故云行也法四者智論云依法不依人依義不依語依智不依識依了義經不依不了義經非此所要不能廣解也第二嗟像季諸師傳律寶而殘缺發起撰述意中文二初通顯古師之非相發起撰述之端二余因下𮨇盻前非正申撰述之意前二初總標時訛法替起爭虗談二拔萃下別弁約續頹綱顯行世事不堪之相前二初標法逐時訛虗談起爭二所以下弁知時訛法替之所由前二初約教流像季通弁法逐時訛二爭鋒下引人𠗦虗顯律替癈一唱言逮至事者發正云逮及也于語助也像者似也季末也澆薄也訛謬也爾雅云訛變動也謂四依已後及於像季時非正法日向衰微故名時轉人不重戒名為澆薄有所論量不能真正名訛謬也所言像者准觀法師解般若經後五百歲中即用四法以弁謂理教行果言理者即是真如之體凡聖所依從此真理流出十二分教既有其教必詮其行依教奉修必獲果證也初佛滅後一千年具此四法與佛在世等無有異故云正也次一千年但有上三而無果證似像於正故言像也更有萬年但有上二亦無其行以去聖日遠眾生無智雖有教法不肯遵修望於正像將為漸末故云末也然今季者則像中之季慈云准見論尼行八敬正法還復千年今猶是像家之末故說戒篇鈔主自歎云然即生居像末法就澆離斯良證也如今一時三月後一名季也時轉澆訛者謂像望正不如像末望像初展轉不如訛者濫也望云如世有似方無稜角不方又不圓曰訛今人弘於戒律亦爾不似正法又不似像法之初故訛濫也爭競也鋒說文云刀端也謂出言害物如彼刀端故劉子云口含鋒刃動則傷人即其義也所爭之事淺近故云脣舌之間有人見律闕文遂臆說云止但手持無離即得或有師心加四分明相之衣取僧祗通夜之法如此師心臆說各競是非互指為迷誠由無教所爭不佩真文見處淺近云脣舌間也皷動論量皆是不形之事既論量不形之事而於戒律豈更遵承然不形事者人解不同今謂非法僧制皆是不形之事形謂身形謂毗尼軌事是比丘身之所行名為形事非法眾主凡所立法既無典據非比丘身所行之事故曰也鈔主云凡厥施化止出唯心於彼正教都無詮述所以事起非法言成訛濫反生不善何名引接皆由自無方寸師心結法即其義也謂見處淺近是心出唯心故云脣舌之間凡所論量於彼正教都無詮述即是不形之事至下別弁不堪相中廣顯非相故鄭玄云自遵脣吻於鋒刃之端皷怒於形不之事即其義也慈約學大乘語人心未涉道行違大小口說無罪無懺如此爭鋒則傷於戒律言既過實則是皷論不形之事此釋與文亦不違也言所以至之者問鈔主據何知像季時訛虗談起爭人不依律鈔云所以震嶺傳教九代聞之此約教傳九代親聞豈得知所以也震震旦也嶺䓗嶺也地多生䓗故名䓗嶺此國西界之山名也靈山云具足梵本應云震旦真丹聲輕重也故樓炭經云䓗嶺已東名震旦以日初出照於東隅故稱震旦也真丹者取其色也謂天曉時東方乏赤故從名焉花嚴經云真丹者番為漢地故知震是梵語此言好略略去旦字也傳教者始從後漢摩騰迄于大唐玄奘傳三藏教來也九代者花嚴云明佛教至此時代多少從漢明夜夢至南山撰鈔時九代也准晉史目序記說初漢漢禪魏魏禪晉晉禪宋宋禪梁南齊齊禪梁梁禪陳陳陳隋隋命絕受禪唐此為九代禪者去聲與也續也此但論佛法至此得九代不要論帝王得璽及在中原立號是非也約此九代所聞得知時訛法替人不依律起爭虗談也第二別辨約續頺綱顯行世事不堪相中三初明古師全不依律弘持但以智術軌物為發起撰述之遠因二然則下辨古德然依律藏能詮之文不曉使所詮行事有失為發起撰述之近意三常恨下敘古人鈔疏不顯行於世事何足軌於來蒙為發起撰述之本意問科云遠近者答起爭虗談與律懸遠則遠依律迷教由帶傍毗尼即近也若爾依律迷教恐有濫非許為發起撰述近意起爭虗談行不依律與教全乖何須詮述為發起撰述遠意者答准標宗初行不依律以乱法司肆意縱奪專行暴剋乃至令律要絕於覊䩛正法玄綱覆墜今並刪斯繁惡發起七九羯磨及其正行補之何得不敘以為發起因耶若爾本復何答本撰鈔意特為古人章疏不顯行於世事何足軌於來蒙羯磨繁略不濟於新學今作鈔本番彼古人故今敘之為發起意也前三初正辨所聞智述不依律教弘持二欲明下欲明垂範匡持斥𠗦虗之人絕分三豈非下雙収二意兩結易難言拔萃至己者拔萃者古來兩解一拔萃異於出類二秡萃即出類花嚴云草聚曰萃人聚曰類又云萃聚也聚中最長名為拔萃即出眾流類也今同此意謂九代已來位居僧首即為拔萃出眾流類也智是心智術是法術故鈔文云凡厥施化止出唯心又云法出恒情即智術也自後漢第二明帝永平十年傳教至此至魏文帝時雖有佛法道風訛替亦有僧眾未稟歸戒正以翦落殊俗設復齋懺事同祠祀至魏癈帝嘉平二年於洛陽准用十人以羯磨法與僧受戒其間眾首濫委佛教以乱法司若僧有過則以情智出其法術治罸或立罸錢及米之制或餘貨賕或行杖罰枷禁鉗鏁或奪財帛以供僧眾或若治地斬伐草木鋤禾収刈或周年苦使或因遇失奪便令倍償或作破戒之制年別依次鋤禾刈糓若分僧食或造順俗之制犯重因禁遭赦得免或露立僧中伏地吹灰如上治罸法術九代傳聞皆出於拔萃出類僧首之心智也都不弘毗尼令佛法千載不墜但以非法治罰貴在率伏眾人故云而已也第二欲明垂範匡持斥𠗦虗之人絕分文四初行儀匡教難二垂法訓人難三約絕玄綱難四樹巔丈表難一唱言欲至之者今將欲明兩字著諸句之上可得六字列句句之下可豈也詳審也評去聲平論也謂欲令上𠗦虗之人明其揚顯行儀乃至樹已巔大表豈可詳審而平論之也諸句皆爾發正云揚謂發揚顯謂光顯行者自行眾行共行儀者威儀謂行行有則儀相外彰故曰行儀也匡正也攝持也教謂教跡謂欲令𠗦虗之人發揚光顯三行之威儀於像季之時呵責駈擯非法比丘匡正攝持毗尼法則軌事豈可得也垂者謂上訓下也如經云靉靆垂布即其義也彝常也範法也即毗尼律教千佛共傳皆不改易故稱常法訓教也約字釋者言如大川大川濟其所適言濟其所成二利不殊合成訓字後代僧尼俱名末學今欲令𠗦虗之人垂毗尼常法訓末學僧尼豈可得也約既至綱者約能詮教說也約續也既已也絕斷也綱者喻也綱能持於綱目即喻能詮之教能持所詮萬行玄妙之網目也且如止持一目對境防非有無作起非色非心能清色心隔凡成聖豈非玄妙能詮之即詺此教為玄綱也四依已後此綱既已斷絕弘持今欲令𠗦虗之人約此已絕之綱可得詳而平論之也上約能詮教說也樹大表者約所詮戒說靈山云樹立也巔倒也謂頂墜於地曰巔故俱舍云巔墜於地獄中大表者亦是喻也謂表柱也天涯浦街衢恐行者致迷故樹之以表柱今言大者簡異街衢之小柱取津浦之大表此表若倒人何以行故須樹立今所詮戒表表示五乘之津路若無戒表五乘迷途今言大者約相約人而為言也如善生經云虗空大地大海草木眾生量既無邊戒亦齊等故稱為大又一切諸佛本所持故一切菩薩皆持此戒到如來地大人所持故得稱大此之大表佛及四依去世日遠已巔墜也今欲明其再樹前𠗦虗之人可得詳而評之言豈至矣者雙結上二義也初結𠗦虗之易二結軌事而難豈非者可不也𠗦虗者是前皷論不形之類也形者身形也聲者語詞也且如𠗦虗之人身則不論足別不須五十餘法簡之即易為形所爭之事出言即是不論七非即易為聲毗尼不爾一一皆有法則依教即成違則不就故云軌事難為且如匡攝像教康羯磨等離其人非如下足數中云人雖五百簡之不中即難為形羯磨緣骨如法骨中若欠一字不成故難為聲如此難為則須形聲如露之清潔者始得為矣發正云露者在天為霧露在地為泉源支硎云陽氣上昇草木葉上為露露則清也潔者氷霜潔白則無過也謂將此行教令前𠗦虗之人康行即難故發正云欲行此淨潔之教以事驗人故難為也又戰國䇿云𦘕鬼魅者易為巧圖犬馬者難為工況其義也第二辨古德然依律藏能詮之文不曉使所詮行事有失為發起撰述近意中二初正明不曉能詮使所詮有失之相二自非下反顯闢疑遣累非廣學而不能前三初謹執律文被事不能加減二加以下學非精博取類寡於討論三致令下緣上能詮二非使所詮行事成失前二初執文白讀被事非二則在下闇誦信文不能加減非一唱言然至濫者此對前脩愚教為作鈔之由也然則者躡前起後之詞也然是也是教來九代所聞有依律藏而於能詮不了行事不得則成非也律教初興之古德並曰前修凡曰施為皆𠗦託於律藏凡有一事皆手展律文白讀羯磨而用被於前事也故羯磨篇云於是執文高唱呈露文聞即其意也支硎引羯磨篇云戒本制令誦之羯磨豈得白讀況於呪術白讀被事不成等則在文信於實錄者則在文者謂所秉事法則在律文雖然闇誦臨事不解加減名信實錄也實錄者支硎云謂結集家依佛說者而錄又譯者准梵本而番故得稱為實錄也非相如何以寄緣良有繁濫故成非也牒緣入法名寄緣也良多也多有繁過濫過長則成繁有無同法為濫且諸記並云如安居法律云依某聚落某伽藍律總出法如此應在一除一古人隨文總牒即名為繁於一成有於一成無有無同法則成濫也又如看病賞勞律文具牒三衣六物今此亡比丘貧但有二衣或有三物只合隨名牒入除其無者今隨律總牒即名為繁二衣三物成有餘衣物等即無今既總牒有無同法故成濫也受日懺僧殘等諸羯磨中多並如是不能敘也第二文二初隨文臆說非二取類下取文不類非一唱言加至集者加者增也以由也由前白讀闇誦非上更加隨文臆說取文不類二重非也精博者南山輕重儀云博謂通諸部精謂練是非謂不練諸部是非也花嚴云既非精博之匠即自出𮌎臆課情而說尤甚也說事非一故曰甚多也羯磨疏中鈔主釋受持三衣中云文云應受持之不出其文致有諸師行事內濫有人不加受教但奉持無離即是受也此是隨文臆說若爾何以文中有疑捨受明知有法須捨不持者自犯罪耳由失法故無宜不受謂前修見律無加法文而不博通諸部之文不知四分是其遺漏便固執律文但奉無離即是受也此為臆說即後第四門中第一律師是取類寡於討論者謂第二人亦不能通博諸部精練是非取文不類乃成非也謂有師而知律遺漏取諸部文以加受持而不精練是非也羯磨疏云有人用僧祇受者此迷教也彼律開夜會此部明相有緩急也何得妄行今用十誦持犯相類也生常等者支硎云是習俗生常相承不改義也異計者文外生意曰計計與文差曰異以此異計集而用之名斯集也有人將律論不了之文為其臆說未敢依也彼意云謂古人依律行事未作章疏若臆說屬古人者恐濫於章疏故有此斷今謂不然此但固執律文即成臆說如前所引無持衣文等不知律文遺漏即便固執律無是臆說也何開章疏若律論不了文是臆說者何關古人托於律藏不能精博取類之事故不然也第三所詮行事成失中二初辨罪輕重一倍相番二明眾網異同區分盡別一唱言致至別者此即將輕作重將重作輕則辨扸舋戾輕重一倍相番次明將同作異將異作同眾網維持區分盡別致令者躡上生下之詞由上不曉能詮之是非致令所詮行事失也辨謂辨別扸謂分扸舋戾者輔篇云重罪曰舋輕罪曰戾謂辨扸輕物作重分別重物作輕行事與其律教一倍相番故曰輕重倍分也准鈔二衣篇中輕重物釋將輕入重者謂古人見律文不許著五大色衣即判真緋色入重黃白入輕鈔主云白色佛制不著尚判布絹入輕例於青赤亦應分也此則將輕判入於重將重入輕者古人見律許氍氀量同三衣入輕即判被量同氍氀入輕鈔云被是重物不可例之此將重入輕判使所詮行事輕重一倍相番也眾網維持等者結界說戒自恣羯磨等法並是眾家維持法網古人既不能精博則將同作異將異作同致令與諸部律論區分總別也且如難事三小於受戒一界以釋將同作異者此之小界由難故起佛開結之律云僧坐處為界此即是其界相而作法之時還須集僧古人見律無文一向直爾即結如善見七槃陀量亦為難起文云不同意者與四分無異若有難事為他受戒則合依此量集古人不取此量但直示結者則將同作異也將異作同者難事結界齊僧坐處為相古人則准僧祇捨衣小界坐外一尋內為相此則將異作同鈔云准僧祇捨衣者至界外無戒場者結小界文云齊僧坐處一尋已內於中羯磨此則明文有開非關小界又如於蘭若界已起僧坊院相四周此界即非蘭若四周之相與聚落之相不分今若作法集僧故合同於十誦可分別聚落隨聚落界是僧坊界古人學非精博見律無文守文固執還同蘭若五里集僧異於十誦可分別依聚落集夫逈遠處是蘭若界有村村界今既四相周匝與聚落相同弃彼之同而依蘭若五里集僧却就其異故鈔於可分別聚落中明深有理也若爾蘭若有僧坊則僧坊集聚落有僧坊亦依僧坊集答此非類也蘭若有僧坊僧坊相成蘭若相滅即依僧坊集聚落有僧坊僧坊相成聚落之相不滅又聚落之相能攝僧坊僧坊之相不攝聚落故不同也有人破云鈔自約處有四種不同定量分六相差別今更加有僧坊蘭若應有七相差別耶意謂不然此非解也既言院相與聚落之相不分即同可分別聚落之量何得更有七相之殊也今有學鈔之徒云諸律皆是五里又無依僧坊之文結界事大且依五里此並於教於界不練是非准律合與無知此則實異蘭若集僧之事還同蘭若則今集僧眾網與律區分總別也次將異作同者反上則是謂此僧坊相異蘭若今用蘭若集僧之法即將異作同又如解戒場律則無文准理合解律云諸比丘欲廣狹作佛言先解前界即有解戒場之理然律無其解文古人𮌎臆用解大界法解之唯稱大小為別大界戒場界法全異古人用此異法而解即是將異作同鈔主云戒場不許說戒何得牒解今准難事三小番結成解理通文順即是同也此並是行事要義不可抑而不論情不相非顯教理須如此急遇斯界若依蘭若即獲無知非法集僧界亦理然成就若約解界捨去不還則失用文異則招𠎝幸願深思不同古人將非法僧制以辨且非法僧制而非律藏耳問前約能所判文釋義不分彼此耶答前則用文被事故約能詮後則行事違文故約所詮未有教而無行未有行而無教教行雖則相脩能所條然自別思之第二反顯闢疑遣累非廣學而不能中二初顯廣學人之德相二孰能下推闢疑遣累於此人一唱言自至歟者謂初段通述廣學人之德相第二段始對前辨精當宗他部能詮使所詮無失也自非者反顯簡別也俗諺云自非此人餘不得同此意也此何人哉即第四門中第三第六律師也統通也教能詮也凡一事三藏教中有者但癈興不同今通解三藏癈興意也初經律對辨次諸律對辨後當部自辨且如魚宍律中是五正食即興涅槃楞伽禁斷是癈律興意者為接小機初便制斷進道莫由即機教有闕又非四生之肉佛現化耳經癈意者時機漸薄貪味者多僧俗食同招譏毀重文云夫食肉者斷大慈種有命者怨故不令食前小教初緣後涅槃窮終極訓若如是解者統三藏癈興意也又諸律對辨興結淨地意為怜愍吐下比丘祇中癈者為遮外道譏毀又當宗辨者如與欲中時集清淨非時集欲初興但如法僧事不論時與非時皆言與欲清淨後興即知前癈為六群起過稽留法事後興但是如法一切無障如是體解為統教意之癈興也考者銳思研窮為盤𦒱也諸說者是古妄執律論之文即成胷臆說也如上難事不用七盤陀集身外一尋內結及空野僧坊依蘭若集古人謂僧坊在於空野便將空野僧坊妄執還依律論蘭若集僧𦒱其律論之文逈遠即是蘭若故知古人妄執律文將空野外僧坊同蘭若相集所以成虗還依十誦隨聚落文成實謂僧村四相二界不別也有人將律論不了文為虗文義俱圓為實者深有理也謂經律論文不了之處即是番譯諸說虗實也謂律論不了處番譯失佛意成虗若文義俱圓佛意無遺此文為實𦒱其經律論等即知翻譯諸說虗實也謂此一段未論章疏只得就律論明諸說也孰能者聯上帶下之詞也自非廣學之人誰能為也闢開也重二也疑不決也於一事上二意不決故曰重疑能詮教上亦有重疑所詮行上亦有重疑指事釋者如律中看病賞勞羯磨有人依文秉之即是有人依文誦之落非一種依文誦之何以是非兩異此重疑也廣學能闢若有三衣六物依文秉之則是亡者若貧唯有二衣一物還誦三衣六物寄緣有濫即成非也如取類中四分既闕道行之文薩婆多彼云比丘遊行時隨所住處縱廣有拘盧舍界而不言拘盧舍大小諸部並有了論云一皷聲間十誦云六百步一種明拘盧舍量如何大小不同今不知取何者即類取何者不類故有兩重疑也若大小不同此約事用有異了論約蘭若集僧事則極遠不過一皷聲間更遠集難以此為量十誦約事輕小不勞遠集故制六百步謂機教相稱今取類者即多論解十誦律今取十誦律文與論疏類相當若取了論文蘭若道行事別也故鈔云此論解十誦律云六百步為拘盧舍量所詮中重疑者如亡比丘有多紙筆墨等或斷入重則是或斷入重則非或斷入輕即是或斷入輕即非於此事上生兩重疑故輕重儀云本緣為利佇畜者入重即是入輕即非本為三寶緣畜者入輕即是入重即非也遣通累者遣除也通總也累罪也若能詮之教不明所詮之行不解據其律制一一事上總各結不學無知二吉事則亘通法界此吉通諸事有即詺此罪名為通累今能所無疑四部不或不學無知二種通累自然除也故言遣通累此會釋解妙得其源也括者主名同避之以搜代也搜求四部之執計也謂諸部各執一見所有教文皆詮行相識知同異判割無差如四分若闕即善解取文執計同者即取不同不取如僧祇部執計通夜護衣其義則緩四分部執計明相為限其義則急今四分闕加衣之法合取十誦之法十誦為護明相與四分部執相當若取僧祇則成其失又四分闕捨衣之法合取僧祇之法祇云衣不得會應捨以輕易重與四分應捨之計緩急是同又僧祇一說與四分諸法無結略者一說部執計同若取十誦五分三說不捨之計則成失也詮謂能詮律論之文行相者所詮三行相狀謂搜能詮部執之同異依其部執同者引其詮文取判所詮行相而行事無滯歟語助詞也第三敘古人鈔疏不顯明世事何足軌於來蒙為發起撰述本意中分二初別辨不顯顯明不堪濟於新學之相二並言下總結未可之意初中分二初通辨鈔疏不顯於世事何足軌於來蒙二時有下別論許有顯明繁略不堪濟於新學之相初中分三初總標恨所流之遺記二止論下正顯恨遺記之所詮三至於下敘文之不顯錄結歸所恨之意一唱言常恨至百無一本者富陽云此對九代之中古人遺記而興作意也慈云怏怏在懷長時不已故言常恨覆光遵統十有餘家著述疏抄人既已亡疏鈔流傳並名遺記止論者商略之詞也說文云基止也基止者文中本詮也謂古人文疏本詮多論其廢立古人要抄本詮多論其問答至於者指此及彼之詞也謂此遺記雖多有其問答癈立及至顯行世事未之有也顯明顯也行謂行用世事者當今現世之機要所行之事也當今章疏之中不能顯明次第陳列但向癈立問答中明將此遺記濟於來蒙百中無其一本也蒙昧也來者易云童蒙來求我非我求童蒙故曰來蒙或六禮聞來學不聞往教故云來蒙華嚴云百無者舉多以況少一本者舉少以況多也第二別論許有顯明繁略不堪濟於新學之相分二初兩成繁過後二太略非初二初義加羯磨繁二或多列下綴疏遊詞繁一唱言時有至足者時者謂教來九代時中有脩撰羯磨者云時有也銳懷者謂聰銳之情懷見律文羯磨行事不足即便義集羯磨之文令行事足故云銳懷行事新撰羯磨之文而在義加門中集也羯磨疏云或准義用即先師所述唯義雖無爽藏迹可嫌據鏡中沙門玄儼律師羯磨疏記云先師義用者如分亡人衣差分衣人羯磨無文律云白二差一比丘分彼即義立三番一差人二付衣三分衣注羯磨云有存三番作法此思文不了兼受日加乞詞等藏迹可嫌者若當律無文准用他部教迹今乃不用他部而以義加者以義翳文名為藏迹凡義以擁聖文可嫌甚也或復等者光律師義加已是一非重有制疏解之故言或復則有律師出羯磨疏但依光律師羯磨而作其中廣列義門及七方便等義多論閑緩之務故曰遊詞少於行事之文則是逗機未足羯磨疏云又於本綴疏廣列遊詞至於行事未見其歸撫事懷人實增勞想如斯之類何足逗機也第二文二初單翻羯磨略二依文下依律出文略一唱言或單至事者單題一百餘番羯磨成不之相不門故羯磨疏云或單番出則古本曹魏所譯者單番失於文旨包舉難成記解云謂直出羯磨無有秉法由序次第後人行事不達者捉得便作不曉羯磨之緣成敗是失文旨包含也舉起也羯磨理含結界和合等義今包含而不列但直誦羯磨法界和合義即難尋也依文等者羯磨疏云即今一家依文直誦依本得在執據前後易惑記解云覺明所出羯磨不以義推前後有惑也如准緣結大界在前後因數有事起方開結小緣雖如此可以戒場後開即在大界後結要須解大界已先結小界方結大界若以依文後見前後易惑結界落非事則不辨也言並至悉者有二意初至披撿總牒上文二所以下釋成未可所以言是羯磨聖言章是制撰章句單題依文二本不排前後次第其言包舉緣成之文雜碎含在羯磨之中故不可披撿義集遊詞義立羯磨無教可𠗦義門章段詞費繚亂故未可披撿問縱碎亂披撿何過並云未可耶欲知未可所以者非積學等是如要一事欲尋求者非積功累學之人新學乍看不可知其處所領其文意會解如非不是精窮研練之者新學乍者不可得委故未可也即生下撰鈔門分三十隨事撿之不難羯磨自科為十門逐務取之甚易又篇篇之內對事各明是非新學覧之自然領會文意也上來有二初別釋二總結兩段不同正當敘古人鈔疏不顯行於世事何足軌於來家為發起撰述本意之文竟上來有三初明古師全不依律弘持但以智述軌物為發起撰述遠因二辨古德然依律藏能詮之文不曉使所詮行事有失為發起撰述近意三敘古人鈔疏不顯行於世事何足軌於來蒙為發起撰述本意三段不同正當第二別辨紐續頺綱顯行世事不堪之相文竟上來有二初總標時訛法替起爭虗談二別辨約續頺綱顯行世事不堪之相兩段不同正當第一通顯古師之非相發起撰述之端竟今當第二前非正申撰述之意於中分二初述覧古文非當正興作鈔之心二斐然下心口相詢直筆制其刪補言余至劣者發正云余我也芳耳飡音曰聽心取妙義為採此二闕時故名為暇迴視曰斜瞻曰皆不正當之㒵也諸文不一故號群篇篇章也正在古人遺記疏抄羯磨等傍及前脩依律行事律則部執不同有無差別諸說虗實通總也非不也屬當也意旨也謂佛旨及我意也佛意隨機設藥除病為先我意在自行成立即堪秉持像法使佛教不滅所以古人章疏總不當佛及我意旨也何以故爾以俱懷優劣也前代所流遺記及羯磨行事諸文不一日俱各各有優復兼其劣故不當我情懷也下出不當意之所以前代止論文疏癈立是優不顯行世事是劣前代要抄多立問答是優約軌來蒙之事總無是劣羯磨行事之文銳懷義集是優以義藏跡可嫌是劣多列遊詞是優逗機未足為劣單題一百三十四番羯磨為優成相不宣為劣依文具寫緣起是優於事前後不分易惑不辨前事為劣如上古人雖依律文行事是優指事披文信於實錄部執不明諸說虗實等為劣如上諸文通非屬當意也問何不明爭鋒不形等答此全不依律文無可定優劣也第二心口相詢直筆制其刪補中二初正謀作鈔分成三卷所為之意二然一部下釋成三卷旨歸生起篇目十門之意前二初正申作鈔先謀勒成三卷所為二若思下由恐新學未瞻前謀更別撰文前二初正明引教布置呈述作之先謀二然同我下釋布置繁略指成文之所為前三初示能取所取文之體二惑繁下辨交暎布置文之勢三并現行下番前繁少百無一本之非明今顯於現行濟費功之新學前三初命懷起意直筆先舒本宗二包異下統一化之玄文盡為所取之鈔體三搜駮下結歸能取之深旨興刪補之嘉名言斐然至舒者斐然作命者謂由分別前古人文之優劣發起命懷直筆作鈔之意也說文云斐者分別文章之見則也然是也謂前修雖依律藏行事不明古人遺文未顯行於世事數家所撰羯磨或略或繁南山聽採之暇𮨇分別如是之文並總不堪濟新學之機要故曰斐然因此分別是文之非自然使我發起情懷繁略取中撰行事鈔謂之作命無人命作斐然則是作命也有人釋云作者起也命者意也謂分別古人章疏不堪濟於新學自然使我起意撰行事鈔以濟新學費功當此釋也直筆者狂簡也故論語云子在陳曰歸歟歸歟吾黨之小子狂簡斐然成章不知所以裁之注解云狂者進也簡者大也謂直進取其大道也今不取律本起盡之文直進取其盛行要當之事如彼論語直進取其大道故云直筆具足舒張本律要行之事於所撰鈔中故曰具舒從標宗已下盡三十篇但云四分及律云者是又云不事義章但錄律本名直筆具舒故抄主題鈔末云但意在行用直筆書通不事虬文故言多蹇陋即郎證也第二文中分為兩對一異部眾經對二西賢此德對一唱言包至紀者包謂包羅羅取要當本宗之外曰異即五分十誦僧祇及諸大乘寶梁善生律等誠文者誠實也謂文理俱圓真實要當名誠文也但三十篇中所引五分十誦祇等并是括眾經隨說者搜撿眾經即大小乘經涅槃楞伽花嚴阿含遺教等經是隨說者謂與律相應者即隨經之律隨經本中有說律處是名隨說也下三十篇所引並是隨說之文也西土者東指五天之總號賢謂賢和初地前三賢小乘七方便人聖謂聖正約登地見道得無漏已去法身大士證理無其耶曲故稱聖正也則諸大菩薩羅漢等賢聖即有大小之殊作論傳亦有大小差降智論即大善見即小如誠實論通大小乘也傳則付法育王等下篇引者并是此方者指九州之一統先德者自覆律師立章疏為首已下二十餘家則取願光首靈祐普照道安文宣布薩儀整禪師凡聖行及梁帝出要律儀等文紀者即記傳抄疏等紀者玉篇云錄也下文並標名引用也第三文二初通辨搜取之能二長見下結歸刪補之嘉號一唱言搜至意者此正明能取之意立刪繁補闕名也輔篇云搜取駮除也謂搜取其同駮除其異故云搜駮同異今解不然此之駮字不訓除也駮者說文云六駮獸名也其形似馬頭有一角食虎豹身有六般之色故從色不一而立其名故謂之六駮獸也今鈔取此駮字以釋極有意也獸色班駮不一故稱駮者鈔亦班駮取文謂於經律論傳古人章疏隨要用處取不要不取故下文云必欲尋其始末則非鈔者之意如是取文成其鈔體故云駮也搜駮取其同搜駮取其由途同者相攝成二十六篇別類異者統收為下三篇雜相同異共為一篇於同異中並皆研覈窮盡道理也謂經律論傳同文同義極多異文異義不少今向同中研盡道理異中研盡道理故云並皆窮覈同中長見必錄以輔博知如諸經律云打擊擿等同中濫述必翦用成行事通暢佛意謂濫用知鍾等異中長見必錄謂諸部別行所引以輔弼鈔文精識其異異中濫述必翦四分許重受白若准十誦和僧似一事上不許重受翦云然彼有不請之文寬於四分重受不開文非明了取長則是補闕翦濫則是刪繁如是刪補用成通其佛意故前通辨搜取之能後立刪補名今當第二辨交暎布置文之勢分二初別舉文中繁略義連徵問辨異古人之作二如是下通結交暎布置文之體勢前有四句不同勒為兩對初繁文略指對二義連徵問對兩對一唱言或至問者鈔主用文之勢雖繁及略文斷義連兼有問答不同古人繁略義隱止論問答也今每到科前先簡異古人後釋正義深云此由對上多列遊詞有人依光律師羯磨綴疏於一一事前廣引緣據且如受戒善來本緣為某人上法三皈八敬羯磨又於羯磨問難前緣初難緣起某人度某弟子某人呵制等皆引緣據自佛滅後准羯磨一受餘者並無何須廣引諸受及問難本緣即是遊詞今抄繁文為顯事用故繁不同古人也且如受戒問遮難中將欲問其遮難先須解釋令人取解然後更出問遮難之文前後兩重恐濫在繁之數前解繁者顯受戒事用若問不解終為非問故繁文解釋令能問之人取解所問之者知其事由答對無失後更出問難法者恐正問詞句繁略難知故避就傍突裁量准的出其法則又戒是萬善之基下為六道福田上則三乘因種若受不得身則成難為此事故須得繁也或者不定之詞巧用文勢極多故云或也或略至從者此文是相從故略異於曹魏滿律師單題之略鈔則具解如非滿等不宣成相故簡異也且如鈔中羯磨一篇初統羯磨由漸且分十門羯磨竪則有三心念對首眾法橫則有八但心念對首心念眾法心念但對首眾法對首單白白二白四八法之中就緣約相總有一百八十四番羯磨此鈔始從但心念終至白四復各出一番如非自餘一百七十六番略却其名不釋其義類上八種取解得也類者類例也相從者易曰雲從龍風虎即各隨其類也今但心念唯釋一法餘但心念類前但心念取解乃至白四各有其類其類自同是相從也全異古人單題之略文勢極多故云或也或文至連者對光律師行事當律無文不取他部而以義集羯磨行之羯磨疏云准理無爽藏迹可嫌鈔則不爾若當律無文即取他部及經論傳疏若諸處總無其文即是文斷其事實要不可不行故以義連令行事足雖以義連皆有𠗦據若文義俱闕舉例決通等四句至第五門中廣辨不同光律師不取諸部之例則以義集故簡異也或徵詞而假來問者對古人要抄止論問答也問鈔既斥古疏止論問答今行事文何故復有數百徵問與古人何殊答或論一事托前義生故須問起前義成立然後續徵後事故先問後徵有數百問答顯其行事不同古人一向心論問答問答之事前後復不相躡將此問答以為要抄故簡異也或者不定或有事義假其問答或有行事直釋不須問起也再問曰徵初啟為問詞詞句也假藉也來往來也謂欲再徵釋其行事之詞句要假藉於問來也夫言徵問約論有六一問二答三徵四釋五難六通故徵下有釋問下有答問即居初徵乃居次凡欲徵起一義要假於先問來也如持犯篇中古人皆約境想迷妄事上開無不學無知犯上法上從來不開犯上結十二罪法上無不可學九南山約事上開義罪上法上不合不開先托事上起問如煞盜等人非人想有主無主想律結無罪亦有制犯者何答或緣罪境人非人故便結心犯或緣非罪境無主物故然彼迷心不結正罪所以開也即躡事上開義徵起犯上法上亦合得開所以徵云若爾後緣法中亦有想轉如不處分處分想及疑亦不結犯何為制罪者徵此犯法得開實由乘前事上無罪道理方始徵成後義故此徵詞要假於前問來也言如至出者靈山云為結前文故云如是如是之義或將始暎終或將終暎始故云交暎或前隱而後顯或後隱而前顯故云互出即前四句四句之中皆有始終亦暎隱顯互出也且繁文以顯事用以解交互也暎照也謂將初末交互相暎照也如受戒篇問遮難中前廣釋十三難相為始後更出問法為終如非人畜生二難解中云此上二趣若依本形是人通識恐變而來故須問之脫有高達俗士受戒語非畜生不若聞此言一何可恠應方便轉問如下所陳此則將始以暎終也至下問中即出問法云汝非諸龍畜等能變化者變為人來受不要由前釋方解後問此將終以暎始也隱顯者結牒前語亦不異前若欲釋者不無少異前則顯其釋文而隱其問法後則顯其問法而隱其釋文更互隱顯不同則是互出之義也次略指以類相從者羯磨篇為始諸篇為終羯磨但出八番如非照下諸篇羯磨如非之相即將始以暎終也下諸篇中有羯磨處更不重出如非之相暎前羯磨篇中足明性終以暎始也隱顯者羯磨篇中總顯如非之相隱却其餘羯磨文下諸篇中隨事顯羯磨之文隱却如非之相是互立也次文斷而以義連者羯磨篇為始說戒篇為終羯磨篇中問白讀羯磨作法成不鈔雖有其成不之問諸律則無成不之文可錄此則是鈔撰述文斷之事鈔答云不成是定雖無明決可以義求標其義連則暎下說戒篇中戒本須誦以例羯磨亦須得誦故四分僧祇半月無人誦戒應差向餘處誦竟還本處說之不得重說乃至一人說一篇竟更一人說若不能誦者但說法誦經而已准而言之若得讀者執文即得何須如此止不讀之此則將始以暎終至後說戒篇中難明戒本須誦不知誦有何義律論並無其義可錄亦成文斷即須暎前篇中羯磨須誦之義即是將終以暎始也須誦義者但以法貴專審今背文誦持心口等專正加事便易必臨文數字出口越散等隱顯者羯磨篇中即合隱其說戒須得差人誦文此中却顯說戒篇中即合顯其戒本須誦之義文中却隱如是隱顯名互出也次徵詞而假來問者如心持門中徵起法上得立不可學九即云此且就止持約事為言必如所引對法有二九句後作持中更為辨也此即將始以暎終至後作持門中立不可學九即云不可學迷亦有九句如前段後九句說之更不別立九句此即將終以暎始隱顯者法上不可學九句止持門中即隱作持門中即顯法上徵立止持門中即顯作持門中即隱有無不同名互出也當陽云如是數篇為始受欲篇為終足數但答僧知不足之文不答自言不足之語今將始以暎終如其自言欲法既失若自言亦不足數此將始暎終也將終暎始者與欲但有自言失法之文而無僧知失法之語今將終暎始前答僧知既不足數若僧知亦失欲法也隱顯者如僧知之語與欲中隱足數中顯如自言之語足數中隱與欲中顯更互隱顯即是互出然此段雖繁為顯句句有也第三番前繁少百無一本之非明今顯於現行濟費功之新學就中二初番前繁略百無一本之非二並皆下濟新學之費功結歸鈔興之意前二初辨現行是非兩意不繁番前百無一本之失二立導俗出家二篇離略番前逗機未足之非一唱言并至法者此段意謂羯磨篇已相從明一百八十四番羯磨竟今受說安恣衣藥諸篇隨事別出羯磨之文豈非繁耶初羯磨一篇總明如非之相由未別出諸羯磨文後諸篇中直寫現行羯磨之文更不明羯磨是非之相前總門故離繁後別出文離略此繁略取中為濟新學費功夫也兼簡異古人不顯行於世也此意同富陽解諸務是非者鈔言隨事即行想合明其是義不合辦非非不可行復何繁錄錄非之義豈非繁耶答欲明其是先須識非若不顯非於何識是是則須行廣釋非則須識略明諸篇之中類甚多矣且舉集僧如自然界量古人定方南山欲明圓義及不定義即云昔解定方即顯非義今不同之下即明是義若有別界即尖邪不定若無界其量定圓又鈔中引其部類相當其文則是或言次相及辨異引不相當者其文則非此即諸部由途相攝是非又如明大僧事引文望僧則是或便明大尼及下三眾之文望僧不行成非此即別類由途相攝是非故下第二十七篇首結上諸篇云若由途相攝具上諸門亦是諸務是非至下對文更為辨也若爾此由途相攝豈非繁耶答若望諸部異者博學以濟貧又臨機緩急取捨無非聖意若大尼及下三眾文中便明復與律文不異又臨機有要依篇撿之不難此非橫評之繁也若爾此既已明下何須別立三篇者答此約由途下約別類故不同也鈔又多有斯處恐類於繁故分雪也發正云南山生來所作羯磨及疏是非雙明故云諸務是非花嚴云現行羯磨者即是通辦羯磨篇辨事是非也上發正所解鈔外論文費功之言虗設花嚴釋義指羯磨篇復失并行之語學者細披會文意耳導俗正儀者導引也謂帶理曰真純事曰俗此為六塵所染與理全乖謂之俗也凡俗人入寺以其正法引導除其是非之心不求僧過不汙僧地又勸捨施禮敬問訊為受五八戒等如是引導之法皆是佛之真教故曰正儀也出家雜法者心離貪等煩惱之宅故曰出家雜法者謂沙彌篇引度人經廣辨出家法式夫出家者先立壇場懸幡焚香置和上坐位弟子坐位剃髮師讚唄人拜辭父母軌則甚多故名雜法立此二篇意者說記皆云二十八篇並是大僧尼等所行鈔中理合具有導俗沙彌既非大僧行事正宗今鈔立者豈非繁長故南山云今伽藍致設訓導道俗凡所施為無非戒律也然俗為所化之境僧為能化之人凡有信出家大僧須知儀則外有逗機之益內無失法之𠎝若無此二篇者俗無迴向之因有出家者僧闕度人軌則又一期行化佛教未周又十門中有道俗通塞復有下三眾隨行此並統彼佛教大綱一期行事並足故立此二篇也古德於內遊詞拯多無此二門故逗機未足今二十八篇行事並無遊詞即離繁文更立導俗出家二篇又離逗機未足之略離斯繁略故簡異焉輔篇諸記將諸雜要行以為出家雜法此乃僧尼正宗本分須學何得更用分疎前解可依後判無理也言並至焉者現行雜法四段故曰並皆收束具列鈔文故曰攬為此宗之一見一處見文具足不假多處尋求為師若度弟子雜法一篇可𠗦士女入寺正儀足以化導受恣諸餘法事具列二十八篇羯發現行隨諸篇中皆有識非明是隨事用而不或豈須上下求文言事悉周故濟學費功夫也第二布置繁略指成文之所為中三初先遮異斥之繁約事未已顯不樂繁之意二何者下徵釋事不獲已不樂繁之所由三今圖度下辨取中約結所為而成三卷言然至已者此一段文釋前取文繁略意也恐人斥云鈔稱刪繁又云或繁文以顯事用豈非相違故先遮此異斥也然是也易曰同聲相應是同我者謂見其機微乃擊大節也擊揚也節解也即唱和詞也大者簡小之稱謂同者知其鈔又從始至末若廣若略皆為顯行世事事易故略指事難故廣釋則明一部鈔文總無繁略之處如是唱和者名擊大節大即簡不取擊一兩段之好為小今取大也如左大冲賦云巴姬彈弦漢女擊節是其音者也又如劉遺民與肇公書云須已頒諸學徒屢有擊其節者也情解不同名為異說富陽云今若斥文繁者謂曲高而和寡如有善琴者皷琴於都市陽春白雪之曲和者一二為巴人下俚之曲和者數萬所謂曲彌高和彌寡今有非斥者謂不知顯事用故須得委曲示之即斥其繁也示不樂繁之意者文繁誰所樂之即由事不獲而已即多也事者所行之事也獲者得也已者止也謂無人樂其文繁多由說事未了不獲得心住也言何者至諱者徵釋事不獲已不樂繁之所由也先徵次釋何者是事不獲已不樂繁道理雙徵也若略取下雙釋所由也上兩句釋事不獲已不得略所由下兩句釋不樂其繁須略所以謂若略減取梗概即事義未盡行事不得不獲須繁若不爾者即類單題之略必若是分外之文於我鈔中成其所諱不樂此也若不爾者即類多列遊詞之繁略者說文簡也去繁取要故謂之簡謂三藏廣文鈔取簡要行事謂略也減者古斬反損也又下斬反秏也並轉訓少於此簡要略文之上更減少取云略減綱骨而談謂之梗概事義未圓用之恒有不足事不獲已故須其繁指事釋者如遮難中隨難解釋是也若梗概而說列遮難名字問之若問不解終為非問受戒不得事不獲已須隨難解之雖繁顯事要故必者說文云終也傍求曰橫論量曰評如受戒法必欲終其緣本橫論五受等文除羯磨一受餘四佛滅皆無並是不急之言於行事鈔中便成忌諱既曰刪繁今有閑詞豈不須忌不樂此繁須得略也上則顯事用故須繁下則不急之言須略也古人諸記皆云通其伏難今不敘也言今至卷者由上不樂其繁事不獲已復不得略即圖度而取文也今於當宗他部經論傳疏圖謀比度取同文同義之中非謂不繁不略為中也務在𡞞少兼其約限也凡欲取一事事或有多處出文但取一兩處文餘者不取務兼𡞞也兼稱當宗約限而取如可分別聚落集僧當宗雖無其文而有院相限約彼十誦中更有勢分今但取十誦隨聚落界即僧坊界不取勢分務兼約也取當部文亦𡞞約也約其時所要事𡞞少取文也救急至三卷者結所為而成三卷也有二意勒成三卷一為救新學急知二為備擬碩德卒要新學覧其三卷即知上卷明受說安恣之眾法中卷明篇聚持犯之別法下卷明隨機要行之共法隨其新學欲知何法直取覧之必明救急知也備擬碩德卒要者碩德先已學知臨機事須教印若是眾法事起直撿上卷依行備卒要也為斯兩緣故勒成三也此則明其欲勒成所為意未則分卷成三并是呈述作先謀也次大門第二由恐新學未瞻先謀更別撰文言若至於後者由前述鈔先謀務兼𡞞約救急備卒故有闕詮闕處在此略標舉後時更為別撰述也若如也如此新舊二人依下三十篇行事神思未賙贍時事處向下當未贍處略標意趣更為造文也思神思也贍賙贍也時事者隨時判其輕重之事固者實也鈔中實有關於所行之行能詮教文也故輕重儀序云遂刪補舊章撰述事鈔猶恐意用未周准此即是若思不贍於時事固有闕於行詮也下二衣篇中略標指趣彼云今且依鈔者一意位分三別一者性重一切銅䥫等物入重二者性輕百一眾具可隨身者入輕三者或事重用輕或事輕用重但以教網具周必須文顯則略標如上輕重必須文顯意指乃趣向後續與撰輕重物儀依律具列十三章門一一解釋彼文廣鈔故云以廣於後即二衣篇末云餘有不盡之文事不具委具如別判輕重物中亦須類知而通解也問何以得知作此釋是答准輕重儀序末云余所撰刪補行事鈔三卷篇分上中下也門有三十不同言有二十餘萬若僧法軌模住持綱要者則上篇上卷首領存矣若戒受種相持犯懺儀則中篇中卷名體具矣若衣藥受淨諸行務機則下篇下卷毛目顯矣故輙略總引粗知梗概今於下卷衣法之中禪解亡物略分十門即其義也禪續也與也續前鈔後更與撰輕重物儀故云禪解准羯磨篇亦是此意文云但鈔意為始學人本令文顯而易見故不事義章一一分對進不必欲通明須看義鈔此則略標指趣也以廣於後者羯磨序云昔在諸關輔撰行事鈔具羅種類雜相畢敶但為機務相詶卒難尋了故略舉羯磨一卷別標銓題若科擇出納興廢是非者彼鈔明之但約法被事援引證據者在卷行用然律藏殘缺義有遺補故統開諸部撮略正文必彼此俱無則理通決例並至篇具顯廣作十篇解也鈔諸篇中有指羯磨本疏等文並是斯義謂此文未即急要故指後廣明也若爾鈔主先謀更為撰文理當前釋下文引文及首疏義指廣如彼今此序中何故不論耶答凡所引文義意皆足鈔指廣如彼者意令博學濟貧若約行事不看彼之廣文足得明矣此是便指不是的要序中故不明也若爾前文亦非急要何故先謀為撰答若不看首疏及諸律論廣文行事意足知若無輕重儀羯磨戒疏則判輕重及其餘羯磨持犯等義則未通解行事有礙故須得也古人科云南山自謙者意不然也第十鈔興意中云余智同螢等是謙詞也此正分雪𡞞約用文恐後學神思未能賙贍輕重事類等此鈔略標更別為撰文非自謙也亦有記中取大綱篇中嘿儐來釋南山云亦有經中出其羯磨尋本未得未得即是闕詮關詮即闕能治之行以廣於後者付將來碩學者亦不然也文中但云亦有經中出其羯磨尋本未得何曾有付後學之語約南山後制造中亦更不述此羯磨意也若據以廣於後之言只是羯磨之文復何能廣思之上來正明作鈔先謀勒成三卷所為竟次當第二釋成三卷旨歸生起篇目十門之意於中分三初釋成三卷旨歸二但境下生起三十篇目意三至於下生起十門意前三初標次釋後結言然至位者謂上述作先謀中勒成三卷救新學之急知濟耆德之卒要然未顯卷中所明分齊今次釋成三位也夫教所詮義有眾別共三約此三種之教不同隨教義成一卷故義張三位也言上至起者謂上卷明於眾務之儀則也所以先明眾法者發正云夫欲秉法行事先須治罸惡人等望云此太局一篇也今言眾法在先者夫僧居止要須託處故先明秉法僧體即約受者以戒為宗若集此僧則論足不有緣不來送心是非明僧體用竟須辨羯磨法之如非則須結界界法成就得行僧法治罸惡人惡人即無情眾無難則為人受戒說戒安姿等然後方自護持戒身清淨上則眾別各明若離斯二眾別之法不得成立或有要行眾別兩須故云共法則居後也約如此意故眾法居先遵於戒體者謂出家之人護本所受是遵戒體知持識犯持則持相犯則犯相是其所解有違洗懺遵戒體故隨機者隨上中下根機要行亦上中下三別如是要行皆托事而起且如對衣食者上行之人但三衣一食託此衣法受持食則口口興治方便中根之流則對百一之事加法受持隨食興其觀法下根之類聽畜一切諸長托此有說淨要行約食一時作興治觀法且約衣食以明自餘約行則有十二頭陀要行對病則有兩種五德要行乃至諸部別行宗途要識博學濟貧並是要行也言並至亂者結不亂也尚書云紊者無運反亂也絲亂曰紊蚕口初出之絲由未條理為紊也謂三卷分教各有條理分明想後學見之無其如紊之亂也言但至道者解者多途當陽析中皆云生起三十篇名近古發正諸德並云釋成三卷初生起者且教有眾自共等依教勒文為三三法不可雜明理須立其篇目篇中所引教法並是三藏真詮恐時人寡學不知刪補皆是佛聽故生起十門包舉佛教大綱取證信依聖教生起次第寔曰有𠗦若准釋成謂教有三種不同故文分三別三卷各收境事境事寔繁今取物類相從用標三卷之首上卷物類並是眾法相從將其眾務成用有儀以標上卷一十二篇名首中卷自法戒體物類咸明護戒相從約遵於戒體持犯立懺標其中卷四篇名首下卷並是隨機物類要行相從故以隨機要行標下卷一十四篇名首故云物類相從標名首也且上來總未立其篇目那得即判標一十二篇乃至十四篇名首故不可也且依古意就中有二初兩句略述意難二今取下正科分意境者從所對得名事者情事非情事及一合事其類甚多故曰寔繁今欲科分以為章段比擬極難也述難意竟雖難理須科判則不可細分但取物類相從以標名首謂之得也物者一切事法有其分段皆為物也物必有類以同類故可使相從聚一處也易曰水流濕火就燥雲從龍風從虎聖人作而萬物覩本乎天者親上本乎地者親下則各隨其類也今立篇名亦取物類相從天然合爾問鈔主自創物類而立篇名亦古人有斯意也答要覧十篇亦以物類相從以為篇也彼云吾聞同聲相侶同氣相求物有群分方以類聚幸立篇命旨應聚類從篇故知上准易文復𠗦要覧也且如標宗顯德篇者夫言行門則宗於戒然戒有多種不可盡頒但以宗名往收無不盡欲顯戒之德相但以顯德名收何戒德而不顯三藏教中總明故搜一化之文顯德之類相從以標戒之名首第二集僧通局者約所集之界作法自然作法有三類不同自然約相即六種差別雖則多種相從皆是集僧事用次約能集之人則七種差別始從一人終至二十人界各有通局界皆約集僧事用但以集僧通局標名乃至諸部別行亦爾然諸部別行其類甚多行既不同並相從辨異總標諸部別行何別行而不收故用此相從標其名首也言至於至遠詮者生起十門意也文有兩意初兩句生起意二更以下正立意至於者指此及彼之詞也自呈述作先謀至物類相從名首為至指後十門為於謂此雖呈述作先謀至物類相從首於佛教大綱之意殊所未明今生信十門於名首下更括出也上雖約物類相從生起立篇目竟然相從物類皆是三藏遠詮中來恐但見此三十條流於彼遠詮之意未能委也統通也大者包含也綱者綱領也條流者古解不同花嚴等以三十篇為條流發正以十門為條流今取花嚴三十篇也謂上三卷三十篇文皆通包含佛教遠詮綱領之意恐人但見三十條流事法而未能委知此用彼意也更者重也以用也前已呈先謀直筆具舒三藏聖教所取行事之文勒成三卷生起三十篇意竟然彼三藏中有多種教興意多種輕重意約教判意毗尼四法教取文意合決通意律教所詮意道俗七眾通局意僧尼二部通塞下三眾異同意許不具說文句直引要言妙鈔則准此用文然未曾稱述今更重用十門往三藏中搜取眾多大意此之大意教能詮之被於未來依行得果名遠詮也今此序之方則如鏡之明曉了得知佛遠詮意則顯三卷鈔文統其十門之意即知此鈔與佛意不殊不唯現在獲益亦望被於未來乃至令得涅槃明知鈔興非師心耳上來生起十門竟上來有三初釋成三卷旨歸二生起三十篇目意三生起十門意三段不同總當第二釋成三卷旨歸生起篇目十門意竟上來有二初正謀作鈔分成三卷所為之篇內眾今論取別意也釋中明二教通局意二文廣下指經廣明辨此更分以是鈔統之大意初三初標顯理多途情求分二二一謂下雙釋二教體相差別三然犯下雙明二教得罪重單言顯至二者總標諸教以情求為分二之由顯理之教者謂顯明菩提涅槃五乘之理逗機緣而不一教乃有其多途也故論云牟尼說法蘊數有八十千等而者躡上連下之詞教雖多種不同而南山以情求之可得分為化行二別故戒疏云化通道俗必無乖行但出家局唯戒律如上情求故依化行大分為二七眾通者取佛出現化儀名化教也局內眾者偏約所行三行目為行教若約化行二判五篇七聚是行教收十定慧攝今且約十善其七五不無相濫約其所宗條然自別化則內心會理行則外事護防身口以情求之取分二也釋二初別釋二教不同之相二然則下總料簡二教宗體相濫使異之相初二初化教二行教言一至述者有四意初標所被機通二約教辯三明行業四顯來報謂小乘經論等雖有隨律之處通俗人者故曰也汎者論語侃疏云廣也彼云汎愛眾君子運廣愛之心也但者偏詞也但廣明因果邪正而行業不可知之經論廣明善惡二因苦樂兩果善因者八萬四千波羅蜜門一切善法皆是善因獲得三乘菩提人天等位皆是善果如惡因者八萬四千諸塵勞門一切惡法皆是惡因獲得三塗等趣是惡果也有云泛者不尅定論但通途說苦樂兩因果也識達邪正者三乘四諦為正二十五諦為邪三寶為正六十二見為邪無求而求為正有所得邪科其行業者花嚴云化行但論煞生而不分煞生有其輕重今欲料輕重之業故難知也立云此教論心外相難識故難知也今解料分也分別所行之行所作之業汎深秘密而難知也且如淨名身居俗位入婬舍酒肆博易興販而內懷四等利物為先若以行分別汎深秘密不可知也業者無厭足王治國大業多以煞戮善才聖者籌佇生疑況今凡夫而能知也遂執善才手示以宮殿百千光明語善才言我得如幻法門上於虫蟻不起煞心況人是福德者而興加害乃至波須蜜多女等示色為業語善才言坐我床者即得解脫接我脣吻得三昧門其業汎密而難知也顯其來報如善報者法花中授舍利弗當得作佛號曰花光國劫正像住世皎如目見故云明了易述也惡報者花嚴經云煞害之罪能令眾生墮於地獄若生人中得二種果報一者多病二者短命乃至口業之罪能令眾生墮於地獄若在畜生則受鴝鵒鳥形聞其聲者無不憎惡若生人中有所言說人不信受斯事皎如目對故云明了易述言二至𮘧者二行教也文有四意初局所被之機二約行業取捨三辨教文委回四顯結罪再科富陽云行教者毗尼事相非行不成教能論之故云行教大毗尼藏匠御出家五眾發足興行終登道益也取捨者輔篇云二持依行名取兩犯須辨為捨又犯重求辨名捨犯殘可救名取故律序云可救有十三也又七法治令改過名取惡馬滅殯無再収義名捨有人云十三難沙彌定捨輕遮已出家者不應駈出定取立綱致者致舉也如網有綱舉目正也今立五篇七聚之綱舉二百五十戒目也又立眾行為住持之綱非法舉治自共二行網目然正也顯於持犯戒戒釋相是謂為犯顯犯不犯者下顯持又僧尼戒本廣顯止持略顯作犯廿揵度廣顯作持略顯止犯也決於凝滯於言教不了曰疑於事罪不通曰滯謂調部增一波離於一一教罪疑滯問佛世尊一一解釋決疑滯也又戒戒境想後四句中兩句疑兩句想而於事罪本迷始終無罪轉想有前心蘭是名決疑也乃至諸揵度文皆有決疑滯也指事曲宣者有人云指婬事委曲宣說約境三趣人男女非人男女畜生男女於上三趣男女有覺睡眠新死未壞少分壞委曲而宣有三千六百句律文一披即解不在再看故云又無重攬之義一戒既爾餘戒句法不定委曲亦然結罪明斷初戒結罪初動身口吉進趣輕蘭執捉重蘭入如毛頭得夷因中隨住隨結至果攬因成果但有果罪是明斷也事有再科於此婬事上學而識知故作其罪有二一則違制二是業道不學而犯有不學吉於事疑吉不識提總是再科之𮘧也第二總料簡二教宗體相濫使異相中二初雙標二教相濫宗判自分二謂內下正對辨宗自分之相言然至矣者化制二教也修說又云行也環圓也謂化行二教皆有婬盜煞妄教文環圓次第攝護修行不別非無相濫也由上相濫今舉宗以判理自明矣即下文化教約理為宗行教制防身口以事為宗也謂制教所防處淺化教所防處深深淺既自差殊事理條然自別故云理自彰矣也言謂至教者辨常云如以內心所發善惡未動身口早結其犯須准化教所斷以理為宗外用施為等者如律有所運為若持若犯要動身口已方准行教判以事為宗內心違順者違則嗔順則貪貪順嗔纔發則有所違且化教約心理是心本理既寂滅有動則乖若違順俱無則順於理體又釋違理起惡順理修善成持若托理者則准化教約外施為防護身三口四發言身作事始表彰約外事離七非即依行教也三雙明二教得罪重單文二初辨罪重單二引經成證言然至罪者如違化教則輕謂煞盜等但受業道一報也違行教者則重非但業道兼有違制故曰重增聖制之罪也言故至罪輕者善生經也經明二人同作一罪不受戒者罪輕受戒者罪重違理故豈非業道及違佛制故得二罪也問佛既知眾生應犯何須制戒重增其罪若其不知非一切智答佛何不知所以制者有能持者則功成聖果若不制則失斯益縱有破者遠有出期以善業孰得解脫故若其不受長淪生死無有出期譬如病人服於寫藥雖知加困即有差期也第二文三初指經廣明作徵立之由漸二所以下正嶽更立所由三恐迷下正釋更分之意顯鈔統斯大綱一唱言文至別者慈濟等云謂指上證文善生經中自廣明也古人將此文結上今將向下生下徵起之因謂經文中自廣明二教差別此中更約化行分三者何也故言所以更分者恐迷已下正釋更分所以也恐迷二教之宗體所以更分化教以理為宗用心為體行教以事為宗用身口七交為體今於經律廣教之內分其分齊故更明也恐妄述業行之是非化教以內心無相為行行教外事防非止惡為行化教犯者有業道無違制業但依理事二懺皆除行教犯者有違制業及業道業事須篇聚依律明懺及與理懺方滅恐行教犯者不依律懺妄述依於事理是之與非故更分也又恐行教自對外事防護身口七支為是妄述化教約心無相為非又恐依化教者約心無相為是妄述防護身口七支者為非也故立此第七一門永用蠲簡除不達二教之迷也故下諸篇不通俗者是行教収懺篇及道俗化方通道俗者是化教攝並依此大綱也第八門二初標次釋言第至意者標也上對道俗七部明化制二教宗體行業不同足無疑濫而於道中更簡僧尼二眾同異之相故明也僧存略梵尼約女聲男女類殊故稱二部通塞者如初篇四戒二部同制說名為通如僧有教誡日暮尼有紡續二部㸦不相通名塞下三十篇中有僧尼通塞意皆准此大綱釋文二初明二部通意二餘有下辨二部塞意前二初明事法相同統鈔諸門詳用二若辨成下重述犯相難易指鈔及戒本自分言然二至用者婬盜煞妄壞生畜寶非時不受食等僧尼戒同名同戒如集僧明足與欲結界持衣加藥等同是佛制故名同制事法相同事則情事非情事情非情合事法則羯磨白四白二單白對首心念並同謂與大僧相似故曰相同靈山問云何不言共戒耶答受法別故故不言共戒也對事進趣施為謂之行用人法如非謂之儀式類例𠗦准僧法具在二十九篇之中除尼眾別行一篇隨意詳用發正云除三篇尼眾沙彌諸部等三意謂不然如沙彌篇尼沙彌法式不異若知諸部行事曉識宗途極為要也言若至相者如尼家弁成犯相尼以僧俗男為犯相僧以尼俗女為犯相僧尼戒本從來自別若隱而難知具在隨相者如婬即有眾多難相且如尼婬處有三七毒歷之得二十一句如此難相具在鈔僧隨戒釋相中也諸戒總有不能繁序有人釋云取律本隨相者不然此之十門鈔意皆統易知指在尼家戒本男女互為犯相彼處易知若隱指在鈔隨相因明僧戒相尼戒難相便為出也若指在律中如何論鈔中行事故尼別行中云尼八重中前四大同僧中故末出也故知即指鈔隨相中第二辨二部塞意分三初標次列三此下結略指歸言餘至戒者標也男女形報既別防過亦殊故云約位之戒故尼別行云今簡取唯別者共為此科使臨事即披不事浮縵第二列中分二初列不同之相二而是下簡取盛行難知統下別立篇顯言謂至異者輕重不同如摩觸尼得夷則重僧得殘即輕又漏失僧得殘則重尼得提則輕尼造房得提則輕僧得殘故即重一事上僧尼輕重不同有無互缺者僧有輙教不差教誡日暮等戒尼眾即無尼有不作本法六法言人紡續四獨等戒僧則無也故云互缺犯同緣異畜鉢不說淨僧尼二眾俱得提罪即是犯同僧開十日尼須當日說淨即是緣異又與外道食戒同犯提罪即是犯同僧與外道男女皆犯尼與外道男犯女不犯是緣異也言而至中者不同戒中簡取種相難知當世盛行指在尼眾別行篇明也後四重中觸八䨱三十七殘中言人四獨單提中紡續並是當世盛行及種相難知故釋如摩觸是婬種腋下膝上腕後此相難知八䨱已下例然則顯世不盛行種相易知不釋如本法六法不作即犯易也自餘諸戒世不盛行故總略也故鈔云餘上下戒非無種相行希寡用且略而已別行即自行七法相攝及八敬等是眾行即受說安恣等是皆指在尼眾別行篇中明也言此至大疏者結略指歸謂結略鈔本末明尼戒來詮指歸不同之意在首疏也有無互缺即是分宗宗途自別輙教日暮不差即是僧宗紡續四獨即是尼宗輕重不同犯同緣異眾行即是分類約摩觸鉢說淨及別眾行僧尼同制同依而男女之類不同輕重約緣有異故云分類猶未顯其來詮者如其篇中但直明宗類不同觸八四獨等戒猶未明本犯緣起人誰見誰可誰舉自佛世尊在何處制如是制戒來由能詮教顯故曰來詮此但分其宗類未辨如是來詮諸有不同之意具如大疏上但明其不同未明不同之意不同之意故指首大疏中彼疏云如畜鉢大僧何故開十日釋云具二義一僧寔多利用於十日欲使籌量布施人故二大僧不制有伴喜獨遊行無伴可對故開十日使覔伴對說尼師反前故不開一夜此即是不同意又摩觸尼重僧輕者尼則煩惱厚重既受摩觸必為陵逼成大過故方便之內制與重名故得夷罪丈夫摩觸必無陵逼不須深防限分中制故犯輕也又女人貪觸情重得有背夫從他之義此則輕重不同之意問尼有伴故鉢制當日經宿結犯者如長衣戒尼亦有伴何故由開十日耶答二尼同伴有同活之義既總是財主說淨不成須求別人故由開十日衣有分義同活故開鉢不可分決屬處定隨有即說故不開也第九文二初標次釋言第至意者標也靈山云雖下三眾戒法未具然俱是內眾為制教所局戒戒之末皆結其罪而未知隨行之相與大僧同異如何故有此門次之明也五眾之中三是下位云下三也發正云一梵云戒叉摩耶此翻為學法女學法之義如下所解二梵云沙彌舊為息慈謂息惡行慈唐三藏翻為懃䇿謂為大僧勤人所駈䇿也三梵云沙彌尼此翻為勤䇿女謂為大尼勤人駈䇿也隨中之行異之與同於此門中辨其意也下三十篇中皆統斯大綱之意耳釋中二初明二種沙彌與大僧尼同異之相二式叉下辨六法女與大僧尼同異之相前二初對僧辨其同異意統諸篇二自外下別顯行法全殊統下二篇之意前二初便明體一數異二就餘下正辨行同位別言二至於十等者有二意上則體一下辨數異此謂沙彌能令心相與大僧同所發業體故不異也故云同大僧無作㟧云准律大小揵度中沙彌得戒具列七支則總發故善生經云十戒無無義語兩舌惡口是義不然我今受持淨口業故俱得七支智論亦同彼云佛法貴實語故以不妄為先自餘通攝不待言及則許沙彌於情非情皆發得戒與大僧不異故云同大僧無作故鈔下文云十戒三眾情及非情同大僧發也又相疏云十戒者案心論及多論並須普緣情非情發如戒體引乃可有漏不滿具不具別若爾何故但列十戒耶答以非具位且就力分故唯說十復以惡作義通故戒戒結罪不得以但說十即不令分學其猶大僧豈可盡說五篇戒耶位雖未滿然戒分學故普緣也又復此十即為具戒體故報恩注云沙彌十戒比丘具戒始終恒一隨時立名譬如樹葉春夏青秋時則黃冬時則白隨時異故樹葉則異而其始終故是一葉戒亦如是常亦一戒隨時有異也問體與大僧既同所發境不異何須更受具足戒耶答約其所防有五篇輕重先但得一今如其四為滿足故佛制受也非謂後受戒體更新得也言就至末者此釋行同位別也隨行類等塵沙對諸惡境皆能防護無作之體若異何故能治是同即行同也結罪居第五篇者靈山云沙彌但有所犯無論輕重皆結吉羅吉羅居第五篇非謂第五篇中別有沙彌吉也就位在諸戒末者律結成犯相云比丘比丘尼波羅夷式叉靡那沙彌沙彌尼突吉羅沙彌在其戒末位也此位別也言自至明者行法不同者行其五德是行說十種法破於外道是法大僧都無即不同也取捨有異者㟧云有供養三寶故得自摘花菓開壞生為取也不為供養三寶即制名捨大僧尼等無有此義名為有異此等諸文在下沙彌別行篇中具明也各者謂二種沙彌同者同在沙彌別行篇明尼沙彌與僧沙彌別者在尼眾別行篇中明之故云各也第二式叉中二初辨宗異體不異別生一位之文二自餘下明通行同不同統尼別篇所顯言式至發者發正云為對古師立義於受六法言下更發得無作戒體為破此義以受沙彌戒時此六法戒體已發竟故云或體更不重發首願同破也式叉摩那此云學法女今為女人煩惱垢重將欲受其大戒先以調伏身心則以六法調心為受大戒緣二年調身知有胎無胎身心清淨堪受大戒以律中度任身女人起過故制二年學之六法者一不受染心男子摩觸防初戒故二不盜四錢防大盜故三不煞蟻子防煞人故四不得小妄語防大妄語故此四為護初篇根本四性戒故五非時食六飲酒此二是遮戒此六種法女人喜為偏制令學也若犯四根本即滅儐若犯四戒方便隨缺皆得一一重與不限多少如至二歲垂滿於此六中隨犯一法皆須更與六法也此六法女受沙彌戒時體已發竟今但遙作羯磨後喚來語六法令三歲脩學故云是其學宗此體更不重發也言自至顯者上明其同二必有下辨異謂除六法之外名自餘也隨行者隨戒起行名隨行也同諸三眾者諸釋不同當陽折中云僧尼為一沙彌為二沙彌尼為三輔篇兩解初解同前次解云一大僧二大尼三二眾沙彌進退無在學之者問位既未滿聞戒成難云何令學答於其戒律雖未合聞准母論若於隨行和上須教而不得說罪名種相但行護離過也必有不同者得與大僧尼授食自從沙彌俗人等食又不得與沙彌尼過三夜自不得與大尼過三夜是不同之相如下尼眾別行篇中明也第十文二初標次釋言第至意者標也來意者前敘教門意圓所被之機意足則顯鈔所引用正文之意去濫傳真𠗦何刪略聖言所未明故次門辨其諸意也鈔者撮略為義引用真正文意去濫意傳真科酌意文勢離繁故舉之乃云引用正文去濫傳真科酌意也引用正文者初標根本僧祇明是本一之教次列五師分部即使有無不同今取四分為所宗當律無文即辨引用餘部餘部若無次取釋律之論論無取釋律之集自餘諸部無教可用略不言之釋律集無取大小乘經論古人章疏從本列至未顯是鈔引用文意欲望鈔文還如本一之教此是引用正又意去濫意者文義淺局多附世情久已焚除愚藂猶用今列名使識隔彼愚心是其意也傳真不可盡取事須隨科要者斟酌意取堪來入宗佛令直引要言是科酌意也釋中二初開章二解釋言初至意者開章也釋中三段不同則分三別初明引用正經次明世中偽說後明鈔興本意前二初引正經後明異執前三初標次僧祇下列釋三並具入下通結指歸言初至本者標也是佛所說即是真正兼明羅漢釋律本亦名正本列釋文二初別列數本二自餘下通舉餘文前二初列佛所說律藏二毗尼下明小聖釋律論集言僧祇至分別者依經列也鈔主大集經第二十七彼經古人兼以注解經文所引僧祇最居其後今鈔將祇是根本部此是本一之文餘是五部所以向前或本疏云大集云夢㲲一段後分為五也經云廣博遍攬五部經書是故名為摩訶僧祇鈔依首疏故注云是根本部餘是五部故首疏云總別有六僧祇是總以此部眾僧行解虗通不偏執遍順五見以通行故故云廣博遍攬五部經書故知是總是根本部餘是五部者故經云如是五部雖各別異故知餘是五部也今僧祇者不是根本僧祇八十誦律也准集正云根本僧祇合有多卷今有四十一故知非也今此僧祇謂是二十部中大天部也又如二十部中法藏部既許是曇無德何得不許二十部中大眾部是僧祇律耶此律是釋法顯至中天竺天王寺得來晉義熈十四譯四十卷案京目錄凡九百十七紙曇無德至所宗者經云我涅槃後我諸弟子受持如來十二部經書寫讀誦㒹倒解義㒹倒宣說以倒說故覆隱法藏以覆法故名曇摩毱多此云法密部經云覆隱法藏即密義或云法藏亦密義即四分律也觀音云言倒說者凡明行法先因後果今此律主就化宣說先果後因以倒說故故言顛倒解義也鈔者所宗鈔主師承元依四分作鈔故曰所宗曇無德律者前後兩譯初覺明弘始十二年譯四十五卷後法領至弘始十五年譯六十卷凡一千三百一十五紙薩婆多部十誦律經云而復讀誦書寫外典受有三世及以內外破壞外道善能論說一切性悉得受戒凡所問難悉能答對是故名為薩婆帝婆受者執也此部三世有實體一切性者三性之中悉得受戒即十誦律也薩婆多部者晉弗若多羅弘始六年譯五十八卷卑摩羅叉譯善誦為三卷都六十一卷凡一千四百三十紙彌沙部五分律經云不作地相水火風相虗空識相是故名彌沙塞此之六界並說為空云不作相也彌沙塞者此云不著有無觀即五分律也彌沙塞部者釋法顯至師子國得來至宋景平元年佛陀什譯三十四卷凡五百九十七紙迦葉遺部解脫律此有戒本經云說無有我及以受者轉諸煩惱猶如死屍是故名為迦葉毗外道執有實義受用塵境為受者轉諸煩惱者轉猶捨也故以舉喻猶如死屍此名重空觀則解脫律迦葉遺者此云解脫律此有梵本未譯唯有戒本一卷後魏興和二年般若流支譯也婆麤富羅部此律本未至此依大集分別也經云皆說有我不說空相猶如不兒是故名為婆蹉富羅解云婆蹉者此翻為犢富羅此云子正是犢子部也此部計我非是即蘊亦不離蘊而有實我梵云婆羅畢栗吒託那新譯云愚異生舊譯為小兒准此經中應言猶如愚異生以其異生計有實我指此為喻經云小兒即愚義經云善男子如是五部雖各有異而皆不妨諸佛法界及大涅槃問此依大集分別准大集經中列有六部云何亦有五部者答諸家不同相部東塔通其僧祇總有五部鈔准首疏總別有六今依師承不勞廣敘僧祇是總故云遍攬後五是別故云不妨諸佛法界及大涅槃故經云摩訶僧祇其味淳正餘部如彼添甘露也問經中僧祇在後鈔列先者戒本疏云僧祇實先滅後方有以廣博故通合五意故是總也所以初列第二明釋律論前是論後五百問下是集一唱言毗尼至集者問此之論集云何在律本中列者答准南山目錄並是律部所收也㟧云毗尼母論八卷苻蘭譯毗尼之義從此論顯顯現是生既從此論而得顯現故名此論號毗尼母如母生子故得名焉善見論八卷五百羅漢善能解釋名為善見外國僧伽䟦陀羅譯摩得勒伽十卷天竺僧䟦摩譯薩婆多論九卷失譯即是律主名依主得名并傳者僧祐撰薩婆多關西江東師資傳五卷鼻奈耶律十卷或云毗奈耶但梵音輕重不同是大乘律後秦竺佛念譯毗奈耶是梵律是漢音漢梵雙彰名毗奈耶律明了論一卷陳時真諦譯兼出疏四卷一一條牒律師事法而釋其理分明故云明了五百問法二卷後秦卑摩羅叉答惠觀法師五百問因以立名也時談曰卑摩軌語惠觀纔錄都人繕寫紙貴如玉出要律儀者梁武帝出二十卷以律教開王得聞遣疑令王心淨故所以梁帝准律集也出其律中行用要之儀則名出要律儀第二通舉餘文中二初別標略諸部之意二并大小下通舉所取論經言自至列者自前律論已外者名曰自餘二部十八二十部別名眾部也分部既多名為文廣無𠗦引用故不列也鈔雖不列講解略明准唐三藏傳一百年後分五部如上所列二百年後分為十二部四百年後分十八部部執論宗輪論或十八十九文殊問經有二十部舍利弗問經有二十二部今總會之為二初明二部次辨二十部初者准舍利弗問經分二者一大眾二上座部上座部內耆年雖多而僧數少大天朋內耆年雖少而眾數多准婆沙部執咸有緣起不能錄也第二明二十部者宗輪論云如是傳聞佛薄伽梵般涅槃後百有餘年去聖時淹如日久沒摩竭陀國俱蘇摩城王號無優統攝瞻部感一白盖化治人臣是時佛法大眾初破所以爾者大眾部中凡多聖少上座部內凡少聖多是故二中大眾先破至二百年流出三部一一說部二說出世部三鷄胤部次二百年大眾中復出一部名多聞部次第二百年大眾部中復出一部名說假部說世出世法有假有實不同一說一向說假又不同出世一切皆實有也次二百年滿有一出家外道捨耶歸正亦名大天非是前緣造逆大天於大眾中出家受戒多聞精進居制多焉彼部僧重詳五事因茲乖爭分為三部一制多山部二西山住部三北山住部如是大眾中合成九部一大眾二一說三出世四鷄胤五多聞六說假七制多八西山住九北山住其上座部經爾許時一味和合三百年初有小乖爭分為兩部一說一切有部二上座部轉名雪山部次三百年從說一切有部流出一部名犢子部次三百年犢子中流出四部一法上部有法可上二賢胄部賢者部主之名胄者苗𧜟之義三正量部謂權衡刊定名為正量四密林部謂近山林青翠蓊繁密部主居此從所居為名次三百年從一切有部復出一部名化地部次三百年從化地流出一部名法藏部或名法密此羅漢是目連弟子習師所說以為五藏一經二律三論四呪藏五菩薩藏為法所護次三百年末從一切有流出一部名飲光部梵云迦葉波此人身光極盛飲蔽餘光令不復現此之部主是彼苗𧜟故名飲光至第四百年從一切有部復出一部名經量部此師准依經為正量不依律論此經部師從主為名如是上座部出十一部一說一切有二雪山三犢子四法上五賢胄六正量七密林八化地九法藏十飲光十一經量并前大眾九部合二十部也諸解不同不能繁述且一家爾第二通舉所取論經文二初通舉經論二與律下釋所取經論之名一唱言并至律者并大小乘經者涅槃花嚴等大阿含遺教等小及以二論大小乘二論也智論地持等大成實毗婆沙等小問此大小乘論與前釋律之論何別耶答前釋律論一一皆解律文後小乘宗途執計所明定慧等法即是小乘非是正解律文故不同上與律相應者此上大小乘論與律相應也名隨經律者隨經中有解律文處名隨經律戒疏之中有隨經律及隨律經疏云一部律文知何不說制局篇聚出僧道所行傍兼心視通彼四部時明餘戒惟俗二眾以義判文初是當宗餘二隨律也隨經律者如涅槃中八穢七篇二戒如阿含中七滅六聚犯聚等相豈是俗行故名斯文為隨經律上所列者是經中有解律處即顯下三十篇中所引皆是隨經律也言並至中者通結旨歸也並者總從正本乃至二論來故云並也一一盡具書在彼錄故云具入也非其偽本故名正錄錄者記經目錄也費長房者姓費名長房是隨文帝楊堅時人其人廣識多聞深解佛法當時改後周大蒙二年為開皇元年開皇得二十年後改為仁壽元年其人於開皇年中撰三寶錄都十五卷案京目錄內題云歷代三寶記凡三百八紙第二明異執分三初標次別列三已外下結略未盡之名指歸別顯一唱言次至抄者情見不同名為異執法聰者㟧云魏朝人未詳氏族本是僧祇律師自考戒法原興便依四分羯磨律本流行隨方不同關內僧祇江左十誦四分一律由在藏中未曾行用聰云既依四分受戒何得餘部隨行則於藏中撿四分律講說流行雖未出疏文口以傳授即此云四分之首故最初列覆律師者聰之弟子隨講說錄出疏六卷即疏之始光律師者齊朝定州人姓楊氏前覆律師疏雖六卷光乃再綴所聞兼意參釋後便改疏四卷成文百二十紙故云二度出疏理隱樂謂洪理曇隱道樂並北齊人洪理著鈔兩卷曇隱造抄四卷道樂造抄一卷遵統者名洪遵北齊僧統纘疏八卷洪淵律師學承遵後有疏未詳卷軸雲暉願三師並光之門人道雲造疏九卷并抄一卷道暉造疏七卷法願隨朝西河人製四部律疏是非抄兩卷道洪法勝二律師並隨朝人各出抄未詳卷軸智首律師姓皇甫氏造疏二十卷五部區分抄二十一卷法勵律師趙人姓李氏造疏十卷基律師有疏未詳根緒已外下結略未盡名也曇瑗律師陳朝金陵人僧祐律師梁朝人鈔主前身靈祐律師隨朝相州演空寺俗姓趙氏定州人七歲欲出家父母不聽自歎七歲不得出家一生壞矣至二十二受具大興佛法諸師以下總述其人不一明也及江表下指處江是京江表是江外同州等並是從關西北並名關內同州雍州等也黃河之南號州也蜀部神錦部類數州諸餘已下總述其處不一明也義抄者濟云鈔主集義鈔亦三卷海東有師將去此無本也第二明世中偽說分三初標次列三如是下結釋上文兼餘存略一唱言次至略者偽經已上標也發正引邁法師撰譯經圖記云夫言翻譯者皆以記某時某甲三藏同譯人徒眾執筆迴文及置大使并判官翻譯使等具注日月譯記奏聞然後依此人錄即有流傳之益今大小乘經論涅槃經唯識論等並是入正目錄數費長房錄皆以廣論記傳辨其佛法真偽因茲撿古來大有造偽經及以諸論如文所序將辨真偽大分有四一者偽經論金棺經獨覺論等一向是偽此後代愚人妄自造作非佛所說故稱為偽二者失譯准費長房錄第十三十四條踈大小乘經失譯如提謂寶印毗羅三昧經像法決疑經等並是大乘失譯中列當時譯出此經屬以國土喪亂無有目錄記得三藏名字及以譯時年月雖是正經入失譯之目三者疑偽如諸佛下生經淨行優婆塞經等此經文理參餘正譯之經以濫其真經故云疑偽又名字與入藏目中少同參涉真經無有目錄記傳所載可𠗦故云疑偽又解如上失譯無傳記可𠗦亦令人疑偽也四者正譯即如摩騰所譯四十二章經涅槃等經論是也今詳長房錄更無疑偽之科此失譯無可依𠗦即疑偽也焚除者靈山云隨朝集得偽經於尚書省前焚訖藂者聚也謂愚者多聚頭為藂猶自濫用者商略猶濫引用此偽經論於章疏中證成行事即愚用者非一謂為叢也且述與律相應如前所列者謂偽經等與律相應即列與律不相應者盖不錄來鈔列故云餘文存略也第三鈔興本意中分二初標次釋言後至意者標也問鈔依何興耶答固令撮略正文包括諸意是鈔興本意也靈山問云前已序作鈔意竟今何更明興意耶答上文見其古人章疏如非行事之文繁略不堪濟於新學是作鈔興由便明述作鈔文體勢而未知鈔依何教跡而興裁略聖教今明本興之意也釋文二初正辨鈔興本意二猶恐下便明恐增不急之意前二初明鈔興本意二庶令下辨鈔興所為意前二初總而略明二余智下別而廣釋言夫至也者總略明鈔興本意也謂佛許撮略是鈔興本也律云諸比丘欲不具說文句佛言聽之論云佛令引要言妙詞直顯其義固者實也鈔主實依佛令刪繁補闕式固者執也謂鈔主執其佛教及與論文令刪繁補闕也乃曰固令謂以筆採取三藏之中要當之言逗機得益微妙詞句為三十篇中行事之文謂之撮略正文包舉也該羅也謂包舉該羅律論之中事法大意作三十篇中行事文前之意謂包括諸意也第二文二初自述謙詞奪歸知本二每所下既識其本廣明鈔興之意前二初謙智淺人微敢裁聖法二雖然下奪歸知本顯引用有𠗦言余至論者上句自謙智短如螢耀之最微也輔篇云以我智望佛智如螢比於日月也博雅云腐草為螢亦名熠燿待之熠燿之羽光盛之皃也熠為立反燿以灼反又釋佛智如日無幽不朗菩薩如月比佛不如聲聞如星光更劣也我智如螢自不能照豈兼於他下句謙其識淺故比之踈膚踈者准溫室經心遊理外曰踈膚常小人之稱謂自謙我識量淺近不能深達至理如彼膚常之人何敢已下正謙撮略意也侮謂慢也猷法也豈敢輕慢三藏聖法之真言謂撮略正文包括諸意有其去取似於輕慢也何故不敢為動成戲論故不敢輕侮而撮略也戲論者准智論四謗義夫一切法不可定執言有增益謗言無損減謗亦有亦無相違謗非有非無戲論謗我智短識淺所略聖教恐動則成四謗故略舉末後一謗安國法師釋云第一離增益謗者然佛說有而非增益不說一切實有但說圓成萬德為有故二離損減謗者然佛說無不成損減不說一切皆無但說遍計為無故三離相違謗者佛說亦有亦無而非相違如乳中酪性不應定答但言亦有亦無遇緣成酪可說當有不遇當壞可說現無四離戲論者亦云愚癡謗佛說非有非無而非戲論眾生有煩惱即得言非無如來斷故無即說言非有涅槃佛已證故說言非無眾生既未證故得言非有凡聖兩種各有一種非有非無不成戲論言雖至本者雖然者前縱後奪之詞也雖然智短識淺不敢論其有無我學有所承承必知本也謂鈔主親承首律師所學故戒心疏末云承首律師講律凡得二十遍靈山云初聽首講得十五遍欲住出家師頵居筠反大更勸聽得五遍中間僧事頵自為知故云學有所承也人疑云律教事淺何須多遍見僧傳中休法師聽洪律師四分律三十遍諸學徒曰余聽涉名矣至於經論一遍入神今聽律部逾增逾闇豈非理可虗求事難通乎承必知本者發正云即曇無德四分律即是所承之宗尋其本者四分律主依大律藏分出此文由於迦葉結集尋其迦葉說自如來今四部律文及諸經論無非佛說佛令欲不具說文句聽之今依此制之本以作斯鈔故前列正本云曇無德部四分律也鈔者所宗若欲取他部者從本至未先觀與四分文義緩急輕重相開即取不等者不取上不違於佛本中與迦葉相當下復順我所承撮略皆是佛聽望無戲論第二文二初明刪略廣上撮略正文包括諸意二而抄略下躡前撮略廣上固令前二初正明刪略包羅行事之文與意二及教通下兼陳文意之下餘論難義指別所明一唱言每至顯者覆檢者先解之事今日作鈔親更披檢覆之虗實雖自曾聞或兼學解恐與本文有違更覆其言撿之取實也靈山云鈔主讀藏經得六遍及諸文疏如上下說也於事之下癈立意多者自古諸德制造章疏皆存癈立諸意如是所存情見實繁廣也今刪其不當之文略除癈立之意云並刪略也故知上釋刪繁他部經論不取並得稱刪也止存文證者謂心存其要行事文及文前所立之意取證以為鈔中行事也指事釋者古今咸引羯磨竟文釋也今依羯磨疏引於羯磨言下何時得戒此一事下廢立意多羯磨疏云具戒發時在何言下答如智論云羯磨竟時得有律師云與汝受具足戒竟得又有師云是事如是持者是竟時也又有云心論第三羯磨一剎那項作及無作是根本業律師已為第三說字是得戒也自古諸德制造章疏總存上解是情見繁廣鈔主今並刪略云解者多途也心存文證者謂心存要當之文取證鈔中行事鈔云今立一法以定謂三說已云僧已忍與某事竟此時羯磨竟也故羯磨疏云理同智論受戒竟也及教通餘論等者謂持犯篇末雜料簡中有六律相一剋漫二錯悞三自他四分身口五教人自成兩業各分六多人通使緣別業同如是教文通多論解故云及教通餘論如是理相難知自非通解律論之人新學焉能究盡指義鈔所顯也鈔主自云鈔者意在易識即行前論難知故且刪略也又鈔戒體合通多成二論廣辨是非唯依成論本宗而解多宗則是餘論彼論別有大種造等流色約七十五法六門分別如是理相難知自非通律論之人焉能究盡故鈔但標二論不同是此義也文中甚多旦舉一兩消鈔文耳富陽引律中有三寶四諦法相之教義與經論相通涉者此之道理體相難知靈山約律用成實論為宗明其戒體名教通餘論發正約律文同義異四句而興爭論名通餘論就此三中富陽發正應好靈山論體鈔中現用思之第二文二初依論立理覆前撮略意取佛聽二故文云下引教證成固令之旨言而至意者有二意初引要詞二自外下明取不盡釋前證文不盡取意也富陽云謂此鈔中鈔略律及經論先德文紀為其誠證之文多不具足委悉盡取皆須與此部文義等者取故云但取文義堪來入宗自此已外餘有不盡之文若必欲於此所引文外尋討事之始末則非我行事鈔者之意也且如標宗引文成德中但是讚戒之文即抄略將來證其戒德而不具足委悉取其始末如引地持云三十二相無差別因皆由持戒得若不持戒上不得下賤人身況復大人相報今引此文來證戒德如是讚戒德文義堪來入宗雖引此文不知彼地持中為何人說此對治何事即是自外不盡必欲尋其始末非鈔意也證中二初四分二毋論言故至聽之者問刪略諸文皆是聖說豈非損減依何理教而有取不取耶答有教可𠗦故今引此律說戒揵度因節會日不知聽說何法當說義時不具說文句諸比丘生疑白佛佛言聽之准此文意我今作鈔若不具說即無過也言毗尼至義者謂非但當部有文許刪母論亦許花嚴云彼論諸比丘問佛佛言若說法時從脩多羅乃至優波提舍隨意所說十二部經欲示現此義復有疑心若顯次第說文眾大時文多生疲厭若略撰集妙詞直顯其義不知云何佛聽諸比丘引經中要言妙詞直顯其義證成堪來入宗者取無過也故知撮略包括皆是佛令鈔主固依佛令即上固令之旨顯矣言庶至福者上兩句明鈔臨機有用不假問人下兩句彰教理明無疑罪福庶望也上來如是刪略證文望使新舊二學臨前機宜有用不待更訪問他人求學即事即因所對前事撿文依之即行教文既明可復更疑被事得成不成之罪福也故輕重儀云即以此律為本搜括諸部成之則何事而不詳何義而非決即斯義也且如受戒一事即有一篇廣明八法調理九法往來望令此篇臨受戒機有用無待訪問他人遇受戒事依文即行教文既明豈復疑得戒不得戒之罪福也言猶至矣者輔篇㟧云鈔主自意所作繁處須繁略處須略特為折衷濟其新舊二學但恐後代之人加不急之言增益鈔文也真宗無穢荒草曰蕪不急之務時所不行喻若荒草恐穢鈔之真宗也學行教者見有不急之務乃致迷惑若言行事鈔復有不急之言若言是疏復不牒解律本兩不成之故致此迷也鳥鼠之喻即存於加不急之務日矣鳥鼠者案佛藏經文彼喻破戒比丘形相似僧業行如俗不似一物無所名目猶如蝙蝠聞人覔鼠即飛昇空云我有翅而是其鳥聞人捕鳥即入穴中云我有齒而是其鼠不似一物今鈔引意與經少異恐將不不急之教穢我真宗非鈔非疏如似蝙蝠非鳥非鼠不似一物故辨正論云蒼蠅招黑白之論蝙蝠有鳥鼠之譏也上來十門不同當第一別釋十門竟第二總結十門言此至論者此有二意初結上十門並束三藏大綱之意二若攬下生起三十篇首對事興之別意靈山輔篇折中富陽並云此之十條即是十門並總束諸門者下三十篇為諸門也發正將此十條為總牒以十門為諸門然兩捨之取其令釋有人云如來三藏一切教意有眾多門以此十條並收來諸門大意如如來教興意迦葉結集教興意乃至第十去濫傳真料酌意皆是三藏教中諸門之大意故日也例類例也隨其類例一一科分辨折如輕重即有七種類例科段分析條條並有不能繁敘寄在臨時若十條中攬收如來三藏一切教中別意不盡者下三十篇首對其篇中所明之事一一別論興意也如結界篇對結界事明來意云但為剡浮洲境等是也第三舉三行以判鈔結文行而盡収中二初已約三行判文二然則下釋成三行判文所以初分三初標起三行之意二若遵下正依三行判文三此三下結三行以收文無文行而不委言夫至位者標起三行意也折中問云前序中已分三卷竟今何更分者答前序中約能詮教分則眾法居首先集僧結界受說安恣然後方顯護持今約所詮行辨要自行居初自行氷潔方堪秉其眾行為眾自別前後兩異復顯能所詮殊謂前約能詮文次第要眾法居初今約所詮行之次第要自行居首故重分也宅居也佛者覺也覺道深廣喻如海也經云法喜禪悅食解脫味為漿非但居身於覺道海中復須資飱法食得解脫味故曰飡味法流也形廁僧伍㟧云廁次也僧眾也伍行伍也謂依受戒次第在於僧眾行伍之中發正云教行雖廣且約所修諸行行乃眾多要唯三位攝無不盡也謂身居佛海所飡法味形居僧伍即佛法僧寶所依有三所行之行亦有三種故云行唯三位即自行眾行共行第二正依三行判文文有三段一唱言遵至矣者發正云中卷四篇明其自行以脩道之本先項自行清潔然後方堪秉法住持謂識達持犯故先明自行也富陽云遵仰正戒者即篇聚懺六聚是即戒身清淨識達持犯即釋相及持犯是明其所解體者表體牒上遵仰正戒正明自行相者犯相不犯相牒上來識達持犯相狀正明所解解行具彰於四篇名為具矣自行至矣發正云自行既成結前外德彰用生後眾行謂上戒身清淨復能識達即自行成德相外彰堪秉持佛法之用即有一十二篇廣明眾行以其眾行為綱領如網之要者在綱衣之要者在領舉領毛端提綱自整眾行亦爾結界秉法治罸惡之匡濟眾務勿過此也自他兩德者輔篇云下諸篇中為成兩德自能成他他能成自故曰自他兩德如二衣中對首持衣自欲持衣假他對首若堪對首成他有德他來對我證我衣持自他相成為兩德也若准此解衣藥二篇可爾頭陀諸篇有何相對得成自他思之今解自他兩德則是牒前成相多途生後共行眾別相望總曰自他皆有功成名為兩德牒前引下共行意也成相多途者謂上自他不唯兩德能辨更有多種隨機要行途道成就相収則下十四篇事務不少一事之下隨機有法如頭陀要行隨機有十二不同如攝食隨機有其四種之法其事不一故曰成相多途毛目顯者謂毛是裘衣目者網目舉領則毛端提綱目整謂上之眾行綱領既存下之隨機共行在文端直如毛方整如目要者覽之自顯然矣言此至委者折中云三千威儀八萬細行教行則雖眾三行收之無餘故云此三明行無行不収名隨事顯對事而俻斯文教法雖多三卷之文攝盡故云三卷攝文無文不委也第二釋成三行判文所以文三初總述三行判文不易二若長途下別顯二種分之成非三今隨宜下結上所分之意言然至擬者問前云但境事寔繁良難料擬今復云事類相投更難量擬二處之文云何取別答前境事寔繁良難料擬今取物類相從以標名首作三十篇名首難今約三行分名首難與前異也言事類相投即有眾自共別乃至三十篇內各有三行事類相投今但通將三行分篇篇內由來三行交雜故稱量比擬更難前也事類相投者則三十篇各有事類三行相投聚一處也且如羯磨則有心念自行之事各有其類對首共行之事各有其類單白等眾行之事各有其類如是三行事類相投總標羯磨以為名首今將三行分三十篇謂諸篇中各有三行以此望前之難此更難前故云更難量擬也言若至碎者有二意初明不取篇目但隨行釋恐討論難二必隨相下若以三行就一一篇內曲分鈔文繁碎過若不約行通分其篇有此二過謂今以三行之位總分三十篇中三行隨行各聚一處不取篇目隨行長途散釋若要心念持衣行事卒不可尋為無篇目管之散在自行中釋文相難尋寡於討論即同古人言章疏繚亂不可披拾也隨相曲分者若存篇目但以三行隨三十篇中委回細分則繁碎也如一篇中有眾行事處將眾行科有共行處以共行科有自行處以自行科則使三十篇中三行交牙即同古人言章璅碎不可披撿也言今至依者有二意初結上三行分篇指歸隨宜約略二使舉下意令提綱目整舒覧事而隨依所言今者簡非長途散釋及隨相曲分准上約行分篇目也隨宜者隨前事宜故曰隨宜三十篇內前一十二篇隨明綱領之事宜以眾行科之中之四篇隨明戒體持犯之相宜以自行科之下一十四篇隨明機要之務宜以共行科之離其長途散釋討論難約略者事不委明故云約略約前一十二篇多明眾行之事或有自共二行之事隱略不科約中四篇多明自行之事或有眾共二行之事隱略不科約後一十四篇多是共行之事或明眾自二行之事隱略不科離繁碎過鈔主云此三明行無行不収也通結指歸者通途結略前一十二篇指歸上卷綱領存矣其中亦有非綱領事通途結略中之四篇指歸中卷體相具矣其中亦有非體相事通途結略下一十四篇指歸下卷毛目顯矣其中亦有非毛目事故鈔云三卷攝文無不委也使舉等者古人以毛為裘毛附於領舉領則毛端今將眾行為領一切自共二行因之而立則使舉眾行之領自共二行如裘之毛自然端直也古人以綱持網提綱則目整今將上卷一十二篇為綱攝持中下二卷教網上卷一十二篇之綱若舉中下二卷自共二行一十八篇網目自然周整問前分中卷四篇不為毛目今釋成中何故總攬一十八篇為毛目者答上約細行所分體相實非毛目今約綱領總攝體相因受始有俱得毛目之名思之載者玉篇及毛詩皆訓則也則舒列一十二篇名首在上卷之前開卷則覽見一十二篇之名隨前機要何事隨篇撿而依用下之二卷唯說古人不無雖判詞理不通略而不錄上來諸義不同釋成三行判文所以竟上來有二初正約三行判文二釋成三行判文所以兩段不同當其第三舉三行判鈔結文行而盡収竟上來有三初列三十篇目顯是鈔中所取諸教事法行用物類相從之門名二述三藏大綱證信鈔依聖意三舉三行以判鈔結文行而盡収三段不同當其第二述三藏大綱為作鈔所𠗦取證信依聖教文竟上來有二初序戒學之興替發起撰述之因源二列篇已下述三藏大綱為作鈔所𠗦取信依聖教兩段不同當其第二依序科釋文竟上來有二初標序題二依序別釋兩段不同當其第一序分文竟若准前科尋之可知自下大門第二正宗約三行以分篇卷則有其三別初約眾行上卷有一十二篇二約自行中卷有其四篇三約共行下卷有一十四篇前三初標攝上卷之通題二列卷首約行所分之篇目三牒篇解釋前二初解能貫一部之通稱二卷上兩字攝眾行之別標一唱言四分至卷上者通號如前卷上者謂眾行之法住持綱領故須先明三行居初此卷約其行分故稱上也言標至附者列一十二篇名目也前序通列顯是所取事法名首將統後之大綱故於十門前總列三十篇目今別列十二篇者約眾行所分也列在卷前者是前則舒張一十二篇在上卷之前開卷則覧一十二篇名首隨機要於何事隨檢依而行之此約僧眾所行名眾行也第三牒篇解釋中分四初有四篇明能秉之僧二羯磨一篇明所秉之法三結界一篇明所託之處四僧網下六篇明所為之事前二初標戒宗以辨僧體二下之三篇約集是非以明僧用前二初明來意二牒篇解釋初來意者問此篇何故居初者答佛法創興戒最先說三學相因以戒為本斷惑次第戒捉定縛慧煞五分法身戒分居首今撰事鈔統收三行以戒為宗又羯磨疏云眾行元綱勿高於戒戒能生萬行也又為比丘所依又行至涅槃皆由戒足准其行事以戒為宗故下引多論明在初也一戒是佛法平地萬善由之生長二一切佛弟子皆依戒住若無戒者則無所依三趣涅槃之初門若無此戒無由得入涅洹城也鈔下文云並出道者之本依成果者之宗極故標於鈔表問初科此文標戒宗以辨僧鉢今何以但論戒耶答唯標戒者令僧尼等寄心有在知自身心懷佩聖法即辨體也直而言之以戒為宗領納心相為其體也第二文二初牒篇名二初出下注文科判言標宗顯德篇第一者濟云標舉也謂總舉一部鈔之所尊宗者主也㟧云戒者是諸行之主故下文云發趣萬行戒為宗主崇義尊義繁而不敘因明其宗古今多別第一師止作為宗二部戒本是止持揵度已下是作持由止故自行成由作故眾法就第二師受隨為宗受是總發隨是別脩由總發故萬行從生第三師立止惡為宗凡欲脩善必須離惡惡既離已脩善方成第四首願二人教行為宗夫教不孤起必有所詮之行行不自顯籍教以明第五師立因果為宗謂二部戒本及以揵度止作二行總是其因大小持戒揵度已去即是其果第六雲律師言制在一代人時處事人謂須提那時謂五年已去處謂毗舍離事謂婬盜等前後不同一戒一經合有六百餘段別釋不可論宗此德不立宗也第七相州所立戒學為宗疏云今以宗求其唯戒學第八素律師立戒行為宗今南山所立以戒為宗故立此篇標於鈔鈔表律文四科建首以戒本為初二十法聚之中戒居其第一初顯是眾行之本既知其本宗義即成又羯磨云戒是定惠初基眾行元本本既不立餘何可𠗦又釋戒體初云准知己身得戒成不然後持犯方可脩離故約受明宗起行明離也言顯德者花嚴云既標其宗則須顯德非宗無以顯德非德無以立宗德者從果彰名謂功曰德以能持戒萬德從生若非此宗無以顯斯德也德者得也明佛三僧祇劫所脩萬行以持戒故功圓果滿萬德斯俻由持戒得今比丘等是佛弟子若能持戒現世名譽當招勝果亦名為德篇者戒疏云字從竹作乃是簡名自漢已前本無其紙例用竹木兼之紈素而用圖錄後漢蔡倫剏造於紙用易簡素古書簡𥮵可有一章以韋編𢍉連反也之號為一篇故尼宣讀書韋編三絕也第者居也如王侯之宅曰第此篇居三十之首故言第一第二注文科判中二初舉注科二夫律下依科別解言初至德者舉注科也第二依科別釋中二初夫至言論能盡來出其宗體二直引聖說下引文成德初二初至再轉乎汎明是明顯宗由致二今略下正出宗體前二初至過限歎教理橫深類世海之八德二故凡下約人違順彰其損益前三初歎教理深廣喻海無涯二雖包含下有犯必黜喻不宿死屍三騰岳下於戒敢違喻潮不過限一唱言夫至限者輔篇云法喻雙舉盡貫三科即法喻合三也夫律二字如前廣辨此言律者法也謂詮量輕重犯不犯法利國無方故喻如海且世海傍通無際日冲竪難究底曰深津潤通達物類俱霑其數既多故曰萬像萬者且舉一數之極故花嚴十定品云四大海水悉能潛潤四天下中山林萬象而今春生夏長吐花結實而不失時律海亦爾橫遍法界故謂之冲竪等虗空謂之深有解脫味謂之津遍十法界謂之通能令五分法身初生次長吐五乘之花結五乘之果皆不失時問五乘善道由戒故潤理不在疑如三惡道何能潤也答因破戒故則墮三途後有出期而得果證如蓮花色尼緣也又舉喻況如人有病與之吐藥雖蹔加困後必得差雖蹔墮三塗後終得果故慈和問云既言津通萬象即是包含無外亦應宿死屍耶鈔答云雖至屍者答也發正云世海雖復包含無外而不宿死屍律海亦爾雖復至廣至深而不容其犯重禁者故云不宿死屍也故律序云譬如有死屍大海不容受為疾風所飄弃之於岸上釋云初句自行絕次句眾法絕次句作法除弃次句穢不在淨次合偈云諸作惡行者由如彼死屍眾所不容受以是當持戒上兩句合初句第三句合下三句第四句勸持騰岳等者山岳也騰奔起也高低之浪小者如山大者如岳浪激白氣紛飛若雲故曰彼雲晝夜二時之潮而不過限律海亦爾制戒緣起為騰五篇七聚巖峻高位小者招吉如山大者夷殘若岳故云騰岳五篇七聚之上要起止作二持白業喻若波雲若諸弟子於制有違依二犯治不敢違越喻晝夜二時潮不過限潮不過限者輔篇云鈔引五分律彼說戒法中有八不思議法鈔取彼意問何不依當部答諸律及經八數是同就中五分名義世人易知與四分似同故取五分云潮不過限四分云不失潮法若准十誦不失常限與四分異故不取也若爾花嚴經等亦云潮不過限何不取耶答既云律海意不在經輔篇云欲將此文六句收彼八者先旦橫列鈔文六句次列喻八句次列法八句一一合之即易明也初鈔六句者夫律海冲深此句收第一德津通萬象此句收第七德雖包含無外此句收第四五六八德不宿死屍此句收第三句騰岳波雲後兩白收第二德而潮不過限次喻八句者一海漸漸轉深二潮不過限三不宿死屍四百川來會無復異名五萬流悉歸而無增減六出真珠等寶七大身眾生皆住其中八同一醎味次法合者一如來漸漸制漸漸教學之二我諸弟子於所制戒不敢違越三有犯必黜不宿容之四雜類出家皆捨本姓同稱釋子沙門也五諸善男女出家入無餘涅槃而無增減六有種種法寶謂四念處乃至八聖道分諸助道法七有諸大人阿羅漢向乃至須陀洹等住此法中八若有入者同一解脫味是為八此法八句一一合上喻八句第二文三初明持有益二而澆末下不持之損三故知下雙結替興歎持得益前三初勸護持二故能下明得益三良由下釋得益所以言故凡至世者有六答三句為一段初三句約戒以明次三句就定惠說初上句標人次句勸人持次句顯離過第二者上句標人次句勸脩觀行次句明脩觀離染辨常云此明三德也故者躡上起下之詞謂上津通萬象不宿死屍而潮不過限故凡廁玄門者或須清禁也凡諸也廁居也預在也玄妙也戒為諸行之所歸故喻於門者則牒在玄門之人也下句勸持剋剪緣非清禁身口清身身無惡作禁口口無惡說身口既淨無容更得過非生焉沐心等者謂由戒淨故三昧現前故云沐心道水也花嚴云洗身曰浴洗手曰𤃗洗足曰濯洗頭曰沐身最上者謂之頭心既主身之尊喻如頭也故曰沐心水能滌垢由戒淨故無生智起妄垢皆除喻智如水者則牒上沐心道水人也心能離念即為出要自然不染世六塵也言故至網者明現世益花嚴云淨持禁戒嘉聲外逸能生物善秉法被時千載不墜此時上身口益智所照處為迹以無生智起普照萬境五欲不能拘六塵不能染此迹自然超出也此句明上心益言良至德者良善也如何得益善由戒法清禁身口四儀自然氷潔非此戒法不能光益住時千載之儀非無生智道不能顯其迹超塵網之德故知此德由戒淨生也第二不持有損文三初人違教二是以下能損之心三致令下所損之境前三初至之流標淺識之人二雖名參下列其非相三研習下釋成非之所以言而至流者靈山云澆薄末下也謂是薄下淺識之徒膚者人釋不同鈔亦不定或膚或膚輔篇取膚膚常也靈山發正取膚玉篇訓皮上為膚膚裏為皮經云膚色死潔既是淺見之流第二列非相中三業分三分初雖名參下身業非相二情既下口業非相三意雖下意業非相言雖至有者上兩句學非下兩句行非緇黑色之衣謂上淺識之人雖名字參雜緇衣中習不積年名學非經遠行者靈山然戒律為萬善因基既於戒律學行俱闕善從何生故云何善之有言精至詣者既學不深行不依律心情於教則踈於行則野不能精究律藏之真要覆牒上文靈山引溫室經耆自傷云雖得也為人踈野義法師解云心遊理外曰踈形落俗中為野心遊理外覆上學非經遠形落俗中覆上行不依律封懷等者靈山云封閇也守株喻也韓子云宋人有耕者田中有株兔走觸株折頭而死因而獲之後乃釋耕守株為宋國笑時諺云守株待兔愚之甚也合云身無學解如樹無枝喻如株杌既不究真要乃封閇情懷束身而坐合守株也更不求學解者絕通其行解得益之望如待兔釋耕也靈山云詣至也局執也所執局事皆是師心日局之心首凡所出言皆無聖教可至向也言意至趣者情意雖論三乘之道不異於俗俗則在朝爭名在市爭利今名利心說法故不異俗同流者凡所出制約與鄙俗同其條流枷禁杖罰非法僧制則乖如來法律之真趣也佛意謂斷惑出纏今行枷禁苦惱心形與其大慈真趣故是乖也言研至之者如上淺識之人若能精研習學積於歲年猶迷事相如闇中托物或著不著況情踈野常談世間言論如是之人流誰能體得律行教也言是至存者容受也致舉也若容受致舉上來膚見濫委付以為眾首則亂法司司主也聚也謂修三法行人聚在一處以此淺識之人主當則令亂也肆者當陽云放也縱情同者為惡奪情違者之善謂故縱情懷任非而作專行暴剋者書云不教而煞謂之暴論語云剋伐怨欲不行焉可謂人矣剋好勝人也專行暴事欲勝於人尚非等者富陽云舉俗以斥非書云罪疑惟輕功疑惟重尚書云不以親而不誅誅其有過不以疎而不賞賞彼有功俗節既然上之暴剋何得許也道儀得存者道則無生智道四等為懷儀則三千威儀利物為本身心既行縱奪暴剋道之與儀何可安附而得存也言致至耶者此句人虧正學明所損境也慈云困弊也盤石大石也周易有其困卦深云進則踐於蒺藜退則困於盤石陰陽閇塞不通困也謂上縱肆之人新學遇之則進退俱失如於困卦輔篇發正云謂坎下兌上六友辭云困于石石不受物也亦是止遏不通之義非法眾主疾其後生令正教不得施行故云困於盤石也羈䩛者此句明斷法功能也慈云在身曰羈羈絆也在口為䩛此䩛皮必反無轡音久相承未知何也律要者二持是律之要詮教之文雖博止明持犯故知二持是律之要又羈者說文云馬絡䩛者車束也止持如羈結比丘身口七支不至作犯作持如䩛收束比丘三行不至止犯也令此非法眾主不遵崇於二持即是律要絕羈䩛也於時者於非法眾主令後學正教不行之時寧何也玄妙之鋼當於此時何不覆墜也第三雙結替興歎持得益文二初兩結興替由上違順之人二深崇下再歎深崇得益一唱言故至乎者佛智如日昔時已曜今僧尼護持尸羅發生淨惠豈非再曜法輪不再轉乎者諸佛之法三十七品輻網具足喻如其輪佛在已轉此輪今僧尼等戒淨有智惠便得第一道此輪豈非再轉耶又如來成道度人廣大比丘今日戒淨秉法度人亦得廣大即再轉也上來凡明是非顯宗由致竟第二大段正出宗體文三初略指宗與受隨為後進興建之本二夫戒下正立於戒為行事宗三何者下徵釋受隨顯宗於戒興建德相言今至記者顯略指也謂約能詮教下所詮之戒以為宗也夫出家五眾就其行教以戒為宗故戒本疏云律中列戒為行正宗欲釋宗義宗是主尊等義法躰行相顯宗家之受隨非受隨無以顯戒故下別舉法躰行相以顯之非戒無以收於受隨故法體行相之前皆標戒字故知戒者為行事之正宗若於受前名為戒法領納在心名之為戒體依體起行名為戒行行成德彰名為戒相今於立宗之首故略指宗體行相也令後進者興建有託者謂後學僧尼知戒為行事正宗驗往日自受戒時實若納法成體受後依體起行脩持離犯美德外彰即堪建立佛法興謂興隆三寶建謂建立法幢要須有戒以為宗根萬行依生名為有託第二正立宗文二初正辨戒從緣得二故經云下證有戒可持初三初隨器稱方獲二情無下差毫徵而則無三是以下勸專志而契入初二初兩勺總明宗趣下三句稱別解稱緣一唱言夫戒至道者問諸家立宗未聞單以戒為者今據何文將戒為宗耶答鈔於篇題之下自科出宗躰則知於此明宗文云夫戒者隨器為功領納為趣即受者之心趣向於戒宗趣義成故知以戒為鈔宗也又顯德中云發趣萬行戒為宗主又釋相戒有大用中云夫三寶所以隆安九道所以師訓諸行之歸𠗦賢聖之依止者必宗於戒主宗之義故得稱焉戒者牒舉宗也以由也隨器者慈濟㟧並云隨前人根器上中下不等上品根器容受如來菩薩之戒中品根器容受聲聞緣覺之戒下品根器容受人天之戒如水入器隨其大小方圓淺深戒亦如是隨上中下三器差別故多論云隨心上中下得三品律儀為功者德也謂戒無三品之別隨器受之不同器有上中下殊戒德自然優劣故曰隨器為功也行者牒能受行人以者用也想像在壞名為領納願謂領解納謂受也謂能受之人用領納心趣向於戒而能善身淨身善心淨心善身者䠒跪合掌口陳乞詞即表不合掌不乞戒為不善身淨身者身無遮難善心者緣法界境擔斷惡修善也淨心者專志攝慮要期護持此是正因稱緣而受者人僧界法成就衣鉢具足此增上緣一緣不具即非稱緣方則也尅獲也因緣雅合則獲相應上來所列並是相應戒與器相應領納與戒相應心善身善與戒相應身淨心淨與戒相應衣鉢人界與教相應當此之時則獲淨戒也言情至在者有三意初兩句總顯情乖事差次兩句徒受非器三為世下非世福田情是受者心情不能生領納戒之趣向也無遠者遍法界境悉是戒境於此境上不作斷惡脩善之心求菩提涅槃之趣又只擬受復無持心無此遠趣故不得戒問為從初受至羯磨終無其遠趣即不得戒為哉時耶鈔云羗之毫徵即不得戒毫者毛中最細微者塵中極小但如微塵之差如毫毛之眴息即不得戒又釋遮難人僧界法差毫徵者即不得戒靈山云毫微者語其細也得內心小尚不得戒況乖違之大也徒染者輔篇云徒空也受既不得趣道莫因空在法流故非道器道是三乘菩提以戒能盛功德万行故喻如器婆沙云功德所依為器為世等者謂身心不佩戒德則不堪為世良田故下文云所以為世良田者寔由於戒今即無戒為田之義安在乎言是以至滯者清身行徒者折中云謂凡欲入三寶數者要具戒清淨名曰清身方得入三行人之徒侶遠悕等者輔篇云要必須求三德涅槃圓常之果是所祈也不宜妄起散心妄造草盜也反諸境如微塵之許如毫眴之頃即不得戒結上兩句亦是遮詮必須下表示勸令契入念念不息領納戒心名專志無毫微之散心稱為攝慮求戒善心契會於戒法戒法納入於求戒心中名為契入由上專志攝慮無其簡隔戒法納心則無滯也又釋或非塵大色非緣慮心而無有礙名契入無滯言故至矣者引涅槃經第十六無作非色非心是無形色而能遍在色心之中十二入中法入所攝六識之中意識所得故可護持也證有戒可得故曰文明矣第三徵釋受隨顯宗於戒興建德相文二初徵二但或下釋言何者徵釋之所由也由上略指宗之受隨為後進興建之本及明戒從緣得以戒為宗而未知所受名何能領相㒵既無形色如何護持為興建之本也將欲釋之乃先徵起故云何者第二文二初標欲釋所以二且處下正釋受隨躰之行相前有三意初標戒相多種二約受者心取上中下戒不同三任境下就而論境乃無量為上三處彌漫不可歷別而論故出欲釋所以文近一唱言但至量者戒相多途者即成論有七善律儀且有漏木叉即五戒相八戒相十戒相二百五十五百乃八萬四千今就內眾以明二百五百八萬是多途也軼者田結反謂迹義也萬車同轍是一義也今戒不然有多種也又復隨受心之所取差別故云心有分限取之不同或上中下等三品之心取不同也若境者情境上至如來下至螻蟻非情者大如須彌小至極微其數非一故言無量向此境上取說成難任從也若從境彰其戒名故不可說即顯今不就此三界說也第二文三初總標列四種顯是樞要二言戒法下牒釋戒之體相三此之下總結旨歸言且至相者樞要者謂上多種戒相四種取釋俱盡又上心有分限取雖不同四種顯之理無不盡上雖任境彰名乃有無量以此四法釋之理亦俱盡故言樞要樞謂戶樞門之要義即門臼也即顯門之廣大開合自在要假於樞戒則無形而廓周空際欲令受者識驗自身往曰受戒得不受後隨行如非舉此四種足使知之如彼戶樞此四是戒宗之要若無此四不可得知自身初受戒之有無受後隨行持不之相也列數可知牒釋分四謂法體行相前二是受後兩是隨也前三初舉法令信二雖下雖通凡聖獨立聖名三但令下正明軌成出離相狀言戒至此者但談於法不局在於凡夫聖人也問所言法者莫不是法界塵沙二諦等法耶答南山戒壇經云法即戒也羯磨疏云體者正是戒法所依本也故知此法即是戒也若法界二諦等法乃是戒境非戒法也三乘聖人要佩戒印不局在凡佛為五洋眾生制於禁戒不局在聖但云如來大慈心中流出此法凡聖受者通有故不局也直明等者簡要說也此之戒法約受戒緣集中八法調理九法往來就釋相初戒法一門七段分拆文義廣博不可具舒今此直明戒法功用必能軌成出離道也軌謂軌生物解出謂出離二障成謂成三菩提謂此戒法必定能軌則行人善心出離二障成三菩提下文云高栖累外又戒經云戒淨有智惠便得第一道即用也要令等者辨常云要令受者發深信心信知有此玄妙戒法乘之則能出離三有必具五分法身也慈和云將欲釋立名應先問云凡聖通有為約已成者說未成者立名鈔答舉看言雖至法者答也就已成而言者謂沓婆等三乘聖人受得此法名為聖法不取今日凡夫受者為名但取已成聖者而言名聖法也初但言法不論凡聖今立名中除凡著聖也言但至也者問常聞生死為此涅槃為彼此何言返彼生死答心躰離念本無生死但由對境纏附生死過興今善淨身心於彼境上作斷惡意故返往日生死過心云返彼也靈山云真心本有妄從真生以本望末名為彼也作羨也廁次也興心脩善即建志也誓受佛戒自度度他即是要期栖心也輔篇云超三界之上日高栖出三障之表名累外必豫長養者辨常云則須師為早爾令發廣大心濟度眾生至無上道不得臨時名為豫長養也使隨人成就者慈云隨前人所期何乘之戒三品之心皆須尅獲而成就也乃可等者輔篇云堪可被緣也隨法行者隨要期戒法之心而起其行名隨法行問此中明戒法而言秉聖法在懷即是戒躰習聖行居躰即從躰起行即是戒行豈非雜亂耶解云上令信此戒法必能軌成出離之道意欲返彼生死乃高栖累外此心長養成就乃可堪加聖法末即己秉身若有戒趣聖可期所脩習行皆名聖行比行墮戒法而有名墮法之行也輔篇問此標宗中戒法等四與隨相中四法何別答大同小異此云直明此法必能軌成出離之道彼云即此躰通出離之道二體者此明能領之心不論所發業體三行者受已護持上下大同四相此約總說威儀論下約二百五十戒別明約持犯說第二戒體文三初簡非所發之業體二今下顯是能領心之相三正明納法在心釋成體義言二至體者慈云通論者通律之論即成實等所發業體者約作無作以辨業體以發身口業故故戒疏云或就業辨則作無作此則約其身口業為能發體為所發第三羯磨竟時發得此無作業體也言今至法者今就正領法心顯其戒體能領心相是戒體也心相者謂塵沙真俗二諦等法於彼法上作斷惡脩善誓成佛心此法與心正是心家所期所取之相當受之時心中不領此相即知無戒非其躰也問此何不約所發無作辨體而就能領心相明體耶答就戒定宗明行事體要有所得方則能辨故受者有心領得此法以法在心即知有得故就能領心相以辨體也若論所發無作由從此生約其發不冥然從何辨堪行事故不論也故下文云知自身心懷佩聖法即能紹隆佛種興建法幢是斯意言以己至體者華嚴云斷惡脩善求戒之心名曰要期壇場禮乞即是施造方便惻思者惻度塵沙二諦境上本無善惡良由心有惡念思惟空惡從何起良由妄起當此之時知境無惡妄念無生如是思惟發生明慧境既無惡惡心不生心與其法冥然契會故云冥會前法也以此要期者牒上斷惡求戒善心是要期心與彼妙法者牒上塵沙二諦等法謂體無善惡心能法彼無善惡體能法善心隔凡成聖名為妙法如前冥會故曰相應此一段文牒前語也於法上者富陽㟧云明此戒是依他起性因緣生法且如羯磨受者祈心立誓等是因緣僧界羯磨等是增上緣二緣和合至第三羯磨引發生起名緣起領納在心者輔篇將受戒人能領納心相名戒體也不是弁體狀業體也問今此戒體與前戒法如何取別答先信此戒法乃立志要期高栖累外此心成就三羯磨竟攝彼前心所發善法納在身心名為戒體故羯磨疏云法者是所納之體也第三戒行文二初正明二引證前二初釋行相㒵明對治之心二持心下結歸行名辨順受成行言三至聖者既受志心牒上體也脩不淨慈悲少欲等觀是廣脩方便防護七支名撿寮身口也威儀之行謂身口麤相既撿微細難持須行故云威儀行也高慕前聖者書云見賢思齊諸佛羅漢並持此戒能得出離經云彼既丈夫我亦爾故云高慕前聖也言持至行者持是受後防護之心故云後起今此持心正順初受斷惡脩善故曰義順於前也言故經至矣者涅槃第六證也雖非觸對者謂戒非色不可觸對不同眼根所對之色戒復非心不可觸對不同色等能領之心善脩方便起對治行今此戒體可得清淨故名戒行以此經文驗之成就戒義也言四至相者輔篇云對治既成行相無犯勤便稱法美德外彰色相潔清堪生物信故名戒相慈和云行相何別耶答行據內心相據外狀故分二也第三總結旨歸文二初結四條寔道果所依驗身佩於聖法二自餘下別有功能指說難盡一唱言此至盡者謂此四法前二是受後兩是隨如是受隨皆宗於戒為納戒故成受為護戒故名隨若但有受無隨戒亦不發若但有隨無受無戒可隨故以戒為行正宗受隨相資為其興建所託以此四法為並也出道之本依者謂戒能引出三乘之道即詺戒為本以此四法為道所依也經云戒淨有智慧便得第一道上明因也成果等等諸佛如來得菩提涅槃智斷二果名果者由宗於戒能成此果果因行成行假四法而立故詺四法為成果之極處經云如過去諸佛現在諸世尊皆共尊敬戒故以戒宗受隨四法列在三十篇初云鈔表也欲令後代僧尼寄心在戒若初受時有心領納依體行護即知自身帶佩戒印即知自懷其聖戒故云懷佩聖法也六道者智論云善惡有六善有三天人脩羅惡有三畜生餓鬼地獄下能為此福田上則為佛及聲聞緣覺之因因持戒故得三乘果由有戒故則能發起萬行為其種也六道福田三乘因種已外故曰自餘毗尼住世佛法則住故曰紹隆佛種道品等法積聚如幢非戒不立故云興建法幢如是眾德言亦難窮故云豈惟言論能盡上來出宗體竟第二大段引文成德文二初明引文來意二就中下正辨引文成德言直至諸者但取經律讚戒之文不錄起盡之語名直引聖說此說誠實證戒為諸行之根出家之要意令持法高士詳審明見諸教皆以戒為其本也高士者靈山云謂能持戒則是高士下經文云雖有色族及多聞若無戒智猶禽獸雖處卑下少聞見能淨持戒名勝士又此士字即會意字也上為十下為一一則數之始十則數之終謂始終如一故曰士也論語云有始有卒其唯聖人乎今法亦爾初受為始隨行為終故云持等也第二正辨引文二初開章二初中下依章別解前二初正列章門二但諸下明存略意言就至業者開章也辨比丘事者㟧云遠以四沙門果近以羯磨說戒等為比丘事折中問云覆滅正法如何為顯德耶答謂返損以顯德也只緣戒有深功違之則失言但為至略者一化者謂佛初成道乃至涅槃為一化也慈和問何故不言律者解云為律亦得名經又下文隨部具舒相亦難盡亦是律也第二依章別解中二初順戒則三寶住持辨比丘事二明違戒便覆滅正法翻種苦業兩段今初初中二初標次初又下依門解釋言初至門者化教是大小乘經論制門是律論也兩段不同今則是初就初文二初總舉數二一下依數解釋言初又分四總舉數也依數釋中則分四別一小乘經二小乘論三大乘經四大乘論初二初標二如般泥洹下釋初如文釋文三初顯戒為師德二然趣下顯戒為宗主三又如大地下顯戒能生成住持言如至斯示者㟧云般泥洹經兩卷西晉竺法護譯遺教秦什譯等取摩耶經師訓弟子斷惡脩善此戒亦爾故為師也言然至足者有二意初約教立理二故經下引證花嚴云戒為眾善之基萬行從生宗居在首故經云者善生經也義淨云據梵本合言迹梵言波荷此翻為足若言波荷陀翻為迹跡謂戒者前佛學此戒法而得聖果後人尋前迹而學得果也文中等字等取三乘聖果第三文三初依教立理二故經下引釋三即喻下結言又至萬物者如文引經釋中三初釋生義二又云下釋成義三又經下釋住持義一唱言故經至住持者前兩度引並是遺教經上釋地能生下釋地能成因其尸羅清淨能令三昧現前則定慧成就也疏云此約根條定慧不及自不能起必因戒也善生經能住持萬行故得根名彼經云戒是菩提道初根本地名為戒如是戒者亦名初地平地等地慈地悲地佛迹一忉功德根本亦曰福田以是因緣智者應當受持不毀言即喻至也者總結上之三義如文第二論中二初標次釋初如文釋文三初成論二解脫道論三毗婆娑論言如成至戒者案僧叡作成實論序云佛滅度後八百九十年罽賓小乘學者所宗鳩摩羅陀上足弟子訶梨䟦摩之所造也二十卷秦什譯文理雙標以教為成以理為實此論小兼大故分通大乘道品等者輔篇云謂三十七道品相扶持勝依此成道喻之如出賢聖上躋猶如樓觀戒居其下故如柱也定防內心故喻如城約身口故喻如郭入善人眾立云三乘賢聖名為善人眾也印信也若佩戒印信知此人必入涅槃城也三十七者發正云三四二五單七雙八合三十七初四念住一觀身不淨二觀受是苦三觀心無常四觀法無我此之四境由慧觀察慧與念俱故慧相從名四念住二四正勤一於已生惡不善法為令斷故生欲發勤攝心持二於未生惡不善法為不生故欲生等如前說三於未生善法為令生故生等如前四於已生善法為令安住不忘倍脩增廣故生如前三四神足者一欲三摩地斷行成就神足二勤三摩地斷行成就神足三心三摩地斷行成就神足四觀三摩地斷行成就神足五根者一信二精進三念四定五慧五力亦爾婆沙云能生善法故名根能破惡法故名力又說不可屈伏名力七覺支一念二擇法三精進四喜五輕安六定七捨此中擇法以慧為體八聖道支者一正見二正思惟三正語四正業五正命六正精進七正念八正定婆沙九十六問何故先說四念乃至後說八正道耶答隨順文詞巧妙次第故爾言解脫等者㟧云十二卷梁僧伽羅譯彼論第一戒品中種種讚美云戒者是無過樂即佛涅槃樂也更無過上是眾生上等須者看之戒則不羸也第三婆沙文二初標二尸羅下解釋言毗至器者總標也㟧云舊婆沙六十卷北京佛陀什譯然彼論中五百羅漢釋其戒義不同今引第二十五卷文略標之釋文二初先解標中四義二尊有下重解尸羅義前文四一釋尸羅二能善下釋守信義三至涅槃下釋行義四功德下釋器義初明尸羅文有九義一冷二夢三習四定五池六瓔絡七鏡八威勢九顯義一唱言尸羅至故者冷力鼎反折中云具含因果第二十五釋前無破戒熱破戒能令身心熱持戒則令身心冷第三十四釋及三惡道熱彼云破戒者三惡道中熱持者天人中冷音靈謂冷然清凉之㒵已下皆是三十四釋尸羅度文也亦名善夢者心不緣惡境所習皆善故夢亦善立云持戒人諸天衛護常得好夢也習者能習戒法納在心中故名習也亦名為池者論云尸羅言池故佛說偈法泉戒水池清淨無瑕穢聖浴身不濕必到於彼岸或名瓔珞者彼論云尸羅如瓔珞如世上瓔珞嚴身有少好中老不好戒瓔珞嚴身三時常好也海云聖人為老凡夫為少七方便為中無我像現者論云尸羅如鏡鏡若明淨像於中現戒若清淨即現定慧定則空寂慧則無生空寂無生誰云有我是無我像此無我像戒鏡淨故即能現之故戒經云戒淨有智慧也又名威勢者此文有二初舉佛勝人二餘下舉弟子亦名勝人論云尸羅者是增上義佛於三千大千世界有大勢者皆尸羅力駈龍事者論云昔迦濕彌羅國有一毒龍名無怯懼為性暴惡多為損害有毗阿羅數為彼龍之所嬈惱寺有五百羅漢共議入定欲逐彼龍盡其神力而不能遣有一羅漢名婆伽陀自外而來時舊諸人具說上事時外來者至龍所彈指語言賢面遠出龍聞其聲即便遠去時諸羅漢恠而問之汝遣此龍是何定力起何等通答曰我不定力亦不起通但護尸羅故有此力護其輕戒如防重禁故使惡龍驚怖而去由此尸羅是增上威勢義也又戒名為頭者福云新婆沙中亦云是尸羅義此有法喻雙舉今鈔文中隱喻顯法明也今先出喻次乃法合喻云如人有頭則能見色聞聲臭香嘗味覺觸知法喻竟法亦如是行人有尸羅頭者能見苦集等四真諦色聞未曾有聲及名句文等義臭覺意花香甞出離無事寂靜三菩提味覺禪定解脫等觸鈔但有初見苦諦諸色及未覺知色陰等法等取受想行識十二入十八界及五停心觀總相念別相念等法中間諸義略而不論故云乃至第二釋守信義言能至也者彼論云若人能善守護戒故名守信人謂信佛語守護淨戒第三釋行義言至至也者論云如人有足行至餘方若有戒足行至涅槃也第四器義言功至也者論云一切功德所依之處故名器也第二重解尸羅義言尊至涅槃者瞿沙名也彼論五百師外有尊者也所解最長其五百人師之案薩婆多師資傅從迦葉至達摩多羅有十二人其瞿沙尊者即其一也傳云大師名瞿沙菩提博綜強識善能約言以感眾心時一集會有五百餘人使人各賦一器然後說法眾會感悟涕淚交流以器承淚聚在一處有一王子兩目生盲尊者瞿沙立誠誓言若我必當成無上道利益盲冥無慧眼者今以此淚洗此人眼眼即當開既以淚洗兩目乃明於是四輩咸重也第三大乘經文二初標次釋初如文釋中有六一花嚴二大集三薩遮四月燈五涅槃六重引花嚴言花嚴至住者㟧云晉佛陀䟦陀譯舊經五十卷此有二意初引三種僧寶顯僧是持戒之人二去來下辨僧不違法得久住經第八釋尸羅度中有三復次初復次云教化眾生發菩提心令佛寶不斷開示堪深諸妙法藏令法寶不斷具足三受持威儀教法令僧寶不斷第二復次云讚歎一切大願令佛寶不斷分別解說十二因緣令法寶不斷行六和敬令僧寶不斷第三復次云下佛種子於眾生田生正覺芽令佛寶不斷護持法藏不惜身命令法寶不斷善御大眾心無憂悔令僧寶不斷疏解云佛寶初起求佛願二讚起行令其脩集三化成行種次法三者初是其教法二是理法三是行法次僧初僧行方便二行成不乖三德孰攝他今抄各取僧寶文者謂上二寶不墜皆由於僧若僧有威儀行六和敬秉御大眾僧能持戒則戒法興隆佛寶自然不滅故偏取僧也六和之義不文當辨顯上並是三世諸佛所說正法也不違其教者僧能具足受持威儀六和秉御不違此教則三寶不斷法得久住也言大集至戒者㟧云北京曇無讖譯三十卷彼經第十九護法品云說此經時爾時有十方世界諸大菩薩從他方來論道說義諸菩薩白佛言諸如來為五滓眾生制於禁戒唯願如來為法久住復制禁戒所謂身口意戒不得受畜一切惡物等如餘佛土所制淨戒佛言止止佛自知時請制戒意為法久住耳言薩遮至身者㟧云七卷或八卷後魏菩提支譯經云有薩遮尼揵子與八十千萬尼揵子遊行諸國教化眾生次至闍延城爾時國王名曰嚴熾其王敬重從其受學其人廣為王說種種法門次為王說沙門瞿曇名稱功德王問如此法身從何而得尼揵答言以戒為始大王當知以戒淨故不斷三寶種以戒淨故功德無量若不持戒乃至不得疥癩野干身何況當得功德之身王聞是語發菩提心也言月燈至士者㟧云十一卷或十二後齊那連提那舍譯又有一卷十紙宋朝先公譯立云雖有端正顏色族姓等經云譬如死屍著金瓔珞多聞破戒亦復如是謂持戒者勝士也言涅槃至經者謂一切眾生皆有佛性要因持戒然復乃見既見佛性自然證得大涅槃也言花嚴至首者前顯三種僧寶能令三寶不斷法得久住現在住持益今引此偈明戒是菩提之本勸持佛歎當來益也以戒淨故當得菩提今之望前故云重引也勸常記持故云令誦心首第四大乘論文二標釋初如文釋中三初智論二地持三十住言智至畏者㟧云智論百卷秦什譯欲釋論文分二初至出家之要標二如惜已下釋初有三意初欲至戒明戒是利義二一切至根戒是根義三出家下戒是要義標中有三釋亦有三初如惜至住處來釋根義二又如至所得釋要義三人雖貧下釋利義佛果菩提名為大利依寶活命故須惜也護命身則長壽是根義也無足欲行返顯要義解身等者准雜毗曇心問云何大能解支節耶答謂火大解時火大增遍燒筋節筋節解已不久命終水大解者先令筋爛風大解者令筋碎壞支節解已不過日夜命終地大不利故不能解心不畏者論云或見好相或自知持戒清淨心不怖畏也由持戒故得此不怖之利言地持至報者㟧云論十卷或八卷北京讖譯婆沙問云相是何義殊勝義祥瑞義名為相也三十二者一足下平滿二千輻輪三指纖長四足跟圓長五手足細濡六手足網縵七足趺端厚八繁尼耶九勢峯藏密十身分圓滿十一身毛上靡十二孔生一毛十三身毛右旋十四身金色十五常光尋十六皮膚細滑十七七處充滿十八身廣洪直十九師子上身二十肩髆圓滿二十一立身摩膝二十二師子頷輪二十三具四十齒二十四齒齊平密二十五牙齒鮮白二十六得最上味二十七廣長舌二十八目紺青二十九牛王睫三十烏瑟膩沙三十一眉間白毫三十二得梵音聲相無差別因者智論二十九云佛世世中一心持戒堅固亦不令他犯戒以是業因緣故得是初相謂足下安立相平如奩底也乃至持不兩舌戒故得四十齒相皆是持戒所得故云三十二相無差別因言十住毗婆沙者㟧云十四卷秦什譯論第十四有此二品初明讚戒品云略讚尸羅少分尸羅者最是梵行之本尸羅即是功德寶𧂐又是功德住處尸羅度人能過生死猶如牢船能度大海猶如良藥能銷眾病等次明戒報品云明菩薩能淨尸羅得離垢地第二地也常作輪王十善化人七寶自恣得如是報廣如彼說第二就制中二初牒標舉數二依數別釋言第二至兩者牒標舉數也釋中文二初明律本二依律論初二初標二釋初如文釋文三一僧祇二四分三十誦言僧至利者建立三行既彰秉法住持也三不欲有疑請問者花嚴云既秉持戒識達聖教不假問他也五遊化等者立云十方佛法教理無別若不識聖教至處多怖若順教而行遊方無怯懦也言四至等者者勵云雖有五句約義為三初一自行次三匡眾之行二行若成便能秉法彼時千載不墜是故末後興建正法行釋云念智捨等令戒清淨不為緣壞故曰牢固二破戒之人與持者相違義同於怨內心清淨超勝於彼三既無瑕舋處眾斷量理無懼憚四曉了持犯能決人疑滯故善能開解五若不持戒法不久住十利下篇辨之言十誦至爾者律四十七問云過去佛法幾時住世佛言隨淨比丘說戒法不壞名法住世也現在未來佛亦作是說故云三世亦爾第二依律論文二標釋初如文釋中五一明了二多論三見論四五百問五多論言明至事者了疏云引生有二一能引生四萬二千功德正法二能引生不悔之心乃至解脫智論云若得人天果為世善若得三乘果為出世善二能教等者疏解云能遮身口不令起惡即是能教義不為惑濁業濁所染故名身口清淨不為見濁所染故名正直清淨故向善道正直故向涅槃三能滅等者疏解云有二種滅一滅方便二滅正罪謂得擇滅涅槃由戒能遮諸罪障故名滅方便由障不生故得罪滅此二俱得稱為毗尼四能引者疏云能引在家令出家引未離欲令得梵住從梵住得聖住從聖住得有餘涅槃從有餘入無餘後轉勝故名引勝義乃至引到梵住者論說住有八種者謂汎明如來所居有八也一境界住謂如來依十六大國而住二依心住謂依祗桓僧伽藍三四儀住謂行住坐臥四不捨壽住謂八十年前住五分法身五天住謂佛常遊於四禪六梵住謂脩四無量定開梵天道七聖住謂住三三昧即空無相願三昧八住無所住謂住無餘依界而涅槃鈔闕前五故云乃至五勝人者了疏云最勝人是佛等言薩至彼者一切眾生由戒而有者㟧云人天勝報由持戒生三塗劣報由破戒得故一切由戒有也若准破戒者合在下違戒法滅中明故知非約破戒為一切也准涅槃第十明佛說偈布施一切唯可讚歎中純陀難佛其義云何佛答純陀一切者少分一切故知則是約三善道為一切也此約少分耳具斯四義功強餘經花嚴云指定慧也言善至年者五人持律者約經持僧說大集亦云一林一村五法師鳴搥集四方僧是名眾僧如法作大功德海若無量僧破戒但使五人清淨如法護持四乃至二十人出罪者初從一人懺悔迄至二十除罪故云乃至身既清淨得秉法住持則令法久住也住世五千年者論第十八有二五千年初五千年前一千年得三達智復千年中得羅漢無三達智復千年中得那含復千年得斯陀含復千年中得須陀洹後五千歲學不得通萬歲經書文字滅盡但剃髮被袈裟若准住世得果初五千年若論佛法住世不得果者即後五千年是言五至也者乃至中間應言佛若在世以佛為師等語今闕此言故云乃至若持五戒即見法身者持戒即戒淨因戒生定生慧即得解脫解脫知見故待五戒則見法身若護法下法喻雙明也謂離法無佛離水無虫若護法者即是護佛護水者即是護虫飲水即是煞虫損戒則是損佛如飲水煞虫喻者證上持戒見法身也謂鼻奈耶僧祇十誦諸教雖別二比丘緣大意是同今依十誦引釋爾時世尊在舍衛國時有二比丘夏竟從憍薩羅國來欲問訊世尊路旱無水唯見一井有虫其一比丘欲見佛故遂飲虫水其一比丘忍渴而死不飲虫水其不飲者命終生三十三天天身具足頭戴百寶冠先下到佛所禮佛足已佛為說法得法眼淨為受三歸五戒已便還天宮時飲虫水者後到佛所佛知故問具陳上事佛因呵責世尊即脫多羅僧示黃金色身汝癡人用見我肉身何為不如持戒者先見我法身第五多論文三初多論正明二又分別下引釋上秘故要在僧中三大莊嚴下釋成俗人不堪行義一唱言薩至也者前引多論辨其功強此又引之約明初集秘故簡其時處明其勝義分別功德論㟧云四卷或五卷失譯彼第一卷明二部僧尼說二百五十五百戒事引法防非秘密故非外官俗人所行亦非沙彌壬女聞見也大㽵嚴者㟧云十五卷秦什譯此是大乘論合在前明今與此中文勢相開故相從而引愚劣者靈山云三乘聖人有智故勝皆敬重戒得三菩提下愚之輩癡復志劣輕於戒法墮於三塗也上來明順戒則三寶住持竟第二違戒覆滅正法文二初牒所明之意二十誦下依標解釋言二至明者謂約化制二教雜明違失也釋文四初十誦下示滅法相二十誦下廢學毗尼苛責相三中含下犯戒現生感惡相四十誦下重引法滅可畏相前二初十誦二四分初二初明法滅二又有下明其怖畏言十誦至罵者小得心已謂外凡位人初脩總別二相少得相應便謂己得聖果二白衣等者羯磨疏云以俗人無法在身但專信故得生天也出家有法為世福田乃返毀犯妄受信施開諸過門令多眾生習學放逸故墮地獄佛法滅相彼律文中無打字言又至亂者不自脩身戒心專等者與涅槃第二十九文同今取彼意釋若比丘不觀身無常不淨名不脩身若不觀戒戒是一切善法梯橙等名不脩戒若不觀心躁動制伏調之名不脩心若不觀智慧有勢力等名不脩慧也不知三相者當陽云遣他掘地不解言知是者是斷草亦爾溉水者古礙反謂澆灌時不安漉水𤄷也言四分至法者持法等者脩多羅師持律者毗奈耶師持摩夷者阿毗達磨師摩夷者花嚴梵音訛略應言摩怛理迦此云本母即阿毗達磨之異名謂諸法相從論出生故名本母也第二文二初十誦正明癈學毗尼苛責相二雜含下辨初不樂佛不歎所以言十誦至律者律四十四云諸比丘癈學毗尼便讀誦經世尊苛責對面讚歎優波離諸持毗尼中最勝第一諸比丘作是念佛讚毗尼我等何不讚淨毗尼諸上座老比丘從優波離受誦毗尼言雜含至故者㟧云五十卷宋求那䟦陀羅譯靈山云總有四住初一夏至九夏名少年從十夏至十九夏名中年從二十夏至四十九夏名上座從五十夏已上為耆年長老也謂初不樂戒初見樂者不歎美也非謂後不學也我不讚歎者彼經第三十中謂佛自稱我也經出二過不重戒不學戒二不隨時讚美重戒學戒人有三十二過故不讚歎我若讚歎則餘人謂其行是學其所為則長夜受不饒益苦故謂律中先制五夏專精律部今受戒後初既不樂違佛制故便得不應如四天王天劫數長遠受三途苦故云長夜問佛合苛責何言不讚謂此人初受不學且學餘藏於後擬學故佛不讚恐餘人同其見學之違制得不饒益苦不同前律一向癈學所以佛呵也第三文五一中含二涅槃三摩耶四智論五四分言中至獄者㟧云六十卷東晉僧伽提婆譯五衰如文言涅槃至縮等者准下畜寶戒中引涅槃經云我諸弟子無人供給為護正法便即聽畜令付篤信檀越等今言不聽者為不持戒故也言摩耶至相者㟧云二卷南齊曇景譯彼經云八百歲後諸比丘等樂好衣服縱逸嬉戲九百歲已奴為比丘婢為比丘尼一千歲後不樂不淨觀千一百歲已毀謗毗尼千二百歲已作非梵行生男為比丘女為比丘尼千三百歲已袈裟變白不受染色千四百歲已好樂殺生貪賣三寶物也袈裟變白者濟立等云由不持戒不染佛法味名為變白准大集經中則有事變白彼經文中王大施諸比丘已問比丘法文云師等在此住我等當養育為我說法我當至心聽一切皆默然無有說者其王重勸請亦皆默住一切無說者王向諸比丘言可不知法耶語已袈裟變白染色不復現皆從床墮落宛轉在地也第四智論文二初彰過相二問下通疑前三初約五喻彰其過相二雖復下顯非比丘即明因中有地獄果三又常懷下出破戒人懷懼之之相一唱言智論至戒者論第十五文中皆引喻合如塚者塚死屍所居此破戒人身中法身慧命既無其身外相猶如塚也枯樹者枯樹即死無枝葉花果破戒人身如其枯樹諸善功德花果俱失唯有六尺之身猶如枯樹羅剎食他肉身惡心轉熾破戒之人害人法身惡心不息猶如羅剎大病臭穢人不喜見破戒比丘有二犯之臭清淨聖人不喜見故毒蛇害人肉身破戒害人法身雜復等者著法衣而行非法必感鐵葉纏身鉢非法受用違佛教故必感變為洋銅器又破戒者既不消施所得如賊畏身死後而墮三塗如是已下結勸持也第二問答文二初問次答言問至耶者論第十五卷中因釋般若義故有斯問云罪不罪不可得若人捨惡行善是為持戒云何言罪不可得耶言答至中者有三意初理觀難稱二若肉下舉喻顯非三今誦下疏出簡濫論云非謂耶見麤心言不可得行空三昧者心與理冥性相俱寂即罪福俱無故勝鬘經云我心既空罪福無主可言罪不可得與牛羊無異者牛羊有眼但見於相不見無相今人無其慧眼但肉眼見者唯見色異於空不見色空不二故與牛羊無異也彼論但云肉眼所見是為非見無牛羊等語今誦下鈔主簡濫言四分至道者身戒若淨即同說戒羯磨二種僧住纔一破戒弃於眾外豈非自害凡破一戒為俗士所呵即比丘呵佛呵制戒故云智者所呵四悔不持戒恨自破戒言十誦至法者彼第四十八增五文也鈔主合兩五為十優波離問佛有幾法令正法滅沒佛言有五法何等為五一有比丘至正受二又不能令他解了三不能令至儀四有說法者不能如法教鬪爭相言鈔闕此句故云乃至五不樂在阿蘭若處不樂愛敬阿蘭若處鈔云法也言又至畏者是次五文一鈔闕下半隨非法教二不隨忍法鈔闕此句三不敬上座無有威儀鈔無有字足者字釋云不敬即無威儀非謂上座無威儀也亦可深防恐不敬無威儀上座也四上座不以法教授上座說法時愁惱令後生不得受學脩多羅毗尼阿毗曇鈔闕脩多毗曇意在毗尼也五上座命終已後比丘放逸習於非法失諸善法是名法滅返此不滅也好作文頌已下古記皆云此是別文非關五數今謂鈔除第二以此充五者為末代好樂世法如此世法非出家者所行是隨不忍法三乘聖法是出家所行今不肯脩學是不隨忍法律總相明鈔指事說思之第二違戒覆滅正法竟上來有二乃至釋標宗顯德篇竟上來有二初舉戒宗以辨僧體二下之三篇約集是非以明僧用兩段不同第一竟今當第二約集是非以明僧用分三初集眾二簡眾三受欲三段不同今當第一集僧通局將釋此篇大分為二初明來意二牒篇解釋初來意者富陽云上篇所明戒德既脩須有施為事須益物度生秉御秉御之最莫過作法作法之始先須集僧故有此篇來矣解中分二初牒篇名二僧者下依篇解釋言集僧通局篇第二者牒也釋名者㟧福云盡家詳聚名為集僧來有廣狹故名通局篇不異前一上加一故名為二第二依文釋中二初釋篇序總意二故建下開章別釋前二初總解僧義二若不下辨集是非言僧以和為義者對古人將和合眾翻其僧伽鈔文簡異也故羯磨疏云具本梵音應言僧伽耶此土無名將眾以譯有加和合乃是義用故文云僧者四人若過和合者一羯磨一說戒也若以眾翻則通三人雖三成眾但非辨事據別顯德非四不成故存本僧也便辨僧體於中分三初辨僧體二辨僧差別三明多少言僧體者羯磨疏云約律准論取成實意攬指成拳攬陰成人人假為體實法無用為僧之體用無別體還以四人陰本為體如身口業無別有體還以色聲為體鈔主云今存此引是所當宗有人云然僧寶之本要法成乖法則百千非用具法雖一能辨經云脩六和敬令僧寶不斷須具六和謂戒見利身口意一戒和者同一受體二見同雖復同戒而見有異不得是和如調達等是三命和雖復戒見同命若有非和命異謂五部四邪等上三體同至於時務成濟要以三業相同方成和合應來集者謂身和應與欲者謂心和應呵不呵者謂口和也既俻三體能俻三和隨務成決此據德用以辨僧體言差別者既云集僧僧有差別羯磨疏云或凡聖分二就凡則內凡外凡就聖則四果四向或儀寶分二儀則持戒破戒寶則緇素不同以俗證果亦得名為第一義僧入僧寶數或功用以分即事理兩和理取會正非此所明事取其用正當機教也言多少者准多見二論則四種五種見論四者一有慚僧二無慚僧三羣羊僧四真寶僧多論五者一羣羊僧二無慚僧三別眾僧四清淨僧五第一義諦僧今言集者於上四僧中集其初後不集中二後五中集其後二不集前三以非法故亦可都集大眾之威改惡從善集竟然後簡足不足如後篇辨釋云有慚僧者謂持戒無慚者謂破戒羣羊者十輪云啞羊也謂不知布薩羯磨猶如羣羊聚在一處也第一義諦及真實者謂是四向四果別眾可知又十輪及真諦立四種僧十誦立五種大同不述言若不至位者謂若不齊集標人非也相有乖離者六和中後三釋人非也四儀背別是乖隱沒隔障等緣為離以人不集秉法不成被事亦非具三非也第二開章別釋二初開判章門二四分下依章牒釋言故至局者標中分二初解集僧之軌度二明來處通局前二初引教明二上具列下南山義設前二初四分總明集法二五分下別顯作相言四分至等者准律三十四說戒法中文也羯磨疏云所以先敷座後打揵槌者由聲告即集床座未施停待栖遑非成㢡務制先定座即在茲焉此即總明集僧之軌度矣第二文二初明集相二出要下翻揵搥名初二初引外鄣雜明集相七眾總得為之二若准下當宗不言比丘得作前二初五分能所雙辨二十誦下唯就能打人明言五分至打者彼二十二云布薩時不肯集癈坐禪行道以是白佛佛言應唱時至若打揵搥等不知誰應打白佛佛言令沙彌守園人打便多打白佛佛言應打三通初客沙彌不知處失時節白佛佛言令舊住人應打諸比丘不知以何木作白佛佛言除染毒樹餘木鳴者聽作也三通者從徵至稀聲絕之後加三搥是三通也染樹齩人為瘡毒樹者但害於人並是二時者謂大小二食時也後引諸打緣意證道俗七眾俱得打也第二文二初約士女二唯約僧言十誦至爾者海云為是提舍尼戒中比丘在蘭若送食女人也第二唯約僧中二初約阿難往擊二立維那令打言增一至也者㟧云五十一卷秦曇摩難提譯彼經云夏竟佛欲受歲令阿難擊搥集僧阿難往講堂手執揵搥作如是說我今擊此如來信皷諸有弟子盡當普集折中云以此鍾聲召集為信皷動物心也言十誦至也者此中有二意初正明二聲論相傳下轉釋維摩那義引文本意令立維那唱時至及打揵搥也洒掃塗治者靈山云西天踞坐食作滿荼邏著草及食於上然後踞坐踞坐防惡觸故縱此不踞坐亦須洒掃也教人淨果菜等者准本文云無人教淨果菜無人者苦酒中虫也智論十一翻為寺護有云梵名羯磨檀那檀那云授羯磨云事此翻為授事准十誦三十四白二差之聲論費長房錄云三藏攘那䟦陁羅譯即五明論之一數也言五明者一聲明即音聲也二醫藥明三功巧明四哭術明五苻印明悅喜也既得事之次第令眾歡喜故云悅也言若准至之者靈山云准第三是打地聲今文中闕也羯磨疏云召僧七相不離色聲謂量影望煙是色餘並屬聲也量影者立云以一尺木日中取影為則作煙者如今軍家烽火相也並謂先與僧相知作法用也破竹者謂將一丈許竹破一頭全一頭手捉全頭搖作聲貝者說文云海介虫即海中蠡吹可發聲也若唱諸大德布薩說戒時到者本非七數鈔除打地之相謂有濫惡故將此添以為七也亦不言比丘為之者為上諸部經律等並言比丘亦得打阿難擊十誦維那打等此律亦不言比丘為之意顯取諸律經等比丘打亦得故羯磨疏云如律令舊住淨人下位打者此召僧法制非具道者所為必無二人方聽兼助舉彼證此足知鈔文前舉諸部後准當律意顯打人不唯相也言出要至鐘者羯磨疏云揵槌者梵音聲論已下如鈔也第二義設中二初結前生後二凡施法下正明義設言上具至設者問上引律論足明集法何須義設者羯磨疏云且依西梵本無科約雜碎文相隨引解之事須義設方委事之次第也第二義設文二初總明集僧法戒二雜人下別立打鍾儀則言凡至中者准文鳴鍾者准前引教中約相五分打三通約當律七種他部除染毒樹餘有鳴者聽作約人他部七眾當律沙彌淨人准上約相約人約打故云准文鳴鍾具如集僧法中者㟧云鈔主別撰集僧軌度圖三紙餘文明打鍾法式彼云念三寶存五眾眾別各八輩故以四十為差三道乘之則百二十為節令則量時約眾最少以二十七為量八輩各三三八二十四餘之三下總集三乘故二十七中則四十多則百二十也彼處具列三法故云具如也今最取少者為准第二文三初商略古今總標大准二若尋常下尋常所召正顯其儀三世有下簡昔人濫言雖至之者㟧云大比丘三千威儀經兩卷失譯科要者約事既有多種極有科分要約也節解者約打數不同名節解也彼云若集比丘打四下集沙彌打三下優婆塞二下呼思彌一下若准下卷更有五事一常會時二且食時三晝食時四投牒時飾宗云投槃器也五非常時更有七事一縣官二大水三大火四盜賊五會沙彌六優婆塞七呼松兒飾宗云思彌松兒呼淨人小兒也大准者僧多緩為准僧少急為准二食常事緩為准忽然官事水火等事急為准通就緩急總明其儀故名大准第二文二初正明打法二然初下建心標為法初文二初明三下法二後因下辨長打法言若至也者三下者鍾樣云初一通集聲聞眾第二通集緣覺眾第三通集大乘菩薩僧眾故知三下集僧長打救苦今時行事三下即息務長打赴堂隨事用之不無兩得羯磨疏三聲絕之後復加三搥故云三通即鈔文中三下是也言後因至者者他請者者他㕰王千頭魚時請也概居致反說文云稠也此長打法有三段初未二時生搥同三下中間四搥乃至微末別是一段此四搥者准鍾樣云救四道苦初聲絕一通為救地獄重又一通為救餓鬼重又一通為救畜生續又一通為救脩羅最後捉打兩下號曰息搥若准三千威儀經集比丘僧打其四下比丘為五眾之首若比丘來餘眾隨集不妨救苦兼為集僧兩意相通以為得也古師以經律等者前後兩段並是五分律文中間四槌三千威儀經說律在後經居中間故云參也律則通明集法經乃打數不同中間四下若四聲纔絕便即生搥又類新打事則不可遂立漸概至於徵未故云共立此法也盡樣鍾所者當時有寺住持依古師法盡鳴鍾樣在於鍾所也第二文二初義立二故付法下引教證成言然至息者易知第二文二初引教證據二余親下引事釋成言故付法至亡者有三意初引傳次引經三此並下結成得不之意㟧云六卷或四卷後魏吉迦夜共曇曜於北臺譯傳云佛滅度後一百餘年罽膩吒玉與安息國王戰獲勝殺彼九億人最後殺兩賢信人罪重一人臨煞時稱南無佛一人稱南無未知是佛與富蘭那殺之名半人也煞二賢信罪最重故時有馬鳴羅漢見而愍之恐人惡道而化作地獄說法生怖即生悔心惡業重罪得消滅也尋嚴四兵罰三海軍罰二海軍竟至第三軍王所乘馬足屈王語馬曰我伐三海軍竟我不乘汝諸臣見王常樂征伐欲共除之王尋患虐諸人坐其頭上遂便命終因前羅漢說法故不受地獄乃生大海作千頭魚身劒輪迴割隨截隨生須更之間頭滿大海時有羅漢為僧維那王即白言今此劒輪聞揵槌音即便停止其苦少息唯願大德垂哀矜愍若鳴槌時返令長打槌時彼羅漢以愍念故乃為長打過七日後脫此苦身由是事故至今長打也此至不亡者羯磨疏云凡業有定不定故受苦有止不止若作業必定聖所不免不定業者無緣則受有緣便止今罪者過去善為因打者發願為緣故得聲傳苦滅自然感應故言因緣相召自然之理不亡亡無也言余至云云者續高僧傳云西京東禪定寺今莊嚴寺是智興律師俗姓宋洛陽人從首律師受學隋大業五年仲冬次當維那常自打鍾有同寺僧三果其兄隨煬帝南達江都中路已歿初無凶吉忽通夢語妻曰吾從駕達於彭城不幸病死生於地獄俻經五苦辛酸叵言誰知吾者賴得今日初蒙禪定寺僧智興律師鳴鍾發聲響振地獄同受苦者一時解脫今生樂處思報其恩可具絹十疋奉之并陳吾意其妻驚覺說夢所由初無信者尋又重夢及諸巫覡咸同前說十餘日凶問奄至恰與夢同果乃奉絹與之而興自陳無德並施大眾大眾咸問何緣感此答曰余見村法藏傳罰膩吒王劒停事及增一阿含鍾聲功德數遵此轍苦力行之每至登樓寒風切骨露手捉杵肉裂血凝致敬住心勵意無怠又初則願諸賢聖同入道場後則凡諸惡趣俱時離苦不意微誠遂能遠感眾伏其言興則以貞觀六年三月卒莊嚴寺春秋四十有五第三簡昔人濫中三初斥非聖言二諸經論下引教明據三知淨下立義正破一唱言世至捨者然第三段中有三節初標知淨之語二不通下簡不通僧俗共為之事三勸早捨也四分五分云打揵搥阿含經云擊揵搥智論云撾故云打擊撾等慈云謂俗人與僧同得作者不用作知淨語故云不通於俗及以自為也若俗得作僧不得作者則須知淨語故羯磨疏云今有人言知鍾者云是淨語打鍾者是不淨語也元此知淨自不得為令他作之故云知淨鍾則不爾自他通用不有種相何得避之早須癈捨者羯磨疏云知鍾之言雖非巨容然是知法之人大忌故勸早捨也上來集僧軏度竟從此大門第二明來處通局分二初牒章門二初明處之下解釋言二明至者者牒章也來謂行來處謂處所即是作法及與自然作法有三自然有四七處集僧各有通局故曰也釋文二初科列章門二初中界者依科牒釋言初明至通局者科章門也處之分齊者謂諸界分齊者謂有戒場大界四處分齊無戒場大界二處分齊三小直指坐處分齊自然可分別聚落以聚落為分齊不可分別聚落六十三步分齊蘭若五里分齊道行小拘盧舍六百步水界水洒及處分齊等用者即用僧多少通局者四人能辦一切羯磨曰通隨事分四與七名局兩段不同先解第一處之分齊於中分二初簡除來意二今直下正明分齊言初中至說者結界中者彼云結界元始本欲秉法但為剡浮彌亘集僧難尅大聖愍其頓極故開隨處作法分隔總意如此是來意也開制不同者約作法自然明開制不同也謂未制作法以前統通自然是制後因難集便開隨境攝約處有四不同定量有六相差別此自然開制不同也又或作大法地弱不勝是制則如來曲順物情聽隨處結是開此作法開制不同又約自然與作法兩文開制不同正明分齊文二初總標舉數二若作法下依標別釋言今至別者總標作法自然二種差別之數也釋文二初至離地別明二界分齊二今更下總辨二界差別初二初明作法二若論下辨自然前二初總標二有戒場下別釋言若至三別者總標也釋中即有三別初有戒場大界二無戒場大界三難結小界言有至外者羯磨疏云若作其餘羯磨則隨界分局人不相集即如今文四處集僧各得行事也言若無至集者即大界內外二處故羯磨疏云若論無場大界二處別集以界之內外咸有制約可從集故除前戒場及空地也言若小至集者羯磨疏云以界局在身坐外無法隨人集結故無外也若許有界則納呵人也羯磨疏中於上三位辨通局者若作其餘羯磨隨界分局人不相集是局若作說恣則內外通收問說恣須場僧集餘法不須者答此二攝取法住居行淨之人故制界之內外並同遵故羯磨餘法所被多途無局於時多緣別務若制通集還復相勞雖有前開終無後益所以文中無同說戒戒場之中亦有兩集依制是局為說恣等如難緣開此即是通若論小界唯局無通羯磨疏云元制簡人雖有不集也第二自然分二初標列釋名二初聚落下依標解釋言若論至用者此中有四意初總標二謂下別列三皆下釋名四當部下指用他部靈山云謂比丘至處任運而有如暈隨月不用結造夫有形之類皆為人物所造而成此四自然皆不為物造諸部詳用者謂取十誦五分祇等如下引也依標分四一聚落二蘭若三道行四水界前二標釋言初聚落中有二者標也辨常云村伍為聚隣里曰落羯磨疏云可分別者有三緣故一則院相可分別二則僧在無易委也不可分別亦二初則村聚散落無有垣墻二則僧雜市人往返難究也釋中依標分二初可分別二若聚落不可分別前二初引教定可分別之量二問答下義約蘭若有相類同聚落集僧言若可分別至眾者准十誦二十二云諸比丘於無僧坊聚落中初作僧坊未結界爾時界應幾許問也佛言隨聚落界是僧坊界答也不論僧坊周與不周但隨聚落聚落若同依聚落集謂聚落相強不論僧坊周不周也注云等者此指十誦冊七增一文波離問佛聚落中初造僧坊齊幾許作界佛言隨聚落界齊行來處此制分齊謂十誦僧界有勢分謂箭射所及鷄所及慙愧人大小便處古人云應百步也四分取院相者謂衣界則有勢分僧界則無但齊相內集故律云若村若城若壃畔若園若林若池若樹若石若垣墻若神祀舍並無勢分之語皆依上之相也第二文二初問次答言問至僧者此問意是南山義立諸部無文若逈遠蘭若即依五里今有僧坊蘭若相失此之四相與聚落之相不別不知還依五里為同聚落集僧答中三初引十誦正答二故文云下引十誦蘭若之文及證三律中下明僧村四相不別釋成同聚落相言答至集人者有二初十誦正答二今下立理釋成此答意十誦既云隨聚是僧界者今蘭若之處已有僧坊四相既周與聚落周相不殊何須五里若無此院相由名蘭若則依五里纔有院相非蘭若界此之院相與聚落相更無差別院相攝僧義強約義不得依於蘭若也謂今周迊院相是伽藍四相聚落是村四相謂盜戒中有村四相至離衣中伽藍四相指同盜中村相更不別也故曰不分言故至界者亦有二意初引蘭若文返顯二故知下䨱成村義引十誦五十三文證彼云若比丘無聚落阿蘭若處始起僧坊未結界是中齊幾名為界答面拘盧舍等若言無聚落蘭若始起僧坊故知未有院相由是蘭若空迴始欲於此擬起僧坊先結於界明知先有僧坊即同村界不是蘭若也言律至集僧者亦有二意初辨二種四相不殊二必院下結歸蘭若准此律盜戒中釋村界四相一周迊垣墻二周迊柵籬三籬墻不周四四周有屋至下離衣戒中釋僧伽藍四相指同前盜戒中說既將藍指村當知二界不別也引此文證但使蘭若四相周迊即同村相如可分別須依四相而集不須五里若蘭若相壞還依蘭若集僧者自得無知之罪義如前序中辨也第二不可分別中二初定量二准相通下計數斥非一唱言若至立者准祇第八文中名為奄婆羅樹界佛在舍衛城有一婆羅門問佛種菴婆羅樹法佛即答之示已即去時優婆離因問若有處所城邑聚落界分不可知者若欲羯磨應齊幾許名為善作羯磨使令異眾僧各相見而得成就不犯別眾佛言五肘弓量七弓種一菴婆羅樹齊七樹相去爾許作羯磨者名為善作羯磨雖異眾相見而無別眾之罪不同前解七間七十三步半者謂鈔主通計七樹六間六十三步不同昔人之解如願律師作祇律疏亦作六間筭之作四分疏引祇文錯著七間言七十三步半也若四分衣戒言八樹七間即有七十三步半也故知是鈔故羯磨疏云昔七十三步半者錯筭七間僧祇疏中七樹六間猶如四分衣界八樹止計七間如何僧界七樹非六間也有人執舊見云樹限兩頭各有勢分故各分半還是七間又有師云周圓種樹猶月暈故有七間又改僧祇為八樹字斯之我愛穿鑿太甚何處有樹即以樹量律約世情假以相顯也第二蘭若文二初總標差別二且明下局所宗言二明至事者靈山云具梵本音云阿蘭若亦云練若阿之言無蘭若云事此即閑靜無事之處乃至多種者發正云此律六種一頭陁者謗戒練若練若共同二寄衣者三十戒中不作限日寄衣餘緣六夜蘭若寄衣也三盜戒者文云閑靜處即盜戒蘭若四僧界即結大界五里集僧也五衣界者即下蘭若護七間等六難事者即提舍尼中若逈遠恐怖畏難處等即蘭若受食戒也局辨文二初無難二有難言且至定者謂此正辨僧界餘者向下隨明也花嚴云如頭陀頭陀篇盜戒隨相中明衣界難事等隨相卅中明故云隨也蘭若一界諸部不定者謂諸明俱盧舍大小不定多言僧界一俱盧舍十誦二十二云諸比丘無聚落空處初作僧坊未結界爾時界應幾許佛言方一俱盧舍是中不應別作布薩及別羯磨等僧祇亦言僧界一俱盧也羯磨疏云諸部皆言拘盧舍不定者小大不定也羯磨疏云大如僧祇二千弓弓長五肘小如十誦五百弓弓長四肘即僧祇太遠十誦太近若歟依了皷聲聞則皷有大小不聞聲遠近俱舍論一俱盧舍但里此則祇十了等部執不同今取雜寶藏經第一云一俱盧舍秦言五里相傳用此定㟧云八卷後魏吉迦夜共曇曜譯也第二有難文二初定量二計有下計數一唱言若至八寸者為有不同意人為約七槃陀集若論結時但齊僧坐處結時但羯磨不得結作法者以水虗浮相難識故也今則約岸分標義亦可得如僧祗有洲五處據標結兩邊水內取三由旬恣持欲度漂出界故如四分合河而結即為明證故五百問云水中住舡得結第二總論二界文二初標二若三下解釋言今至體者上則三種作法四種自然箇箇別釋今即作法總聚論體方圓是一自然四種亦爾是二故曰也釋中二初作法定相二若論下辨自然不定之相言若至隅者三作法者謂有戒場大界無戒場大界三小界也謂隨處結之不定體之方圓二自然中二初總舉二若聚落下別釋言若至定總舉不定也若可分別依聚落相為自然體所以不定方圓不可謂四面四維若有別界則尖既爾餘咸類然廣說無量次約趣辨即漫相對謂剋簡餘趣漫通人境以剋簡餘得作境差想疑此境差等狹於前位人趣既爾餘咸類然次對非情准同前說但境差等更狹於前不對五中寬狹准說言二漫俱四者謂無境差想疑以心寬該情無限局隨境優劣皆是本期假使臨事㸦緣非境差等次錯誤門凡言錯設皆是舛謬之心隨事總釋相則難分以名剋定事則有異謂若二境歷然無心害彼事成有舛名之為錯若其一境易脫緣彼謂此有心成犯稱之為誤既知錯誤差別對七辨者然七方便並無有錯對境成事錯猶無𠎝況方便位而得有錯或可錯者異雖無𠎝而於本境即是境差是故四一十二種也約處通二界作法自然一處有十二二處二十四約人通五眾比丘乃至沙彌尼一眾有二十四五眾即成一百二十種安居此據相承且爾若准羯磨疏解二百一十種也疏云對首心念忘成及界又分為七前三不分就界為四以園界兩所足有雙隻故也用此七法下約三時則二十一二界乘之即四十二五眾乘之即成二百一十種安居也此兩段文並鈔主意十誦佛制五眾等者勵問佛制五眾安居有戒沙彌可爾二眾沙彌無戒合安已不答出家位同招譏義等感癈脩道隨安無罪故律三時遊行不安居戒制五眾罪也問五眾安居具戒數歲三眾不數歲者何答以大戒有師徒位別依止分齊教誡尼等下三眾無故不數歲故房舍揵度中下三眾等以生年為次第不取受十戒為大小也第二文二初總顯二法今古前後意同二忘成下別辨二法古人開制前後有異言約至日者始從四月十六日終至五月十六日有閏易知此二法今古皆同第二文二初別明二師不同二並非下總斥俱非聖制前二初約通其前後不及於中二又云下不及前中唯局於後言忘至也者羯磨疏云有人言前之二法既有聖教可通三時忘成及界此之五法開成本無三說故中安居所不開也恐不及前故損五利恐不及後一夏虗坐有斯兩意開於二日中間不開如此約教一百六十種以前二法歷三時兩處及以五眾則六十種以五法依前後二時兩處五眾則一百也諸記相承對此唯作一百安居對首心念三時乘之輔篇云對首心念可通三時成六忘成及界通前後二時即四并六成十二界乘之即有二十五眾乘之即一百也言又至預者第二古師云忘成及界唯在後夏一日以佛開成有益不結一夏便失也謂對首心念二法通三時成六忘成及界等五局後夏成五并六成十一二界乘之即二十二五眾乘之即一百一十種也諸記相承有八十種二法通三時成六忘成及界局後成二并六成八二界乘之成十六五眾即八十也言並至也者鈔斥二家故云並非聖言以意用也此消文意古今諸解更有多種不能繁敘第四夏遇緣中二初科判章門二初中下依科解釋言夏至難者如文釋中依科分二初有難移夏二明得法下受日逢難初二初廣明有難移夏法二破僧下略辨破僧和僧移夏法前二初明有難移夏法二四分下有難移去自聽法初二初明有難移夏成不相二問答下遇緣出界成不相前二初列難緣佛聽移去二准此下釋其移夏成不之相前三初總標二難二梵行下別列二難三佛言下總結聽去一唱言初至去者清淨是梵行今恐壞梵行名梵行難本時婦等者羯磨疏云斯梵難也凡心染愛無始緾壞今蹔割削遇緣還起故有境來知非是淨或因斯緣容有犯重說為難也此是因中彰果也皆因人來者總釋上意也誘調比丘者誘引調哢也律云爾時大臣眾徤能鬪捨家為道時優闍王言汝何不休道當與汝婦田宅資生等次有童女婬女來云汝休道我當為汝婦黃門數來喚行不淨伏藏者長人貪心恐盜取即壞梵行即五分二十三云有一比丘安居見其伏藏作念此藏足我一生用也佛言恐為梵行作留難聽去二者鬼神等者五薀假者命根連持鬼等惡獸能斷名命難也有鬼神惡賊毒虫惡獸等皆嗔欲伺斷比丘命白佛佛言應去不得如意飲食者有待之命依飲食存既不如意命將不久故為難也上二種諸難一一白佛今總結之佛言聽去也第二釋其移夏成不相中二初義立移安居之方二五分下證得夏之相言准此至也者三意初明未得住處成不之相二若得下明得住處出界應不三結成下釋本界無難得返以不准此結成者羯磨疏云二難移夏既是制限從初去日外覔安穩未得已還雖經宿者不名懈怠不破安居及前成破若得住處夏法隨身不須加法即前成後不得輙出也准此二難緣移夏依本結成須有緣及法者華嚴云既不得返來今若有生善滅惡之緣即作受日法故曰及法也第二文二初引三律二論證其得去不言得夏二摩夷下引三律一論驗許受衣理通得夏言五分至得去者五分云比丘麤食不足作念言我此中安居麤食不足白佛佛言聽此緣破無罪次後數行來有文言若見國王尊貴乃至父母親戚苦樂等恐失道意亦如是也聽破安居即是移夏苦樂者立云謂眷屬聚會追送吉慶受官等名親戚樂若忽然被賊難言訴是親戚苦聞聽破安居無罪疏解八難者若王奪住處或言駈出家人名王難賊者失奪衣鉢人者親戚及知識相誘引令罷道或相誘引令作惡名人難鬼神及天魔鬼龍眾等悉能為鄣礙名非人難地中有伏藏知有此物必起貪心若取成重罪或邊側住處多有博易往還或見此生貪致犯大罪名梵行難言摩至得夏者應師云摩怛理迦摩夷等此云母以能生智也立云本母理為教本謂一切諸論能生法相論是義本故曰也二處隨半受衣者四分文云有一外道弟子於佛法中出家諸外道親族言云何捨阿羅漢道於沙門釋子中出家當還取之復作是言彼若聞者或能逃避沙門釋子不破安居至夏時往取必得無疑彼聞不知云何白佛佛聽破安居彼比丘使便從一住處至一住處不知應何處受安居施分白佛佛言若住日多處應於彼受分也忽若二處住日等者各取半衣分也破安居人下鈔主立理證上移夏聽二處受衣乃至自恣處取衣以十律中破安居人不得衣分今既聽取分明明知成夏也第二弁遇緣成不中二初問答通疑二若依下約界雜弁失之不相前三初出界忘受日成不二出界逢難不還失不三身在外宿歸會得不言問至應返也者三悔者㟧云謂一夏之中不得過三故云三悔故彼論問夏中忘不受七日法一宿出行得坐不齊憶即悔得一坐中不得過三悔不得歲也案此文詺一夏安居為一坐也言問至得夏者此問不同上緣上緣本擬受日遂忘不受今此因事出界本擬即日還值道斷經宿得夏不耶答高齊十統者靈山云高謂高洋之姓帝也齊即北齊國號也以齊號多故標姓簡異也崇敬三寶別立十德號為僧統統天下僧尼刊定佛法咸集明德共評斷理並懷慈濟判不失夏也靈山云准受日逢難過限既得此理應開非情過也言問至不得者此問意蹔爾出界及即日還迴來至門邊明相欲出得會夏不答意准祇護衣謂將衣類夏故也以隔於墻故須入頭手等於界內方得也第二約界雜弁中二初正雜弁得失之相二皆謂下結釋得失之意初四初局依大界入餘破安二若依大下依界外藍通往不破三若依下依界內藍出藍入界便失四根本通依界隨行不破言若依大界至破夏者發正云謂要心依大界安居若入戒場者為中隔自然及餘小界者慈云猶是攝僧之大界以在圍輪大界之內望圍輪故名小耳此即從外向內失也言若依至後者者此謂藍寬界狹元本依藍安居竟後時乃結法界小於伽藍猶稱本要地所以通往此藍彼界不破夏也注謂結夏在前結界在後者琳云鈔主意若有藍界要須依界依藍不成故下文云以佛制依界故若羯磨疏中許隨取藍界但隨要心也言若依至亦爾者折中云謂法界大伽藍小若本依藍安居者出藍門即破夏也小界亦爾者華嚴云此句是反上句也謂上既界大藍小依藍結夏出藍則破今是界小藍大依界結夏出界即破故云小藍亦爾也言若根本至不失者㟧云謂依大界安居不知內有諸界但隨本要期所行之處皆不失此據迷心故開不失也靈山云若爾何故上言依大界安居戒場小界入中破夏耶答上據本知非本要所以是破也言皆至分齊者有二意初結上二失二並緩下別等緩急分齊皆謂與本心相違者本心依大界今入戒場及諸小界即與本心相違也初依大界內藍今出與本心違也義張兩失者前四句中第一句入戒場等一失第二句依大界內藍今出門破夏即二失也並緩者結前四句初依大界二藍內大界三藍外大界四根本通依大界並從緩論依前四種大界若爾第三句中依大界外藍何曾依界答鈔意若藍界俱有制依界也故注云結夏在前意在此也明先無界也發正破云藍外大界緩義許成藍內大界即是急義如何稱緩此破不然今緩急者不從藍得急約於房緩從於界房界相望得緩急名非謂約藍約界而稱緩急也言四至去者當白檀越者以律緣中有檀越請前安居後安居見有難欲去須白檀越求移若去聽去善若不聽應自去也言破僧至出也者准律中眾僧因我故鬪令僧破者聽去外界僧因我能呵得和滅者皆聽直去也今少見行故云事希不出也第二得法有緣中二初依律正明二准此下義決言二至得成者至意留者立云或父母病患生善滅惡等緣若此相邀聖開且住不名破夏若汎爾留住住則破安入難不還過限亦同留耳義決文二初義立二我下證成一唱言准此至夏者祇云若受拜人晨起受晡時去晡時受晨起去不得從檀越迂迴應從直道有難者迴道無罪至彼斷處經時斷了欲還經時亦如去時准此違時即破夏也因迂迴違時亦破夏迂迴不違時雖不破夏亦結不應罪也第五迦提文二初牒標二初中下依標解釋言五至法者如文釋文二初明迦提五利二次明下弁夏中解界言初至後法者五利賞勞如後自恣篇明也第二文二初弁昔非二若夏內下顯今正解前三初敘昔解二此妄下引教證解成非三古人下鈔立理破言次至也者此律迦絺那衣法云安居竟解界結界自恣受功德衣古人云既言竟未竟而解故破也羯磨疏云有人言本依界故成安若解本界便失夏也以失所依即日雖結成就故又云安居竟應解界今未竟而解故知非也第二文四初直斥妄引二律云下證成妄引三略題十誦證四取彼首疏證一唱言此至進不者妄引聖言者羯磨疏云文列應解須知本緣此原不為安居但欲同法合界故須云解今言破者是妄引也律云下證妄引也廣文十誦者彼律五十三問云諸比丘安居竟眾多僧坊共結一界受迦絺那衣受已捨是大界是諸比丘皆名受迦絺那衣不答一切比丘皆得受之又疏者首疏中亦云夏中解界不破夏也言古至通者謂將自恣難解界也文兼二會者解界自恣律中二文兼明文云安居竟應解界應自恣今須二會其文夏未竟自恣破安居夏未竟解界應破夏夏未竟自恣不破安居夏未竟解界那得破夏須得自恣解界兩文相通也第二顯正解文二初申正解二但結下料簡夏中解結是非言若夏至妨者羯磨疏云然安居不專作法界中隨處並得作不離本要之處解界結界並無妨也料簡文二初標二若依下正料簡言但至別者為情限在於法界夏中解結大小不同故須分別或情限在於自然夏中或結作法或寬狹於情限之處故須分別料簡文二初明作法二若本下自然一唱言若本至二緣者初情限所依大界則小後解更結大者故須分別無難依本情限之處有難准僧祇開之者羯磨疏云彼祇第八云前安居已忽有難起王賊破戒虫漉得欲至餘處三由旬內若彼坊寺有比丘來若出界去已白二結之後欲就餘處者當捨已更結如是捨後結前求適意處故知有難得三由旬開近新處也若後作法狹於本自然者即令依本自然寬狹後結若寬本自然者無難依本是一緣有難開近新處是二緣也羯磨疏云自然狹作法還依自然本作法狹自然還依自然本謂是本要心處也此不約有難說也上來兩段並是同夏中故知夏中解界結界無妨也第二受日法中二初明來意二牒名解釋初來意者弁常云然三月靜處九夏時長或有生善滅惡等緣理宜極救佛既聽許理合附此安居中明第二釋文二初牒名二夏中下依久解言二明受日法者牒彼請緣諮吉僧別納法稱之為受對首眾法許往有期約明相稱為日各有軌則號為法也第二依文釋中二初明受日惣意二就中下開章別釋言夏中至焉者妄自誑心者立云非緣稱是即自心也虗損信施者如有施主數夏施物受日不成其夏已破妄數為歲冐受利養名虗損故善見云自長己夏受施犯重即其義也釋文二初舉數列名二初中三種下依名解釋初如文釋中依名解釋分三一通料簡二緣是非三依位解前二初惣標二一對人下依標別釋言初至不同者三種者心念對首眾法此三之中有四不同也釋文四一對人二對界三先後四相攝言一至受者初正明二十誦下證立云佛制五眾安居各自相對受日非謂比丘對下四眾羯磨疏云互不相足數何得從受此立法通如五眾安居例此各從所位也言二對界可知第三文二初敘正斥非二問答下通妨言三至磨者昔人云先受七日後便十五日後一月如此次第若已受十五日不得更受七日以長攝短如功德衣五月即攝迦提又月望衣開収十日等今解不爾如功德衣就時定故又俱五利一月衣者取為限准俱開一長更無緣故是以此二即為定開以長收短今此受日約緣事別緣既長短先後不定寧得定令先短後長故今正解受日三品逐緣長短若有長緣先羯磨受日或先短緣先受七日三品緣事各先各後也言問至也者羯磨疏云文列過七日者立法限約此羯磨法是過七日緣耳非謂受用竟名過七日忽若不受七日即受都受七日文言過者可是用竟必不然也羯磨疏問云今受一月日何不言過十五但言過七日耶解云七日別人餘皆眾法但云過七日明知餘二俱白二也同是眾故不說分也疏又問云今受半月一月法者若值小月如何數之依律文也半月加法依十五日則不問大小但數日滿還返如十誦三十九夜也若受一月依大小月不可數日如律云住三月等小月攝在其內也第四相攝文二初先七日後羯磨得不二若前下先羯磨後七日應不前三初明用竟方得二若七日未用下弁未用不得三律云下引文證成一唱言四至也者此一門義并是古師所執羯磨疏中半許半破也羯磨疏云四相攝者謂先受七日更受一月攝而通用名相攝也有人言前受七日用竟不論若受未用或用未盡更羯磨受日前七日法則謝以法強故若前羯磨受日用盡方得更受七日法也以一身中無二法現故文云不及即日還受七日也又不及七日還聽受十五日去今七日未盡何得已羯磨受明知相攝前七日法壞也此古人義南山解云不無此理也但本是一緣不得有長短二法可如前判半許也今前後別緣各依受日前法被事事未是息何得失法如為患事須服蘇油兩緣未差口法隨在律列受法三品不同並約眾緣可不隨受故不及即日例用七収明知以法收緣依緣法則隨有也故半破也華嚴云若准羯磨疏意若是同緣不得一時二法異緣即得也無問長短前法不壞第二文二初明用盡方得二比多下弁未盡不得一唱言若至也者羯磨受日要須用盡方得受七日者此猶是上古師義也受一月不足更請七日良不可也者鈔主通古師義也謂於一緣上不得二法相帖三十七日用必是異緣何為不得也今鈔文依前古師所立恐教成太急接機不周故於羯磨疏中立於異緣不問二三重重受得即機教兩濟也第二對緣進不文二初總舉數二初定緣下別釋言二至八者靈山云謂緣如受法得成名之為進若緣非受法不成為不也釋文八一定緣是非二對事離合三懸受四樂用五重受六長短七僧尼不同八事訖還初不門三初總弁緣之是非二就緣下別定緣之是非三上五緣下通更料簡上之是非初門二初明他請如非二若為私下弁自求是非前二初明如法請喚聽往二若請喚下非法不應往言初定至往者如文第二文三初明非法請喚不成二妄數下弁破夏得罪三善見下證前妄數為歲一唱言若請至犯重者自長己夏者立云有人將物施僧問覔十夏人此比丘實有九夏而言十夏得物犯重第二弁自求如非文三初明如法得成二若為下弁非法不成得罪三五百多論兩證罪深一唱言若為私至後文者廣如後文者販賣戒云此販賣物作塔像不得向禮乃至作臥具隨轉轉墮等第二別釋文二初總舉數二一三寶下依數列釋初如文釋文五一三寶境界緣二道俗病等緣三父母請喚緣四為求衣鉢緣五和僧護法緣前二初依律出緣二准此下約義料簡言一至爾者四分中波斯匿王往征有不信樂大臣嫉妬惡心欲𮢶祇桓門通渠比丘欲往白王自念路遠不及即日還佛聽受七日去即是佛法僧事也五分亦爾者彼緣大同為俗人通水也第二文二初義准如法開之二若自下非法不成得罪一唱言准此至得罪者准此為寺家一切如法事並得問今時為寺家言訴得受日不答如律波斯匿王邊國人民及叛王自領軍往征討王先所有供養佛及僧衣被飲食所須之物有不信樂大臣便奪不與諸比丘欲往白王自念遠路不及即日還佛言有如是事聽受日去今驗此文為佛法僧相訴亦得受日若受他雇不成若自經營為俗人為僧家佛事等帶其非法並不成得罪也第二道俗緣中二初約義總明二四分十誦引文指事證釋一唱言二至去者十誦問為誰受等者華嚴云彼律中波離問也佛答為七眾興福者謂七眾為請主下文列二百四十二緣並是此緣皆七日緣也遣使不遣使者謂前人遣使不遣使來俱得去十律如此四分要遣使也若中路聞死反戒者十律五十三云比丘尼請比丘來與憶念不癡毗尼佛言應去若是比丘中道聞是比丘尼命終若反戒入外道八難中一一難起應去不答不應去去得吉也反戒者捨戒罷道也第三文二初准文二餘汎下義立一唱言三至往者華嚴云謂父母恩重生育陰身大臣力勢能損益雖無信樂往化使信若先信樂故宜須往也其餘俗人必有力化之生信准前臣義亦應往也第四文二初明如法二今時下料簡是非言四至說者當陽云謂上移居中必為我命作留難佛言聽去羯磨疏云若自病重不堪受日即是命難直去亦得第二文二初舉非二必長下彰是一唱言今時至不成者失三受三等者謂三十中失三衣戒南山解云失三受二未過若受三即犯捨制取聽者謂畜長是聽三衣是制今𨷂三衣而多畜長者是未隨佛化也准奪衣戒者㟧云即第七失奪三衣戒謂隨𨷂隨乞不得賸以證反也住處及即日往反處無者聽去即日往反處求不可得故聽請日往也第五文二初准文直云不受二然和下約義須受一唱言五至故者靈山云古德皆云和僧大事律聽直去文不言受日去良以和滅分齊難知知依何法受日故聽直去然和僧之相雖則難知分齊且約和僧之緣道路遠爭事大必然可依僧祇事訖受去律文既令直去今依僧祗事訖作法而往准其律藏未分通得行用今雖分竟事不可知用此事訖之文大家道理未為傷也故羯磨疏云必有和限依受日聽去事無限可准僧祇事訖文也律無明斷故者律中數段破僧之文皆言即應以此事去而不言不須受日故云律無明斷故羯磨疏云律中顯緣未明受日也第三料簡文二初通更料簡緣之是非二或曲下通更料簡請召得失一唱言上至也者此二文中各有二意初緣衣藥為是二今有下乞麥即非第二曲命別情請召為失二律中已下顯得立云謂不得倚傍上五緣專為飲食不成受日若別有病重乞藥草得也今有乞麥等者靈山云此尼律中制六群尼乞生糓麻米豆麥為世譏故制尼提僧吉是結正罪也或曲命別情者華嚴云謂囑俗人令熟請貧道來乞綿等是也此則能所俱非乞綿尚犯捨隨囑請理在不成也律諸請有或比丘尼沙彌檀越等一一遣信別請云大德來與我受戒懺罪受布施等要遣使來顯令他請召非也若父母餘人同十誦中者律云若父母信樂不信樂聽往餘人者前第三中餘汎俗人生福信樂聽去不信不聽四分如此今鈔意若父母及餘人即同十誦中為七眾興福問疑請法乃至遣使不遣使等但不為利己俱得去也即顯曲命別情為利不得第二離合有三意初立合義二如鈔懺下引其合例三則文中下出其合法一唱言二至也者隨緣別受為離或有多緣一時牒入而受為合羯磨疏云或張王兩緣各是七日不可合為半月受也以兩今七日緣事各是別人所行止得前後受七日也如是例之若俱三日或是互減不同七日彼此兼用眾法離合可以例之或張是別緣王是眾法隨依受之得合用也如懺殘若犯十罪同時行䨱等六夜多罪同法名為合也第三懸受文二初緣現聽受二必無下弁未現不聽一唱言三至故者虗搆成緣者立云謂事既未實懸搆或為七日半月一月之緣或倚傍昔言仿像未實者如有檀越春時汎言我村中有王家每至夏中常施僧物闍梨至夏能來不今夏倚傍春時之言倚傍昔言未知今年為施不施仿像其事未得的實輙受日去也前事既虗今復隱約作限取法更成濫也日數妄置者折中云由前事虗限濫其緣未可以論長短今或受七日半月一月如是日數皆虗妄置也故羯磨疏云既無實緣不可虗牒一則不可倚傍二則本無實緣三則不知期限四則妄受僥倖一向不合也如律無事及減年等皆非法緣加羯磨不得第四明互用文二初正明互用二問下問答料簡前二初明本緣互用二若三寶下辨後緣續生互用前三初正明互用得不之相二十誦下引日殘夜證非異事二若本下結歸正義一唱言四至故者已用三日更有法事便通餘用者牒古義也羯磨疏云有人言既有受法但是事如互用無損所以知之十誦云有殘夜在白已餘用故知得互鈔直破云故不得也羯磨疏云雖為僧事竟殘日於佛無法何得妄用遂立正義必有本緣何爽通用靈山云爽由失也謂初受通三寶三寶既是本緣今通用何失羯磨疏中假立難云若爾要是本緣得通用者何因十誦得白殘夜鈔引十誦答云白殘夜等彼十誦云諸比丘受日到聚落中七夜未盡作事未竟來還白佛因聽受餘殘夜去云我受七夜二夜已餘有若干夜往出界律文如此南山云既云所作未竟明知本事未謝白殘用也非謂異事者鈔重破也羯磨疏云非謂異事本無心受何得白行若本因等者羯磨疏云若本三寶俱須經營作法之時文中合攝是俱有心法復通用也第二文二初辨三寶別緣後生不得通用二乃至下俗情別緣後生通用應不一唱言若三至應得者初為東院三寶事受用五日了後西院三寶事生不是前緣三寶雜緣等者謂布施懺悔生善滅惡等也由前事有心後事無心故若一家通緣者立云此明受日元知張家有多緣事設供戒懺說法受施等受日來故得通共用也問答料簡中三初此界僧為別界三寶受日成不二明僧次請受日成不三明捨請受日成不三段一唱言問至心故者謂替僧次施主無簡別心故得若替別請者由後人非是本請人施主於此後人無請心故不得也第五重受文二初敘昔解二今云下次明今釋言五至成者羯磨疏云有人言安居立行脩道為宗緣急開三以濟時要何得重受無此理也故十誦中為破僧故聽受一七夜不得二七夜乃至聽受卅九夜盡應破安居去此明文也第二今釋文二初以義通二故律下并以文證言今至不合者如疏述者首疏也羯磨疏云如前檀越召受七日後有三寶要須經營何得不開又如官事須二三日曾受七日何能不去夏制本意無事遊行今有緣來依法受往非專擅去何得獨制但事緣如法故一切通開也第二文證中二初當宗二五分下他部言故律至限局者四分卅六廣列廿三緣並是七日緣由事未現佛未聽去不言不得重去也信樂父母四重者爾時有不信樂父母請比丘言大德來我欲相見佛未聽我有如是事白佛佛言聽有如是事去等二有信樂父母遣信請亦如上三爾時有母請比丘亦如上四爾時有父請比丘亦如上則是四重也父母四重佛皆言聽去況餘雜請不得重也第二他部文二初約二律二五百下引其兩論前二初引二律正文二謂一時下釋上律文破古非解一唱言五至通明者有請者五分云時有長者名優陀退信樂佛法於安居中為僧作房設人舍食以房施比丘不受長者便嫌言我用財為食比丘不受白佛佛言聽受請等無請者比丘有疑故問須出界外佛言一切聽受七日往羯磨疏云豈前須問後不須問也謂一時前後重用者破古人據此不得重受義古人見十誦不聽二七夜謂言不得重也羯磨疏云或一事上不得二七豈制異事不許受耶又言不許二七夜者彼受日法但有二位故對首七夜何得重加故云不得二七夜也不妨前後去者亦得若准和僧似一事上不許重受者十誦卅五云時有異界僧爭起請僧來斷事若先安居竟應受七夜去若七夜盡應受卅九夜盡應破安居去古人亦據此不得重也若得重者更受去得何須破夏鈔文言似一事上不許重受既言其似未必全不得重受但為和滅難期開破夏去若可期者重受無妨故羯磨疏云和僧用二法已破安去者受法依限前二者期故開隨受既用法盡和滅難期知用何法往彼和也理須破夏是所開故還同僧祇事訖之文也若不為和破夏獲罪若定可期如前必聽也然彼有不請之文等者十誦為七眾興福設供受戒問疑但使前見生善滅惡若不遣使亦得受日如此之文寬於四分四分一一皆言遣信別請方得受日不請尚乃得去若重受不開只是番譯之家迴文有失文非明了非謂不開重受也理須通明者不請之文既寬重受之文則不合急二處之文相通重受之義自然明矣第二文二初二論兼疏證得重受二此論下引彼親承己聞破古人之壅執言五至宿者羯磨疏云此五百問卑靡羅叉口決也其人翻十誦者既有此通義無疑矣即證十誦文非明了故上准不請之寬下引卑靡之語重受之理即通明也明了至宿者發正云今引此論疏真諦三藏自翻自解前請七日事了還至第八日出界此是異緣得重受前事已了更有別緣亦得更受因此便明今人行事此論既云前請七日事了還至界內第八日更請七日出界出界者今人行事至七日滿歸界即請七日出界不宿者不知成不有人約義通言謂受日法身在界內法在不失如受七日用三五日其餘之日未用身歸本界更作前事本法由在不須更請法在不失今縱七日滿歸於本界至明出時雖然經宿殘法亦在論許重請亦帶前法故知七日纔滿歸界請之理無失也雖立此理除由未除謂律有明制及七日還論令經宿並准聖言如前但用三五許其法在得用無疑以此未滿例於已滿事不可也標心為滿故歸其法經明自謝不同未滿不為滿歸法在不失古人猶執但一夏三受其數太急入界不宿行事大緩太急不體律文太緩無文可據故不可也言此至鈔者華嚴云真諦是優禪尼國人陳梁二代至此方譯經論卅四部合一百卅一卷然真諦或鎮坐具跏趺水上若乘舡而濟神異甚多中國之中三藏親承用重受日事三千者花嚴云謂佛化周三千世界也論云一四天下有一須彌山一四大海水一鐵圍山遶一日一月名一世界以此為數數至千是小千以千為一數之至千是中千世界又數此為一數至於千是名大千世界一佛出世道王其中也余至鈔者羯磨疏中引了論解疏中有其九句皆是重受疏引論偈云七日有難隨意行善解三種九品類疏釋云於安居中三緣得出界一七日緣二有難緣三隨意緣此三各三故成九品文亦非要不能敘也第六約事長短中二初約處遠以明長短二若路下約處近以辨長短一唱言六至日者羯磨疏云止須一夕並作七日以法収緣如文不及即日義開七日也夏中可爾夏末五日如何成受餘日非夏限故解云乃至七月十五日亦作七日法餘日雖非夏以法成故若路近得還等者由緣經宿不及即日還此約緣也如文羯磨疏問云今有七月九日受七日法出界不還夏成以不答破也何以知然夏有後開無前開也以七月十五日須及夜分還反本界如律所制及七日還今限明相及在界外絕此分齊故說破也若爾何以律文最後自恣七日在受七日不還不犯者答謂七月十六日是最後自恣日也如急施中說之今此人以七月十日受七日故彼第七日自是夏滿不來無犯又問七月十五日明相未出隨行不犯相出是開何有夏破答止為明相未出須返界中名為及法相出界外故違本制又問制及七日是有法緣至明夏滿法隨事失有何犯故令我破夏答日夜分齊約明相分第七夜分明相未出自屬前夜明相若出即屬八日制七日夜須及界中今不在界故當破夏至十六日自是後開由違前制故說破也若約此解十誦七夜亦及七日返還同四分何有異耶明相若出不及夜也此義甚要故繁敘也第七文三初引文正解不同之相二比下敘破昔非三所以下釋不同所以一唱言七至緣者羯磨疏云如三時遊行戒中唯有口受不云多日可准斯也又准祇廿七云比丘尼安居中無有求聽羯磨法為僧塔事而遊行者聽受七日也比有等者羯磨疏云昔人解云尼隨僧受三法遍緣上下同受不說假為異故無妨也鈔斥云四分至不勞別解也所以不同易解第八文二初立義二明了下引證一唱言八至之者羯磨疏云有人言事訖不來亦不破夏以法在故如七日藥與欲類同犯病得法病差不失等例今解不同事訖法謝不同欲法羯磨不牒今受日法牒事加之緣謝法失之如藥法病止無用又同犯解須乞法也十誦明文者㟧云前引十誦中有尼病請為說法中路聞死返戒等皆不應去僧祇意同者前引祇云和僧不得迂迴至彼中前和了中後即還若停失夏是不許住也第三正加分三初心念二對首三眾法前二初明大僧二其沙彌下辨沙彌前三初定人是非二具儀下出法三此謂下雜相分別一唱言三至告者十誦五種人者一獨住二蘭若三遠行四長病五飢時依親里住等開心念受准此當眾相共作之者准前律文作念已告以事緣汝知之即知五眾當眾相共而作也言其沙彌等者謂下沙彌別行篇明也第二對首中二初出法二然心念下通釋二法是非言二至三說者如文第二文三初明二法文之來處二若受下未用應不三問此請下得兼夜不言然至失者義准無失者羯磨牒緣對僧請日今對首心念准日文牒之請日理通有何失也第二未用中二初辨未用應不二不同下釋通疑妨言若至謝者本緣若無受法便謝也言不至消者不同失者靈山云藥滿七日七日滿已縱病未差法亦失也病轉者謂病已差縱日未滿亦失故雙牒也若爾言病轉法失者病住法應在也由佛制七日定論云堅病消者是也論多成二論各有文也第三文二初明應不二不同下簡異諸部一唱言問至中者不同十誦者約其鈔文似盡七夜至八日還據羯磨疏須及七夜還與四分無別故疏云十誦七夜及七日返還同四分明相若出不及夜也僧祇事訖者彼律二十七云但隨前事長短了日即還名事訖論其事法具在諸部別行篇也對此欲知且依羯磨疏錄十誦廣七夜緣下文和僧聽卅九夜祇有事訖之文五分三品與四分同也第三文三初通明長緣便斥古失二今加下正出受法三料簡雜相言三至釋者所為緣者如前五緣一三寶境界緣乃至第五和僧護法緣心念對首同用此緣故云通用但令緣事時長用半月一月法也不同存單之人等者一夏之中但得三度初單七日次單半月後單一月也遂引七日今長者花嚴云非謂引緣令長但用長法也羯磨疏云今夏末一二日在不重受家既曾受日若用月法又是破夏由緣不合即教明罰破夏是也餘同前釋者㟧云指上第五重受門是也第二文三初略明二師文相少見二第三下別辨先師所撰加其乞詞三第四下明願律師依律出本言今至見者諸記咸言第一曹魏時曇諦所出羯磨是也羯磨疏云初人加乞羯磨不牒恐成增法謂請日者從僧乞請日法而至羯磨文中則不牒乞詞恐增法也第二即是姚秦時覺明所出羯磨羯磨疏云但准六夜乞法牒緣牒事並盡慈云鈔主說曾一度見本希更不見故云少見也第二文三初述彼增加二今下斥彼非教三問下料簡成不一唱言第三至無失者北齊光律師出本增加乞詞羯磨疏云雖著乞詞准乞䨱藏兩遍牒事時到已前增加乞詞忍聽已後略事而作此光律師世盛行也彼羯磨云大德僧聽比丘某甲此處夏安居受過七日法十五日出界外為某事故還此中安居今從僧乞受過七日法十五日羯磨若僧時到僧忍聽今與比丘某甲受過七日法十五日羯磨白如是此且舉白羯磨可知世同行也止可隨其綱網者止可隨律文受日四句成白緣骨之綱教網也雖增加乞詞羯磨大宗無失者牒緣牒乞詞等但是第二第四句於羯磨宗骨無失也羯磨疏云有人定判依受夏破今解不然俱順教故增乞減乞各有所𠗦羯磨大途規猷在故依受不失也第三文二初明受十五日法二其一下辨受一月日法一唱言第四至日者者願律師依律出文更不增加今多准用也准前著之者准著十五日處著一月日也不得雙誦十五日者靈山云今准此言恐人不了律文依文而誦律本云受過七日法若十五日若一月日出界外今若受一月日者即須除十五日但云受過七日法一月出界外不得雙牒前二誦也第三料簡文四初明受人離合二若依下辨依大界安居小界受日不得三若先無下明初在自然安居後作法界中受日四若本結下解有界依藍安居不成受日不得自古諸記皆責此門來處何孤然生即長科云一明安居二明受日三料簡雜相今不同之此一段文從眾法中出初通明長緣斥古失二今加下正出受法三料簡羯磨受人離合處之是非故謂之雜相不同古人長斷也言三至開之者如文言若至故者立云餘山界者還是攝僧之界如圍輪別住也以本依圍輪大界不依此小故不得於中受日也言若至衣者後結二界者即大界戒場也縱入戒場不破夏而離衣者謂戒場是本要心處所故不破夏由中隔自然故離衣也此據依大界結攝衣界為言若無攝衣界依藍護衣亦不失也言若至之者淋云謂本有大界不許依藍佛制依界有安居者安居不成藍中自然之地羯磨受日固然不得止得縮取戒安居也餘廣如疏者首疏云有人言依界安居不依藍相佛制依界不得依藍故又云雙單及界也有一師云藍大界小依藍不依界以文云依某伽藍某聚落也鈔家且引急義故勸縮取界相後造羯磨疏云安居依處依藍得成何必依界二文相兼被機方足且界小藍大依藍安居羯磨受日依界得不解云藍內之界入不破夏並是本要之處依界請法何得不成如前本依伽藍後結二界隨界受日尚判得成今藍內大界總是本要何受不得差爾藍內戒場亦應得受答戒場雖在藍內即非本要入中破夏離衣即不類後結也上是義決等者非律文有之是古人之義決也慈和問云異界僧得足此界僧羯磨受日不答得不同處分義局當界僧也上來不同當第三約界對人辨事竟今當第四有一篇約法對人辨事將解分二初明篇來意二牒篇解釋初來意者花嚴云上篇一夏安居九旬同住恐有𠎝過不自見知故須自陳三業恣僧糺舉故安居後有自恣篇來也律緣起中比丘共住妄設瘂法致令佛呵汝曹癡人共住如似怨家猶如白羊何以故我無數方便教諸比丘彼此相教共相受語展轉覺悟汝曹癡人同於外道共受瘂法不應如是犯突吉羅羯磨疏云又表一歲之勤情本據道中含非法正缺道標義須清蕩無瑕受歲今若相嘿豈抱過生年故須相檢應僧淨法迦絺那衣來意如後也第二解文二初牒釋篇名二然九句下依文正解言自至附者福云自陳三法之詞恣舉七聚之犯摧累業之宗主成白法之樞鏈欲使知過必改省己增脩晈潔尸羅凝清律海也迦絺那衣法附如後第二依文解二初辨自恣宗要二明迦絺那衣法附前二初釋篇序總意二就中下開章別釋前三初明須自恣意二所以下辨夏末自恣意三此是下簡異非法自恣前三初結上安居生下須自恣意二縱宣下辨自恣名相三故靡得下證自恣義言然至示者靈山云上兩句明夏中脩道精進安居之德也次兩句明三業有失下兩句辨須自恣竟九旬者旬歷也支神有十二子丑寅卯辰巳壬未申酉戌亥干神有十甲乙丙丁戊己庚辛壬癸以支十二歷干神十盡名一旬也一夏九度歷其干神名九旬也法律三昧經云世人但見他過多迷己非故藉𬗄治方得清淨故云理宜仰𠗦清淨故云理宜仰憑清眾示也言縱至恣者輔篇云自說三根恣他陳舉內彰無私隱等者我既縱宣即彰內無隱願哀愍語我則顯外有瑕玼身三口四委托五德舉之名自恣也靈山問云不言心者毗尼不制單心故但言身口也言故至也者不孤獨者發正云若犯罪不除不應僧法棄於眾外故稱孤獨令其自恣悔除堪入說戒羯磨二種僧中共住即不孤獨也依篇聚治乃至呵責名苦言調伏喜悅等者輔篇云謂先有犯迷己不知因舉悔除服本清淨既無罪也故自意培悅第二文三初徵所以二若論下釋三故律下證初如文言若至焉者將同期欵者欵說文云情欲也期者剋定也夏初創集情欲剋定同住安居詣往也鄣道過深者尸羅不清淨三昧不現前是障道犯突吉羅則九百千歲墮泥黎中過則深也第三文二初直證自恣之時二毗尼下顯精脩行成恣舉無失之時一唱言故至恣者如文言此至行者此恣舉罪之相雖顯有無智者濫行非法自恣破昔非也第二開章別釋文二初舉數列名二依名別解言就至行者如文三段不同今當第一於中分二初舉數二前明下列釋初如文釋文二初明時節差別二辨應人是非前二初約事別明三種時節二然律下據教取義剋定一時前三初有閏依不依自恣二因爭增減自恣三脩道延日自恣前二初約依閏不依閏自恣二若閏七月下前後安居逢閏不逢閏自恣言前至恣者若依閏者閏四五六月前安之人定百二十日律取七月十五日自恣中後二安則不定也不依閏至九十日自恣者但數滿也言若閏至恣者非前安居等者發正云是中後人也若五月一日已前安居者至閏七月一日得去若五月二日已後至後夏結者皆越閏月過至八月二日等已後數滿九十日自恣也言二至中者當陽云如前說戒篇引四分外界閏爭比丘來佛令增減說戒若知十四日來十三日說若十五日來十四日說已入界當令入浴比丘出界說若不去者白僧言今不得說待後十五日當說不得過三度應和合說今時自恣唯改說戒為異餘文並同故指也向前為減白待後月為增自恣白僧文云大德僧聽若僧時到僧忍聽今日僧不自恣至黑月十五日自恣白如是客猶不去者再白亦爾不得至三舊比丘應強和合自恣為入冬分故也言三至日者准律自恣中云時有住處眾多比丘結安居精勤行道得增上果諸比丘作念我曹今自恣者便移住餘處恐不得如是樂白佛佛言若有住處有如上事者應作白增益自恣作白云大德僧聽若僧時到僧忍聽今不自恣四月滿當自恣白如是謂初安居人至八月半是四月滿也第二文二初准律諸文三日不同今須剋定二若有難下據論開文一月自恣前二初總引諸文據教剋定二律文下通疑言然至定者自恣揵度文中但言十四十五兩日自恣急施衣中有十六日次第增中亦明十六日案律緣中有王大臣為僧作安居中賞勞衣夏竟擬施有急緣遠行欲預將施僧諸比丘夏未竟不敢受白佛佛言夏有幾日在答言十日在佛開有此緣者自今已去聽前十日受名急施衣即是七月六日得者開受過前受者犯提鈔意既言去自恣十日在明知十六日是自恣日也次第增者若七月六日得衣至十六日已滿十日即合犯長由入迦提故不犯至八月十五日即須說淨若七月七日得衣越迦提因增得一日即十六日須說若八日乃至十五日得衣越迦提月增得九日名為次第增也謂將後非時日足前得衣滿十日也若有迦絺那衣過五月後增亦如是鈔引意者次第有十重增文皆至十六日云越迦提數滿十日說淨明知十六日是自恣日也律增三文中亦有三日則十四五六三日也上廣引律諸文有三不同何是自恣日耶鈔云律安居竟自恣三日中取十六日是安居竟日也羯磨疏云今行事者多用十四日後夜作者古法所傳不可輙用然德衣法云安竟自恣及急施衣中皆十六日為竟也言律至定者先應難云既取十六日安竟自恣者何故律云僧十四日自恣尼十五日恣者鈔牒上難調律文言僧乃至自恣此謂相依問罪故制異日也立云尼要先來僧中自恣後還尼中自恣若先尼中自恣後入僧者非法及論尼作相依問罪之法三日通用並得不要須十五日也又釋及論作自恣法三日通得約其減論取十四日故云通用今剋取十六日自恣為定為律云夏竟應自恣及云夏竟受功德衣若十五日受者不成但名非時衣故取十六日也若尼來自恣但向僧自恣時蹔停作之即得何論要須十五日也下作法中明也向僧自恣時尼來自恣但用僧和法更須新和耶答律藏無文准文義意新和方得前和為僧今為尼眾所為雖皆自恣而僧尼二部不同准文尼依僧住普令舉罪若一人不知不成自恣則令問誶禮拜等今時多有思之言若至恣者如文言二明至足者文有二意初約義總明並須一時自恣二四分下引後同前顯一時之義如文第二自恣方法文二初牒標舉數二就五下依標別釋言二至也者如文釋文三初五人已上僧法二明四人已下法三明一人心念法前二初明六人法二次明下明五人法前二初標列章門二初中下牒章解釋言就至事者如文四段今初初中文二初明集大僧緣起二乃至下集沙彌緣起前二初據教方法二故律下引文證釋言初至不絕者當鳴鍾者律云應打揵搥作煙唱自恣時到等處床慢相不絕者羯磨疏云離床捨憍慢故謂在上五德來取自恣故成慢也第二證中二初當律兩證離地離座二五分下釋上離地座相兼辨緣起方便一唱言故至詞者離座等者下五德行事中云四分但言離座不言草座五分布草而坐明文依用也並偏袒等者表恭敬右順吉祥著地示其卑下合掌表一心無二言乃至至明者待唱等者飾宗云鈔與義淨三藏不同鈔約出別處自恣三藏云過午已去眾咸共集大德先自恣後方尼眾次即下三眾各來對僧自恣鈔云乃至則越中間尼等約別處者據有別處為言若必無別處待竟還來僧中未曾別也如別法者沙彌篇中自恣詞句同大僧也第二五德進不文二初牒列章門二初中四分下依章解釋言二至儀式者標列也然此一科皆言鈔錯鈔有深意人難得知為前大科約人分三一五人已上僧去二四人已下對首三一人心念據科明五人已上然五人亦是眾法已上故然故鈔前牒標云就五人已上意明五人之法與六人已上前一後二其義不殊唯就第二五德行事一門五人異六故科出簡異令知故至五人後云餘同前法故唯五德行事一門別耳所以就此科分者意同後前唯簡此一門為異故作此科是深意也若但向六人五德行事門後便明五人法者恐新學致迷謂前牒標云就五已上今於其內復出五人恐有斯雜故不便出若爾何不合下就僧法分二初明六人已上法次明五人法可不便也答若合下分又恐有繁略二過故不可也若但出五人差法及五德行事二法略無前後諸門恐新學不委若更分門廣釋文相成繁今但向五德行事門中略標簡異釋五人已上法竟然後略出五人異六人處自餘即指同前一則相嘆易識二則不違前科三則離其繁略意如此也今講解相承恐文難知合下科出比代記中且將五人已下舉罪為五人法復言已上無此理也至後鈔主自結云上明六人僧法分明下始辨五人眾法簡異今知此意且准前科也四段不同今當第一分三初正簡德不同二所以下辨差二人所以三今行事下科簡是非言初至故者文中取具二五德者謂一人具兩種五德也發正云謂對他說詞云我某甲亦自恣即須具自恣五德也若見聞疑罪大德語我等又須具舉罪五德也律文前後列者前為自恣後為舉罪故前後也今須兩具故鈔一時出也言不愛者慈和云謂於眾親厚不別有愛故二不恚者謂於怨不嗔恚吹毛覔過三不怖者謂於有力人邊不怯而不舉也四不癡者謂解了羯磨如非不癡也五知自恣不自恣者謂知有難無難廣略之宜也又知十三難等體壞之人不合自恣犯殘已下悔竟自恣律云又差知時等五德鈔文自解一知時不以非時者鈔解云意令和合無爭謂舉過靜爭無不和順若舉不知時則生鬪爭二如實不以虗妄者有罪非謬謂犯有三根名如實有罪三根不牙故云非謬即非虗妄三利益不以損減者欲使至彰釋其利益返上名損減也四柔軟不以麤獷者故勸喻等釋其柔軟返此麤獷也五慈心不以嗔恚者愍物等釋其慈心返此皷恕名嗔恚也不假別釋也言所至故者四分文不了者自恣中但言聽差受自恣人有五法者應差不言二人一不了也羯磨詞中單云僧差某甲比丘作受自恣人無差二人處二不了也十誦僧祇五分三律雖有二人多人法義由未了輔篇云十誦差二人者更互為法也祇同也五分云作自恣人若一人若二人若眾多人不言數或差十人五對兩兩入法前對作法若困互息還遣兩人交替如是取遍為僧多故更互息作義由未了三千經云為相向出罪是了義也言今至也者多有人人別差者靈山云古人行事見四分中單差一人遂即人人別差未通十誦祇五等一時差文也或只有五人自恣則應人人別差以三非僧若六人已上應二人同差第二文三初能差是非二作羯磨者下辨索欲問和三應云下作法差遣一唱言二至持者此律開與欲不同他部者祇云不得與欲自恣若病應將來若畏死僧應就彼作法若病多僧應出界自恣觀其文意由是舉罪事須現前恐叛舉罪故制也勵問夫欲詞不得稱僧所秉之事今何言與欲自恣答今言自恣者謂說己心行恣僧舉罪本非稱僧家事也亦有通別者若答言自恣羯磨者即是通答若言差五德羯磨者是別答至後五德單白時更須問答如上羯磨篇也第三五德行事文三初作白和僧二次明下行草法三五德下告僧儀式前三初威儀進止二作和下正作白法三不應下料簡是非一唱言三至法者㟧云白中律云僧和合自恣鈔文無僧字者准例合成是緣非骨多有呵者不識羯磨緣骨亦是觀事乃同於法也不得通用後法者不得通用此和秉於後單白法若如前至二法者却指上差自恣五德中答云自恣羯磨此已通答竟並是自恣事後更不須問答故云通和二法也言次至時者華嚴云其草勿使五德行應年少行之依無量壽經上卷說偈云吉祥童子施佛草如來受已成正覺我等比丘効佛故受草自恣淨三業言五至之者如文第四文二初明對僧自恣方法二若五德下明舉罪治罰法前二初引大聖示跡同僧二次下正明對僧自恣方法言四至中者增一二十三云如來坐草座已告諸比丘各就草座我欲受歲我無過咎於眾人乎又不犯身口意乎如是至三諸無對者時舍利弗從座起白佛諸比丘眾觀如來無身口意過所以然者世尊今日未度者度未解脫者令得解脫未涅槃者令得涅槃為旨者作眼為迷逕路以此事緣無過咎於眾人亦無身口意過也時舍利弗白佛言今向如來自陳我無咎於如來及眾僧乎佛言汝今都無身口意過所以然者汝智慧無量無與等智總持三昧戒定慧解脫知見成就所作如法未曾違理如是五百比丘各各受歲亦復如是准此經意謂諸聲聞脩少欲行故見坐草今倣佛成規遂坐草也新歲經者㟧云別譯五紙許失譯經也第二文三初明五德就上座所跪立威儀二應作下正陳自恣詞句三若眾僧下說已告僧言次至言者此僧祇文者准祇二十七云若二人作自恣者一人受上座自恣一人下座前立上座說已下座次說如是展轉為四分文不了故取祇文一坐一立也問豈非別耶答此別對五德一人縱宣己罪又是法差無別眾過言有別者愚之甚也應加捉足之言者羯磨疏云十誦中並差二人取上座作也來至執足口說求聽若是下座不得執足乖儀式也第二文二初明眾僧自恣二若二下明二五德自恣次第一唱言應至法者此加一心念者與律及羯磨本異也所以然者准祇二十七有心念之語此對五德別人准法合爾羯磨疏中分為五句疏云初大德者正告大德求聽說也小者言長老二眾僧今日自恣者牒僧自恣時也三我某甲亦自恣者下應上法縱陳過咎恣僧舉也四若見聞疑至語我者我有三根慈海賜示也五我若見至海者從聞悔過成我清美也三說者表仰囑之勤非是濫託也上且一途釋其大小更通論之長老乃大故經中長老舍利弗賢者阿難等律中不定今略釋之行解具故名為大德年德高遠名為長老如俗中云長者言也前單牒者但告五德後雙牒者勤重之至在僧故也問前對小者得如文中云大德不答具德差遣成所推敬何得不稱善見云大為大德小為長老且分二人義通上下餘不可盡也上座復本座者律云時上座自恣竟胡跪乃至一切僧竟上座疲極白佛佛言聽隨自恣竟復座第二五德至同上作法者牒前祇文中第二五德也羯磨疏云其小五德在第二上座前立待眾首作竟方互跪對作故言同上作法律開病者隨身所安律云時有病比丘胡跪合掌時久病增僧即白佛佛言自今已去聽病比丘隨身所安受自恣注云准此等者不用依上座預前胡跪久合掌但隨身所安臨自恣時胡跪也若不病者應隨上座胡跪合掌待自恣訖復座今不行此但依上座開文也破十誦家法者十誦二十五云從上座至下座說自恣竟今五德自相向作自恣今祇不同各至本坐處相向自恣即與四分一一次第從上座自恣義同故取祇也言若至也者事訖白僧十誦之文可知第二舉罪是非中二初明舉罪是非二若僧下辨僧數多少治罰應不前二初明五德別人舉得實罪治竟自恣二若事下料簡五德別人舉罪差互治謗應不前二初五德次別人一唱言若至之者舉得六聚者鈔意先治然後自恣發正云舉得夷有䨱儐出治不䨱與學悔治第二篇有䨱不䨱今發露竟自恣三篇已下皆悔竟自恣恐稽留法事皆發露已自恣別人舉者三根並實依遮法治遮揵度云應召入眾中當為舉舉已作憶念應與罪上座又具問能舉徒眾上下及所舉人已聽許治之然後自恣第二文二初別人舉互反治二五德下五德舉謬簡異別人不加謗罪一唱言若事至謗者舉根不了者實犯夷罪或見言聞或聞言疑三根不能辨了即治謗罪也眾網中者彼云若明不成者律云若不舉不作憶念不伏首罪犯不應懺罪已悔竟不現前非法別眾七非並作法不成也五德不爾如文第二辨僧數文二初辨滿二十眾六聚並得治之二若五下僧少白停指四人中說言若至之者有舉得犯六聚者但有二十眾並能治之言若五至說者為僧數不滿二十出殘罪等不得故且白停進不如四人法者彼云若犯提已下罪其問自言舉來並前懺已自恣此是進也若犯四人已上偷蘭乃至僧殘交無治義彼引十誦白停後待眾滿如法治之不應礙自恣也白停其治罪也此是不也指彼同此故云如四人法中說也第三明尼來文二初正明尼來請罪二五百問下辨尼出界不得獨行前二初明僧尼同時自恣法二今時下辨僧尼異時尼來請罪法前四初安置處所量時早晚二當命下正對僧自恣法三大眾下告尼法戒式四至寺下歸寺傳告之法一唱言三至法者不須同說戒問尼有無者華嚴云謂說戒時問誰遣比丘尼等此制令問擬差人往教俗尼眾清淨彼此俱益今之自恣直是尼來求僧舉過聖不制問來與不來故不須問如別法者尼眾別行篇明也前明自恣時節中云及論作法三日通用不要須十四日僧十五日尼但定取十六日停僧自恣待尼請罪亦得也後依律文更出異日第二文二初正明尼來對僧請罪二問下通妨言今至示者餘同前示者謂同前大眾良久嘿然勅尼等也問答中二初問次答初如文答文三初立理答二故律下當部證成三僧祇下引為准一唱言答至疑者准祇明日尼來僧請教誡人傳大僧中上座教還尼眾中說尼有不來須說欲同是僧法准用無疑也言五至故者重罪者華嚴云謂殘罪望下篇為重非謂夷也然差尼來但得羯磨差一尼餘尼口差為伴也第四雜明略說中二初正明略說二上來下通結前四此科准理亦不合於此分之但為鈔主第二門中分於二科恐人有迷故至第四門後結前生後且隨文分耳初文二初明八難餘緣大界恣法二二明下惡比丘難結小界自恣法前二初舉八難時熱為略之緣二當今下正明略法言四至等者八難餘緣並如前說戒中也第二文二初對五德略說方法二四分若賊下不對五德略說方法前二初正明略說方法二今或下科簡是非言當至恣者㟧云准自恣中對五德略則有再說一說為二今鈔文不明再說律竊語者明上一說令大眾聞知因六群竊語疾疾自恣佛言非法也言今至等者有三意初述非相二律中下引律顯非三十誦下他部明是華嚴云鈔引十誦悟也此是祗二十七云應從上座次第乃至總唱等不得逆作次第者謂從下向上為逆也行行如益食法者如有十行人坐一行著一五德自恣如益食法超越者謂不依次第從第一上座過即越第二上座過取第三上座等四分亦有與祇同不明了也總唱者言一切大德僧見聞疑罪自恣謂彼律文如此等者等取其餘非法之事也第二不對五德略中文三初明三說法二難事轉近下辨再說一說法三四分下釋直去法言四分至法者各各相對等者且如百人為五十對各各人別三說文同前法者謂詞句也言難至故者難近作白再說更急作白一說此有三單白謂三說二說三一說即三白也此並不對五德也言四至去者謂對五德再一為二次復眾中三今單白成五第六難事更近驚起直去即六種略也言二至之者律云為難比丘入浴已同師道友出界等事希故略之言上至上者謂於第二門中分恐後人迷故結異也第二次明五人法約鈔第二文中分講者合初分也言次至法者有四意初總標簡異二欲法有無異三問和下差人總別異四取自恣下受恣雙單異問上六人五人同是僧法如何異耶答為五人行事不同六人恐濫行故簡異下出三異若界六人一人說欲餘五成僧得羯磨差五德也若五人者一人說欲餘四雖僧但是能秉若差一人為五德者三非僧故不得與欲不得牒二人等者鈔主正取差人時五人僧體只得一一差不得雙牒二人者以所為之人不足數故三既非僧如何差遣餘同前法者謂舉罪前已明五人舉罪白停也及尼來難事略法並同前也大門第二眾多對首文二初明集僧加法二若犯下辨犯罪治罰進不前二初總明集僧不得受欲二四人下正辨四人作法之相一唱言二至前者如文第二辨治罪文二初犯輕悔己自恣二若犯四人下犯重罪發露自恣言若至恣者如文第二文二初且舉所犯無治罰義二若准下引文釋成得自恣義言若至義者靈山云若犯四人已上蘭不許懺者謂一人犯罪餘但三人即懺不得此准十誦四人為小眾即中品蘭已上無治罰義若准四分滅爭中小眾通二三人則中品蘭小眾懺亦得今言四人已上者則上品蘭耳但入偷蘭說中者華嚴云此謂犯其偷蘭罪舉來至僧未及得治因難驚起名入偷蘭說中謂犯事已彰教中說犯故曰入說中也乃至者越夷也僧殘亦爾故眾不滿交無治罰之義也第二文二初准十誦白停即後自恣二四分下引例發露合得自恣言若至恣者富陽云謂自恣舉得重蘭殘等罪眾不滿不得即悔不可自恣且白停悔罪之事以其舉得罪合眾知竟類同發露得自恣也第二引例中三初舉例二理須下示發露之法三此中下辨不實得罪前有二意初引例二既俱下會釋一唱言四至妨者輔篇云鈔引此文將例自恣富陽云說戒發露竟罪未悔得聞戒自恣中舉得罪發露竟罪未悔亦得自恣也既俱是淨行說戒防未起非自恣防己起過防過一同故俱是淨行又說恣俱是眾法攝僧功齊約界盡集治罰功齊有犯不得聞戒有犯不得自恣等以自恣准說戒用之有何妨也言理至淨者牒其所犯者示說詞也輔篇云二三人自恣舉得殘罪者應云二大德一心念或但云大德一心念我某甲比丘犯某僧殘以眾不滿未得治之餘者清淨此准說戒形勢也又復自恣時各各有罪者各說罪名發露竟亦得自恣言此至也者有二意初明不實得罪則重二不同下簡異嘿妄得輕華嚴云實不淨對他稱淨是故妄語前境有三便結三提不同說戒嘿妄表淨但得吉也第三一人心念中二初陳恣二若犯下懺治應不前二初集僧緣起二若無下心念加法一唱言若至說者如文第二文二初明輕罪懺竟自恣二若犯下犯其重罪治懺應不一唱言若至前者輔篇云重吉已上無人對之即無悔義獨自又不得發露故不應自恣約義如此餘依前者鈔意准前心念說戒中彼文云或云發露或云待人靈山解云或待人者僧祇文文云若無客來者作念若得清淨比丘此罪如法除念已心念口言二說布薩彼又引五百問論合掌向四方僧發露然後廣誦戒本彼此俱是淨行眾法攝治功齊復應須牒其所犯餘者清淨也然後心念口言三說自恣也問何以得知餘依前者即取前心念說戒文耶答羯磨疏心念法中大同說戒也大門第三雜明相中文有十一段初明僧別詞句不同二問自恣竟下辨自恣竟得說戒不三問自恣得下未受具人得聞恣不四律中下僧別說已更有客來重說進不五問十五日下辨七月十五日自恣竟得出界不六問此界安居彼界自恣得不七問前安居下明後安居人得衣分不八問一說下釋無難緣略說成不九四分下老少無知教詔法式十問界中下辨前後安從多恣法十一問安居下釋其夏滿離處進不言三至僧者通有治舉義者此明僧法自恣舉得夷罪即殯棄治殘者得行䨱六夜出罪等乃至蘭提惡作皆得治之客得足者如前文云若數滿二十並得治之此一向得足若但有六七人出殘罪兼懺重蘭准十誦八人此即不足故云容有亦不定一向得也別人雖有治舉攝治未盡者若是提吉可得治罰若夷殘重蘭人少不可懺治未能得盡故但言清淨也言問至戒者明了論中若五人自恣先誦木叉戒竟次第一人起胡跪合掌請為說罪主說見聞疑罪請覔見聞疑也此說罪主者自恣五德異名也即先說戒也四分律三十七云自恣已說戒疲極佛言不應自恣已復說戒自恣即是說戒也問說戒為知戒相防未起非自恣淨身口除已起罪對治既異云何即是耶答已未雖復不同意令清淨不別故云自恣即說戒也言問至之者如文言律至明者更三人來僧法自恣如前明五人法中明二人來還同對首如上四人法云諸大德一心念乃至清淨三說及舉得罪等並如前也言問至還者由十五日夜分未盡至明相出後方得出界離衣者謂前安居人得迦提五利今夏未盡置衣出界未入迦葉豈非離衣餘如文言問至罪者深云四分云此處安居受日往餘處自恣亦得祇則不爾彼云此處安居餘處自恣越毗尼若受日若一月乃至後自恣應還若不還者越罪若道路有難畏失命者於彼自恣無罪言問至受者華嚴云此是時中僧得施物不簡安居前後彼此之界皆施通一化僧也若僧現前物一向不合以時現前物具四義一者時定即同是七月十六日受得二者處定局此界安居人三者人定局現前同住前安居人四者法定謂不須作羯磨皆直爾數人分也故知後安居人不得此物也為未來故受者當陽云律文以前安居人夏滿遊行因自恣時便分房舍後安居人未滿亦得分不佛言聽為未來故受望猶是坐夏不得輙受今時分冬房後安居人亦得為冬分時受以今望冬名未來也言問至應者語不出脣是私竊語不合雖語不令人解者並非法也言四至之者文有三節初直述年少不知之法二年少下因明老者不知之法三故律下引事證成雖老得同少法猶故忘不憶使授者使何人授自恣者教五德是受自恣人故名自恣者也何故老者同年少之法耶引律阿難頭曰謂不善察迦葉呼為年少今老年愚法與年少何殊故例別之也言問至等者謂界中有前後安居人不知前人從後後人從前義約從多為論如律中僧自恣竟更有客來若多者更須自恣以少從多此亦爾也第十一文二初問次答初如文答中二初直答須去二增一下辨恒止不去有五非法前三初舉當宗不去得罪二毗尼下約緣有無方便離過三五分下約請約處分別是非一唱言答至住者母論檀越請安居安居竟比丘尼為飲食故不去檀越生疲厭諸比丘白佛佛言安竟過一宿尼提僧吉五分尼單提中受請安竟不去尼墮僧吉不局一夏但漫心請不犯非受請處即寺內巖窟等處也言增一至德者如文第二迦絺那衣法文二初明來意二牒名解釋初來意者花嚴云由前安居進業夏坐有功自恣無𠎝美響遐布表裏清潔感動物心對此時中分招福施聖開五利賞德資功俗不云乎有功者賞故此衣自恣竟合受乃附此篇中來第二文二初牒名二注文解釋言迦至法者牒名也釋文二初注文番釋名義二就中下開章解釋前二初依論翻釋二古翻下約古義翻前四初名堅實二為難活三稱堅固四號蔭䨱一唱言明至䨱者堅實者了論疏云迦絺那衣能感動衣若受迦絺那衣若有檀越施衣皆屬此人此人能感多衣衣無敗壞故名堅實也又一切堅實物皆名迦那乃至見人貪嗔癡等煩惱強盛執固難捨亦名此人為迦絺那心人也花嚴云衣無敗壞者以受五利故感畜眾多長衣不說淨不犯罪名衣無敗壞向若不受此衣畜長過限犯捨即名為敗壞也難活者了論疏云貧人資生短闕取活為難故能抽割少物入此衣功德勝易活者以衣聚如須彌山大為施也謂佛令作此衣時偏就貧人乞求此從所勸施物處得名耳堅固者是不破義花嚴問云與前堅實同異如何靈山答云前唯能感多衣衣無敗壞此則約衣無犯也今堅固者謂約戒無犯以因衣受利而不犯五種戒戒得堅固故祇疏云以受衣不破五戒故名堅固也蔭䨱者立云以此衣能蔭䨱於五利故十誦中詺為蔭䨱衣也第二文二初義翻賞善罰惡二義翻為功德衣一唱言古至也者前安居得故名賞後安不得為罰也花嚴云便招五利功德者從功能彰名然五利中得離三衣者非謂盡得離三本緣起中為大衣重故唯開離之下二無開離文也第二開章解釋文二初舉數列名二初明下牒門解釋言就至相者如文釋中五門不同今當第一受衣時節於中二初明時節二十誦下辨攝閏應不前二初引文定其時節二七月十六日受下約受前後定其日數多少前二初依當宗立法二如是下據其他部義立三十日受衣言初至捨者律緣起中十五日自恣竟十六日持糞掃衣及持新衣往見世尊道遇天雨衣重疲極白佛佛以此因緣集比丘僧安居竟有四事應自作應自恣應解界應結界應受功德衣前安居人七月十六日受者靈山云簡濫文云安居竟受衣然安居有前後後安居竟不合也此月本音名迦絺那衣月此方存略提替絺那云迦提月至十二月等者佛言不受衣一月受衣五月齊冬四月捨即十二月十五日也第二據他部立義三十日受衣文二初據教立義二故十誦下引他部證成前二初依他部立理二故文云下引律即日之文證成日日得受一唱言如至等者發正云祗五十等三律通一月日受衣四分但局七月十六日一受衣鉢取此文故云日日得受謂從七月十六日至八月十五日來一月中日日得受也即日來不經宿者制不經宿者與人同宿恐成觸染作法不成猶如淨地經宿不得作處分法靈山云此約施與僧竟如來施與僧雖曾經宿不犯下祇云未用三衣約作豈非在界內耶如他物淨必若元許施為作事則不成也第二引他部證中三初十誦證成一月之中日日得受二五分下證其受同簡其捨異三母論下雙證受捨二文不殊一唱言故至捨者十誦如文靈山云五分受有三十日捨亦三十日前安七月十六受至十一月十五日捨若七月十七日受如是乃至八月十五日受至十二月十五日捨即受各三十日也若後安八月十六日受十二月十五捨此受捨各一日前後二安並四月利後安得利不同四分也毗尼母過八月十五不得受故云過是不得也鈔意欲取三十日受衣故受捨雙引明四分文闕也言七至知者如文言十誦至閏者有閏但七月十六日受者數滿百五十日不得取閏也第二明衣體中二初出衣體二十誦下辨其成不之相前二初明衣體應法二四周下辨衣色相是非一唱言二至色者糞掃衣中有二種案律文若是新衣若是故衣故衣新物揲作淨浣以納作淨邪命如前四五邪得也心貪財利諂說少欲曲順人情得物非法也冬披暑服悕望人施名為相得稱王家施物激動張人令張捨施也得物作淨非捨隨財離上諸緣即日而來名為應法若過是條數者靈山云此明衣相向言五條十隔下者為言准得中上二衣七條大衣皆得受作也搌者尼展反亦有展音又六群作五大色佛言聽用袈裟色此色如也五方青黃即云正色既離五方此立翻云不正色也第二文二初諸部雜辨衣體成不二四分下別顯編邊安約成受一唱言十至受者䨱死人衣到塚取來者濟云謂改葬換屍上衣取來施僧者是也注云四分等者靈山云然糞掃亦通恐濫今簡謂是衢露拾得者成體若經䨱死人衣則不成作也揲葉者謂上云不割截作不成恐揲葉者不得故簡出也此衣連條但揲葉作隔也及故衣不成者靈山云下至經試一者即名故衣如不揲坐具故者不須揲下至經一坐也若急施衣時衣成受者立云謂於非時中受得此急施衣若本受時擬作功德衣者即不合也今言得者謂本無心擬將作功德衣者得時衣即夏末施坐夏僧衣是也上伽論死比丘受用三衣不得祇中未曾受用者得作五分若比丘貪利捨三衣作功德衣五事皆不成反上成受明即比丘施衣亦得作功德衣引見論七眾衣得並受作此辨能施衣人比丘衣雖同界未捨作功德衣同宿無過隨受一二得者於三衣中隨受一衣二衣者意謂三衣並得受作功德衣不必如十誦要須僧伽梨下二衣不成受或有釋言或受一衣作或受二衣共作並得意謂不然此正明衣體未辨多少至下引見論明之故不取後釋也四分編者畢綿反又步彌反以線次第織繞邊也第三簡人中二初牒標別列二四分下依文解釋初如文釋中兩段今初分三初四分二見論三十誦言四至成者謂與欲人者立云謂在房中不成受不得五利又不足數若有難者立云謂十三難人不合受功德衣亦不得五利也下十誦中學悔沙彌上不成例此可知無僧伽梨花嚴云謂緣起中本為大衣重故令受功德衣開其五利既闕大衣則此利闕故不成受下二衣闕無妨問本闕大衣今時將下二衣當大衣處得成受不答律無明決然文中衣有正從理合得也然從衣者開無闕衣之罪據其衣本非僧伽梨其事甚難且約正衣又順律判不違初緣也而彼在界外者前在界內與欲上既不成僧受衣時出在界外無得理也言善至受者明異界僧不得受許請異界人滿數及與作法而不得受言十誦至受者准十誦五十三云彼離問佛諸比丘安居竟眾多僧坊共結一界受衣受已捨是大界捨已一切比丘名捨衣不答隨捨者捨不捨者不捨也發正云准此問以世尊為饒益諸比丘故各解本界受功德衣已復解此界更依本界各結界時隨諸比丘本要心捨者解界時則捨若本要心不捨者則依本利也初舉犯殘人未從僧乞懺別住人者從僧乞別住人學悔人謂犯夷與學悔治滅儐人不肯從僧乞懺而滅殯治也上來諸人身不清淨故不合受衣也第二能治人文三初辨持人具德二見論下受與進不三若羯磨迦絺下明選持人是非言二至明者持衣人須具五德須知破夏不安居人無大衣等不得受反此得受故云知得受不得了了分明也言善至意者餘同輕物應分重物屬四方僧者深云此論據功德衣是時中僧得故輕重兩屬若多衣總作功德衣並須連著橫四襵五綴今時亦有七月十五日得物來者但名非時現前則不問輕重盡須現前分之又復時中將物施者須問主心為施此界前安居人為通施一化僧尼耶答言施此界前至罪重也者此明心盜法也㟧云比丘受法就師心緣得差者謂就他師邊受他法不與直或盜也第二釋盜六界中分四初地水火二有呪下盜風三若起下盜空四論云下盜識一唱言次至智用者前三可知謂地水火也靈山云如取僧厨下火令冷釜等所不應也或他房中炭火伺彼不在而取者計直犯也有呪至直者准論疏中但言呪扇引風觸身其病即差比丘偷搖計直犯罪盜風鈔准律中加藥塗扇椎能除病義故戒疏云律中有呪扇藥塗比丘偷搖不與價直是謂盜風也若起至空者盜盡可知論云等者謂鈔據上了論本文但云若偷地水火風空等謂等取於識界也謂盜知用者戒疏云識不可盜以無形跡故但可隨緣盜其智用也言自外至疏說者指略也戒疏廣引真諦疏解也大門第三非畜物中二初牒章門二初明下依名解釋初如文釋中二初明非人二盜畜下辨畜物初二初標二若有下解釋初如文釋中二初引文明盜二今或下約義斷簡初三初明犯於二善見下明不犯於三薩婆多下辨輕重相前二初望護生結二若無下約正主結初二初立義二五分下引二律釋成一唱言若得重者今諸處廟各有廟祝等皆是獲主損五望此人結重祝之六反說文云祭神祝詞此人為之因為名也第二正主二初立義二故十誦下引證一唱言若至蘭者立云望非人邊結蘭故云隨境結之故十誦下引境結證也言善至護者發正云鬼歸也謂魂魄歸於冥寞神謂變通自在有力者是此物不在廟中又非塚內鬼神於此二處之物無心守護故盜無罪及人繫樹物者此樹有神依附或但是大樹人多於下祭祠鬼神立云如今俗人於樹下祭鬼神求福所有幡花雜係不敢將還是此主守護非人不用取此物者無犯言薩至蘭者准論若無守護不問滿五咸五皆結蘭此約非人境護說故得蘭也言今至恡者得不如上者有護望護者結若無護望正至結見論無二主護無罪今鈔於其正主可令擲卜而知捨恡者謂冥理窈窈肉眼難見故令擲卜捨恡有明於沙門法全不惱物如今神廟中擲杯挍乞物者是第二文二初標二四分下解釋初如文釋中分二初引人解二餘如下依他部明文初三初標當部無文二有人下初師約畜斷重三故有下二師就人明重一唱言四至重者下律文云時有伽藍去胡桃林不遠鼠盜此胡桃在僧伽藍便成大聚六群比丘盜心取食彼疑佛言夷律文直爾古人取釋不同初師云據此律文盜畜同人得夷故毗奈耶第一盜師子殘下直至五錢重虎象等皆重明知同盜人物也第二右師解云非望畜生還望本主以鼠盜疑豫未決望人由是本主故還就人結重也此釋分二初明結罪所歸二以鼠下釋望人結所以謂六群知是人物又如鼠盜盜心取食佛鼠盜來六群疑豫未決為就人結為就鼠結所以白佛佛言波羅夷為六群知是人物望人猶是本主故還就人結重也若合下人作人想及合下鼠住鼠夷吉自分何須白佛為有疑豫所以須白也不同諸記疑豫屬鼠可言餘至羅者善見取畜生物無犯若准五十多等並犯吉也故五分畜生物不與取吉十誦五十七云取虎殘吉由不斷望故師子殘可取以斷望故多論第二云一切鳥獸殘取吉師子無犯上來總明第一有主物竟今當第二有主想於中二初牒二若作下釋一唱言二至中者立云雖是主物若作無主想發心初白時始舉離本處名經迷心作無主想取不犯故云始終不轉無罪前後互轉得輕重者當陽云先作有主想後轉作無主想犯前蘭輕若先作無主想後轉作有主想犯夷重也廣如持犯者謂持犯境想中廣明也第三文二初牒次釋初如文釋中文三初總明來意二十誦下別引釋成三以此下通結旨歸初二初約義總明二故僧祇下引文證實一唱言然至示者發正云盜心微細不論好心惡心皆犯故云實德未免但以成盜要由有盜心也謂心闇教相非理損財是盜心指非唯有心專盜此物為盜心也盜由心結不望境之是非者靈山云如無主物作有主取蘭如有主物迷作無主取不犯故知由心也不問物境是有主非有主也僧祇好心者謂見僧事不辨成佛法事不辨即好心為成僧事及佛法事即互取佛法錢物與僧用也望濟辨前事故曰好心鈔主恐人有迷故解云謂愚癡犯也謂佛法二物無可諮白愚其教相癡心謂佛在僧中佛物得充僧用雖是好心灼然犯也問好心將佛物與僧用者總無盜心云何成盜答夫言盜者謂非理損財好心將其佛物與僧則是非理損於佛物即是盜也故發正云既言好心應不成盜今違教處齊故犯也故具抄示者抄下十誦乃至四分之文示之是生下意也第二別引釋成中四初十誦顯六種取二伽論辨三種劫心三五分釋盜心有四四四分解十種賊心言十至重者有三意初標二謂下引釋三除下通結准十誦五十一云問六種取他物如鈔列竟云何等得夷答云除出息取餘者得夷鈔敗為六種盜心彼云六種取也苦切取者靈山云謂苦言切勤非理罵辱意存送物相謝也作此心取非理損他財物名盜心也至下皆然輕慢取者輕慢者既居尊位恃己凌他要不就借輕他通用也以他名字者如下四分第十中釋觝突者謂買他物借他物不肯還是也受寄者亦同四分第七寄物取也除出息者謂對面斷當情和可依俗収利而非是盜君增減時俗即成盜也言摩至罪者論有五種劫苦切受寄與十誦同略之故言三也無不與強奪將去是強奪取軟語者與下諂心相同施已還取者古今兩解初云將物施他後悔便奪也汝云施他他雖未得後悔不與亦成犯限發正云問前人為知故犯不知亦犯耶答不問知與不知若爾盜既不知如何結盜解云主雖不知以斷心捨時冥屬於他今既悔取事成盜也言五至心者諂心者靈山云作相親附不正理隨言順意望他施物故阿毗曇云覆藏己性曲順時宜名之為諂也曲心者不隨正理苦相阿黨曲情取物也或云一切非直心取皆名曲心也嗔心者如下釋云與少嫌恨假嗔得財是也恐怖者輔篇云強說妖祥心悕彼物第四文二初總舉數二一下依數解釋言四至賊心者僧五文中出此二五靈山云前五明心後五明取戒疏云文言盜心取者明心應境也欲明盜者心業具須必兼兩緣以成一盜故合為十釋中十段不同依其增增文分二初五明心後五明取然此十中各有標釋言一至規奪也者初一有三標謂下釋三僧祇下指其事同戒疏云不肯修學故於盜境生可學迷三寶互用隨滿犯重耶心者戒疏云邪命也貪心規度為利說法外現清白內實邪濁本五分云諂心取財是盜也曲約不正戾則恨戾恐怯者律增五文五十九云謂不善心謂不善之言諸心並是故改為恐怯即異諸心所作恐怖令心怯弱怖得彼物也逼迫呵喝呵割反靈山云謂口中出聲現威也或說法怖取者戒疏云威說地獄惡報或說王官勢力而得財也或自壞疑怖者自壞疑事擬怖他人捨慳布施靈山云說慳受餓鬼貧窮等報自說我疑亦恐不免方便擊動前人得財也恒懷規奪是常有盜心也戒疏云得物乃休言六至情者戒疏云又變此心云五種取取是其業對境行事也立云如空處盜物是決定取也因先寄物後即抵突全不肯還或言我往時唯領得汝一段物以少還他恐怯取者張拳怒目口云即打恐赫令怖而取彼物戒疏云示身口相令生怖畏故取彼財如十誦中輕慢抵突而取他物也見便便取者戒疏云思他慢藏陽作陰伏之類也因利求利者戒疏云貪心規利為財說法也為彼說法令修善行彼則得利因茲語也令其布施而得其財是求利也倚托取者倚傍威勢假托親友而取他財也說事過實即是浮花令其前人異眼看我故云異望非法說法皆是幻惑群情靈山引佛藏經云說法之人心不清淨為他說法得罪深重假使煞三千大千世界一一眾生其罪尚輕佛言身自證法心無疑悔我聽此人意座說法又雖是凡夫而能持戒不貪名利多聞廣識自利利他我我聽此人說法也言以至境者謂以十伽五四諸文證其有心成其盜業雖未亘塵沙境約其諸說其相略明垣墻者如世垣墻防其賊盜依前諸教識其盜心足得防擬其心不要造趣前境也第四文二初牒名二謂五錢下解釋初如文釋中二初引教定其重體成是幾錢二二以下約義以解盜相結罪分齊初二初標五錢為斷重之體二薩婆多下引諸律論會釋歸宗言謂至物者戒疏云謂五錢即錢體也若直五錢謂餘財帛准錢法也猶如唐律隨有犯者皆約絹估以從尺丈方定刑名也第二文二初依論正判諸釋不同二然五錢下商略歸宗此方取用差別初二初舉論問起二答有下辨三釋不同言薩至錢者問意易知答中二初引三師不同二雖有下結歸勝義一唱言答至是者答也其三師者初依王舍用錢二隨處用錢三又云隨圓盜幾得死依王舍用錢者立云佛准王舍法結戒佛問頻婆娑羅王大王國內何罪合死王言盜五錢死佛依此制戒故多論第二或言金錢銀錢或言銅錢元不定也第二師隨有佛法處等者彼師云不必依本王舍之錢但約當處國內金銀銅鐵胡膠錫䗶竹木等錢即隨處五錢為限第三師又云至限者彼師云依國盜幾而斷死也若據彼論三師之中最許彼義也第二商略歸宗此方取用差別中三初標歸宗來意舉草葉不盜意在五錢二今諸下明此方諸師取用差別三四分下正辨歸宗即定五錢之文言然至盜者然是也是上五錢之義多論十祇互釋不同論則如前律則如後准小錢八十即不同也判罪宜通者靈山云忽有己犯欲判其罪宜取通文即依十誦八十小錢攝護從急者即調部中明其盜相下至草葉不盜也第二此方取用不同中二初標晟行二分依下正辨依其二律一論一唱言今至重者今諸師者江表關內諸師也多依十誦者戒疏云今諸持律多依十誦故彼文云古大銅錢准今小錢則八十也即顯少依隨其盜處所用五錢入重者氏即多論中第三師義顯下伏也須知今師准引論中第二師者戒疏云如多論中盜相通濫初解本錢何由可曉後解隨國現斷入死言亦汎濫難可依承如此虗律強盜滿尺則是極刑竊盜五十疋罪至俣流縱多盜者不加至死論令准死則刑無死名比丘多竊少有強者縱有強奪計尺死刑竊五十疋又非死例准俗制道盜相叵倫如僧祇云王無定法斷盜不定關內依僧祇者即取四錢三以用結重也故祇第三云佛問瓶沙王法大王治國盜齊幾錢至死王答曰十九錢為一利沙槃分一沙槃為四分若盜一分罪應至死今隨所盜義以此為准也第三歸宗印定五錢之文分二初舉宗印定癈上律論之文二善見下引盜相從急證取五錢初二初正明歸宗印定癈上律論之文二縱四錢下潛通伏難一唱言四至錢者四分緣起但云五錢不言古大銅錢當小錢八十又定金銀銅䥫之錢又無隨國幾錢得死之斷故歸宗五錢即癈上十誦多論前後二師及僧祇所立今人用者以後為勝者即是印定今師晟行第二隨其盜處所用五錢入重之判是其後勝故戒疏云若依四分但云五錢錢則八種並同一制如多論中間一解隨國用錢准五為限則諍論息也若爾僧祇即合是後何指隨其盜處五錢為後耶答僧祇鈔文自破故知中者為後難云十誦多論前後二師文寬不了即任癈之如僧祇四錢三猶尚急於四分既言從急何廢四錢三而取五錢為急義耶鈔答云縱四錢三善見解云亦同五錢不能急於四分故歸宗印其五錢為定也准見論第八云爾時王舍城二十塵沙迦成一迦利沙槃分一迦利沙槃分為四分一分是五磨沙迦若盜五犯夷無今同祇十九錢為利沙槃分為四分若取一分成重義同古師云然西國本無今時錢但有如上磨沙迦狀如師蠡也第二引盜相從急證取五錢中分二初引但離之文證其從急二又觀下引斷重證是五錢一唱言善至允者靈山問云鈔明五錢重物今引離處文來何耶答證攝護從急故彼論明其離處二師不同初師離剛口得夷者此據剛中猶是其處出口方名離處後師但離處者但舉即犯不要出剛口何也戒律宜應從急此證取其五錢顯急諸餘律論又觀五事等者論第八云處者比丘有黃衣置肩上行入遂失而作捨心後有比丘來盜心取取已生悔問律師周羅周羅違覓失物主失物主來至律師所律師問物主長老此是汝衣答是何處失答其處失問汝捨心不答已作捨心又問盜比丘何處取答某處律師言汝若無盜心取者無罪汝惡心作得吉然後語物主比丘汝已捨衣以衣與此比丘答言善盜比丘聞律師語已心懷歡喜是名觀處也時者取時此衣有時輕有時重若輕時取即以輕時斷罪若重時取即以重時價直得罪我今取證有一比丘得椰子盤常以飲水置海中寺往支帝耶山後有一比丘往海中寺而見椰子殻盜心取已後往帝耶山到以用盤食粥盤主見而問長老何處得此盤比丘言海中寺得物主言此是我物汝偷耶即捉到僧中具判此事有一阿毗曇師各瞿檀多問此比丘何處取答我於海中寺取問彼價直幾答彼土敢椰子餘殻弃破或然為薪都無價直復問物主此盤直幾答此椰子殻飲汁弃皮比丘捨取作器堪一磨沙迦瞿檀多言若如是者不滿五磨沙迦不犯重罪眾中聞已歡言善哉法師曰如是觀隨處結直鈔取此文證前四分五錢為𠃔釋時竟有物新貴後賤如新䥫鉢完淨初貴後破便故隨時卒直也若比丘偷他物應問主若未用貴己用賤汝等應知是為五處律師善觀然後判事隨罪輕重而己罪之並是論文慈和決云標則有五釋但有四鈔言等者論無等字今此等者等取前時中輕重則成五也以此時中滿五磨沙迦犯重文證五錢為允也第二約義以解盜相結罪分齊中分二初總標二一十誦下伏標別釋言二至同者富陽云辨前五事今准諸教六義釋之文盡也釋中分六初約錢貴賤二約處貴賤三約時貴賤四約得不分列五過減分別六一多分別言一至輕者花嚴云十誦優波離問佛頗有盜三錢犯夷耶佛言有錢貴時富陽云旦如此國乾封年時有一乾元錢直時用小錢一百文是又問頗有盜五錢不犯夷耶佛言有錢賤時也百千犯輕者立云如䥫錢等時所不用雖盜百千但得蘭罪故云輕也言二至價者發正云約處斷輕重也靈山引律云時有眾多比丘方便共遣一人取他物彼往取減五錢來至此得五錢彼作是念我等得五錢犯夷耶佛言依本處犯蘭五分善見意不別也言三至也者立云上三勺中皆是貴時盜賤時貨望本處得重今若反之則是賤時盜貴時貨即得輕故言降降下也輕則蘭也言四至等者斷心者靈山云由本取只取四錢更不擬取故前後不合也言五至類者花嚴云有二義一者眾多人遣一人往盜五共分二者共往盜五各分發正云雖則一人不得五錢當時人往盜滿五業成故得重盜取眾多人未分者物此約十方不滿五故得輕也言六至應知者戒疏云如師語三弟子云彼有六錢大者取三次者各取一我自取一此即師教弟子竟徒有三人亦如是教越却中二戒疏即云乃至小弟子亦作此言彼有六錢和上取三同學各取一我自取一各各互教三人滿五望損一主故各得一夷各各自盜一錢皆得一蘭夷是教他業蘭是自業自作教他二業不合故各得二罪也第五方便鈔文不釋者戒疏云自不假方便如借他物不還善見打破他物不還價直得夷此即不假方便恐涉濫故縱有方便亦俱不明但知離處已前並方便攝故具緣即標辨相不著鈔於離處中顯也第六文二初牒名二四分下解釋初如文釋中二初引教略明二離處約義廣釋言四至重者隨作一事方便即止不成離處得蘭也下引五分出方便與離處分齊也第二約義廣釋中二初總標句數二一者下依數別釋言離處至之者花嚴云雖云離處方犯義亦有不離處而亦名犯為是義故十句分別第二依數別釋中十句同即為十段十段今初初文三初標次如律下釋三善見下證一唱言一至重者發正云如律師斷割重物入輕者理得其壬也景云此舉情有所為不依教如今若依教縱以迷謬無罪也非法用僧物者立云知事人處分將常住僧物媒嫁淨人供給媒具綱維同判判竟結壬引善見意證盡未竟蘭書竟重也論約定地界也第二文三初標二善見下約教以釋三即如下類同一唱言二至重者出言為教令此言纔立即結罪也准論盜心唱言齊如許是我地地主生疑為是我地為比丘地此時得蘭若地主決作失想得夷若來問僧答同皆重者謂地主聞唱言云是僧地心生疑來由大眾眾咸同答是僧地者隨僧多少皆結重也違理判與者當陽景云此明比丘曲判與餘人也違理判得者此明求人約違道理判得此物也靈山云爭田違理者或侵全段或侵界分准違理結犯以理奪得無犯也第三文二初標二善見下約教以釋一唱言三至爾者准見論若有二標舉一得蘭舉二則重若三標舉一吉舉二蘭舉三重若有眾生多標者語最後兩標舉一蘭舉二夷前者隨多少皆吉鈔舉初二標故云乃至一髮一麥皆重地深無價故謂至金輪故深無價也若此比丘來問眾僧今取此地僧答同者皆重也注云謂量地度者濟云鈔意謂將竹弓平執而量地為標也繩彈亦爾者准見論若盜心以繩彈取他地初一繩置一頭蘭若置兩頭夷也第四文二初標二釋一唱言四至也者如文第五分四初標二十誦下正釋三或如下因明借損四律云下證成一唱言五至故者謂有盜心從葉下牽物至花上異本時安置處也故勵疏意謂錢物與氍氀異主離寄處即犯同主俱是一家之物未成離處也第六文三初標二正釋三五分下因明不應一唱言六至羅者慈云是雙陸頭子碁子等類緣將眾牙齒骨等作故云轉齒也第七標釋一唱言七至罪者祇云若比丘盜馬欲東方馬狂趣向南西北方雖離本處意欲向東却向別方是不離也若向東方始是離處也若元盜時不論方所者但舉四足是離處也若比丘盜馬去馬主覺後逐若馬主未作失想比丘未作得想未結夷若主作失想比丘作得想結夷若將草馬誘他父馬去離見聞即夷牛等准此也第八文三初標二據文正釋三如擲杖下舉喻證成一唱言八至重者謂空靜處既無於人盜無不遂雖未離處必定離故動則成重不必全離也第九文二標釋一唱言九至等者靈山云謂田宅等不可移動但使切擊有標五者即結重也第十文二標釋一唱言十至疏者向下引疏釋也見論云旋風吹衣上虗空中比丘以盜心前捉一一得吉若衣動蘭離本處夷故律云有衣物從風所吹有主之物而加盜取明離處者即空異本是名離處餘例此也盜鳥者見論有比丘欲盜孔孔空中欲飛比丘當前立孔見比丘不能飛舒翅而住比丘得吉舉手觸亦吉若搖動孔蘭若提尾牽離頭處夷牽左翅過右翅亦夷上下亦爾立云若籠貯鳥子比丘盜鳥離籠即犯若本無心雖合籠將去未結夷出鳥離籠方犯也曲杙者立云謂壁上衣鈎龍牙杙是也故見論云謂盜壁上曲鈎中物離壁離橛重也謂離壁未離橛蘭離橛未離壁亦蘭若橛壁俱離夷也又如十誦取衣不取架持將架去不重後衣離架時方得重也斷流者戒疏云四分但云若以方便壞池及取水物而不明所損分齊如祇云溉灌流水或一宿直一錢乃至四錢五錢比丘為佛法僧或復盜破壞彼架得越水乃由簡滿五者夷又見論云眾家共一池水注田比丘盜斷他水令注也田蒔未死蘭若蒔死隨直多少結罪水注者戒威疏云僧祇若以竹筒就孔中飲滿者重若稍飲數心咽咽偷蘭若器先塞塞時越注入器中蘭注斷滿者重若注未斷即悔畏重以水到本器中偷蘭雖注斷未離處離處未斷注俱蘭等者等取蘇油蜜等例同也第三通結旨歸中四意初敘盜相難知意存道而呵眾務二何者下徵釋眾務過生之所由三故善論下顯急護而證難知四以准下結歸略意一唱言然至也者情懷勝劣無平等心兼後彼此親疎未傾我例所以初果無學方可嘖事也第三不犯中二先標二釋初如文釋中二初通明不犯二律中下別釋親厚言四至犯者己有想者戒疏云謂實是他物意謂己物無他想故糞掃想者實是有主意言此主作糞掃想取開境想中初有主想句也暫取想者既非永用暫取借用言律至之者難作者如羊角哀佐伯陶併粮是也難與者雷義舉茂才讓於陳壬刺史不聽義遂陽猶不應命是也難忍者管仲鮑叔分財之義是也四五易知六不捨者荀臣伯者友人疾值胡賊攻郡臣伯不忍去賊至郡空間汝何敢獨在答友人之疾不忍去也我身寧死賊知賢旋軍還也不輕者郗超所交皆一時秀美雖塞門復進亦而交之戒疏云情若琴瑟財何有別古有食必兼人衣亦通被故衣從二人食字亦爾鈔意恐難故令准此量之第二別釋戒本依注戒本等略分為八一若比丘謂能犯人二在村落中村落有四一四周垣墻二柵籬三籬墻不周四周周有屋也若閑靜處即村外靜地處者地中一切處所也謂盜犯處也三不與物者主不捨也四盜心取者賊心取也五隨不與取法者所盜物也以王立法若取五錢若直五錢物罪應至死佛隨王法盜滿制重也六若為王王得自在不屬於也及大臣種種大凡輔佐王者也所捉若縛若駈出國若煞汝是賊汝癡汝無所知所治法者捉者瓶沙遠祖治賊但令栴陀羅拍頭捉手便息縛者雖捉猶作祖王使人以灰圍之及至父王行駈出法至沙王登位乃截指至阿闍世乃行煞戮也餘三罵調也七是比丘波羅夷者明罪結也八不共住者明治殯法所以須舉王治法者雖俗制道故也第三煞人戒二初標所制之威名二犯緣下依文解釋言第至戒者初緣起者律云佛在毗舍離為諸比丘說不淨觀彼觀成已厭患身命有勿力伽難提比丘受雇行煞佛恠眾少問阿難阿難定答因請改觀說阿那般那三昧比丘修習證增上果僧佛二呵而制此戒制意有戒疏云所以不聽煞人趣報勝善因所招形心俱是受道之器出家之人應懷四等慈濟物命今內懷嗔忿斷彼相續違慈惱他損害道器過中之甚是以聖制三釋名者戒疏相疏雜引釋也梵云末奴沙䟦陀謂為煞人也成論云五陰不實此中假立眾生之名斷彼五陰名為煞生謂業煩惱為命色心為命體相續為命義今斷相續故名為煞此是所防戒是能治能所通舉名煞人戒也第二依文解釋中二初依文正解二別釋戒本初二初成犯相二不犯相𨷂第一犯境也為犯境約人易明故不別出但於具緣中明也初中三初具列犯緣二初緣人下隨難解釋言犯至斷者如文次辨𨷂緣初人境得境差三蘭一非人人想二畜生人想三杌木作人想𨷂第二人想得六蘭想有三句一人非人想煞二人畜生想煞三人杌木想煞疑心亦三句一人非人疑二人畜生疑三人杌木疑此約轉想疑結前心蘭不約本迷本迷全無罪也𨷂第三煞心闢第四興方便二緣全無罪也𨷂第五斷命容得方便蘭即境強等是也隨難釋中分二初別釋初緣二四分煞有下合辨四五二緣言初至述之者初緣人者戒疏云煞境也所言人者仁也仁者忍也謂人立志存育為先故云仁也注云初識在胎猶自凝滑者戒疏云初識託陰只是凝滑不淨即男女赤白相和是也即是初識所依故涅槃大集歌羅邏時位也乃至命終最後一食者花嚴云此是最後執持之識第八識也謂臨終時一念有燸氣是後識也命終者靈山云謂此身報假之維持於一形壽所因本故謂命根是識所依住故如雜心云命者非色非心為體是眾生往業所剋期居此形連持不絕故名為命故今死者氣雖斷絕隨有暖識識居其中即識住處為命根攝然今煞者報非色故何由可煞識本無形煞亦不得今隨相說斷其依處命根不續識無所依故云斷命也第二文二初准當律直列自作教人多種煞相二十誦下引結部文證釋上結煞相初二初自煞二教人一唱言四至篇者戒疏云所行煞相相分為二初自煞有八一自煞二身相三口說四身口俱五坑陷六倚撥七與藥八安煞具教他中有十一初遣使二往來使三重使四展轉使五求人六教求人七求持刀八教求九遣書十教遣書十一遣使歎也鈔𨷂七八二也自煞者若身若仗隨死皆是也身現相者或今畏怖墜溝壑或示死相口現相者或以言說歎勸其死或以大聲恐唱令死身口俱者即如世中厭身者或以投火墜巖或刀解繩縊不知教者合掌唱善或扶接登山或為辦繩具斯即教嘆正符犯法坑陷者知人遊行必從此道故設坑穿令墮地也倚撥者博末反審知彼人倚撥某處便施刀仗彼依而死倚撥者知他常倚某處常撥某處而於彼處即作機關令後來倚著撥著即發也安煞具者即如世中行刑之所比丘往著施其繩索令伏死者與藥者易知教煞者或教人煞或但教人死之方便鈔言隨其前使也若教嘆者遣人語彼人令彼語所煞者生多眾罪不如早死之詞教遣使者指示所煞在某方而往害也往來使者受語往彼未遂還來後重復往煞者是也重使者本命一往煞恐煞不得尋更重重隨續使人乃至百千彼死本末得重謂本是能教末是所教故重中間但得輕蘭一非能教二非所教自不作故言展轉使者立云初教張人往煞張即遣王王又遣李如是展轉乃至百千皆重初一唯能教後一唯所教中間互為能所也求男子者靈山云於眾生中求誰善解用刀無恐怖也教求者教使人求也遣書者自不親對或自作書或遣人作書令彼受死也等者等取七求持刀八教求也並任方便等者戒疏云非謂如上所列而言相盡更餘方便律雖不載但依而死者皆是重攝故張其網總而取収之欲獲罪人實惟一曰也三性之中能教犯重者謂前令教人煞歎等自於善惡無記三性之中隨住何性但令前人命斷能教俱重也餘如後篇者折中指成就處所門明三性得罪花嚴指境想問意謂不然是第四通塞門中明是自作教人門也上來並依戒疏解若別人擇者自標異也第二引諸部文證釋諸相中六初十誦伽論證釋自煞方便二薩婆多下證釋遣當三十誦為令人下證釋坑陷四薩婆多下證釋口讚死相五又如下證釋安煞具六五分下證釋自煞得罪分齊此一段文並取戒疏意科也初二初辨自於自也二伽論下明自也於他一唱言十至蘭者准律不得傷形明知不得自煞舒者舒展腰脚強與他案居致死並是好心不作故煞意故不犯重言薩至同者戒疏云遣書身現其相表於紙墨令用死者如多論中若優婆塞及以比丘知吉凶相令破異圓隨得財命皆同煞盜重罪也謂比丘雖手不煞盜然遣書令他破圓得財財圓得二夷優婆塞例同者例同煞盜二罪不言夷也言十誦至輕重者折中云為人作坑畜差蘭者人家境差蘭也為畜作坑當死如律得提人死吉者畜家境差吉也隨境輕重者花嚴云詣人死得夷非人蘭畜提由本慢心故言薩至重者戒疏云口現相者或以言說讚勸其死也有二意初引教證釋二今多有下指事例同言又至亦重者亦多論文也戒疏云安煞具者如世刑所比丘往者施其繩索令依死者同重立云因相從者有比丘犯王法多有餘比丘相從往者名為相從人也儈子從此索手巾等也靈山云既尋用語者得重不尋用語者云何若彼語言我依王教汝且依道思惟佛語是時得吉更起尋思前比丘語用故得蘭以不即同語故也言五至便者謂前雖引十誦不得自傷若有自煞等者得罪耶故引證也身纔命終別脫戒謝罪無科處但結前方便蘭也第二不犯法中二初正明二故俗下引俗律以況一唱言不犯至之類者俗律云諸過煞傷人者各依其狀以贖論謂耳目所不及思慮所不到共舉重物力所不制若乘高履危石落煞人及因繫禽獸以致煞傷之屬皆是無罪舉俗以況道第二別釋戒本六句分之一若比丘能煞之人二故自斷者明自煞業也三人命者所煞境也四持刀下明自他煞業分二初舉煞業二結前初三初持刀與人即安煞具二歎他譽死即口讚煞三勸死者勸他令死歎也二作是結前三也五結罪六治殯第四戒文二初標所制之戒名二具九緣下依文解釋言第至戒者緣起者佛在毗舍離時世穀貴乞食難得婆求河邊有安居者便共稱歎得上人法信心居士減其分施僧所佛因覺便呵制也二制意者戒本疏云然無為聖道非凡所證由未得故謂假虗談自言己證或亂群心欺負於世希招名利噎法𠕀時過中之甚故謂極制也三釋名者戒疏云體乖實錄名之為妄過重欺深名之為大成業在言名之為語戒是能治之行故曰大妄語戒釋中分三初依文解二別釋戒本釋中分三初明犯境二又四分下明犯相三辨不犯法初二初明成犯緣二四分十誦下辨其犯境言具九至解者如文次辨𨷂緣戒疏云若𨷂初緣是人有非人畜生杌替處得三蘭𨷂第二緣六蘭想疑各三也𨷂第三緣境虗今為實者全無罪也謂將聖法為境以實未得言得故名虗也𨷂第四緣即增上慢無罪也𨷂第五緣無誑心戲故得吉𨷂第六緣過人法言說人法無罪也問何故但言過人不言過天者答如多論解佛在人中結戒故人中有木叉多修善法入道勝天但云過人已過天故也𨷂第七緣不言自證無罪𨷂第八緣言不了得蘭𨷂第九緣前人不聞或聞不了蘭也第二犯境中二初正明二十誦下問成犯所以言四分至蘭者文具三意初標犯境二若云下口說得相三若現下身造口業此二律一論同明過人法皆言從得不淨觀以上至四果來是其犯位也若現身相者立云謂眾僧盡生有人唱言得羅漢者起比丘自知是凡而立者前人若信得夷訖五得蘭言十至入者不淨進小法者謂是外凡五停心觀謂貪欲多者作不淨觀嗔恚多者作慈悲觀愚癡多作因緣觀著我多者作十八界觀思覺多者作數息觀既是淺近小法何故言即得犯重耶答是甘露初門者甘露謂涅槃也謂永斷煩惱證大涅槃皆先遊五觀之國故知五觀是涅槃之初門故云一切聖人由此入道也第二犯相中二初引四分天龍神來向說皆犯二應得下自稱是佛但得偷蘭言又至重者天龍來者戒疏云過恒人之有相與聖道故齊一重立云本欲向張說而向王人說張王雖殊同是人故言摩至說者戒疏云伽云我是佛者我是天人師者並偷蘭以人不信故若云我於四沙門果退者夷以言有涉也十誦云若人作書自云初果以書示人書云得果我實非得犯蘭祇云若言某處皆非凡夫者越毗尼我亦在中者蘭以非定指故若言我亦得此法者犯重也言不至故也者如文第二別釋戒本依本疏分七一若比丘能犯人也二實無所知者明境虗也三自稱言下正彰過體注云於於中分二初自稱言者總舉聖法二我已入居下列舉聖法言又聖智者謂得生空之智故言聖智會正名聖由觀無我感於聖故勝法者謂得法空解達陰等知無故曰勝法我知是我見是重結前二句也四彼於異時下明其自言異時者謂要語後自言時也若問乃至虗誑要語者望首前罪五除增慢者除開緣也謂無漏聖法出過也有名為增上未得謂得名之為慢愚教無知不結罪故故云除也六結罪七治殯可知就結章中戒疏分二初有一句告眾情也若比丘犯下除疑執也今問諸大德下將說後篇又靜眾也次除疑中二初云若比丘犯一一法乃至不得共住如前者釋同住疑也時人疑意但言犯者不共住不知何等不共故今解云未犯已前以人淨故得於二種法中同住今既一犯不得如舊同法共住故言不得共住如前也二後亦如是者釋重犯疑也時人意謂初犯斬首有戒可破後雖犯過謂非有罪故今釋言後犯亦爾謂經懺竟是中間人以同二種法中共住今若再犯亦不預前共住之例未悔之人後犯亦爾如是比丘皆波羅夷總不應共住也第二僧殘篇雖南山八門今欲略知敘五門義將釋此篇大分為二初總以義門分別二依篇正解初分五初起由三毒二配於身口三自作教人四解遮性五初篇種類初起由三毒者初有七戒因三事起貪染心成次有二戒嗔心起成次有二戒因三事起癡慢心成次有二戒嗔癡起成第二配身口者謂初二局身次二麤語二謗四諫八戒口為正犯有助成二房身為正犯口是助業次媒嫁一戒身口正犯也第三自作教人者位分為三初有五戒謂麤語歎身媒嫁二房自作定殘教人同不同若作此五於己有潤故同犯殘若泛爾教人於己無潤者但可犯蘭也二有二戒謂二謗戒自作教人為己不為己惱境處齊彼我同犯三有六戒謂漏失摩觸自作犯殘教人偷蘭以無潤己故四諫自作正犯教人違諫亦得蘭也第四遮性者媒及二房是其遮惡餘之十威體是不善故是性惡也第五雜類者見論分四初有五戒是愛染氣分婬之種類二者二房兩戒是盜種類三汙家行是煞種類四餘之五戒是要語種類第二依篇正解中二初標篇名二故失下依戒別釋言僧至中者標篇名也第二釋中十三不同即分十三段今當第一就中分二初標所制之戒名二此戒下依名解釋言故至一者初緣起者佛在舍衛國迦留陀夷欲意熾盛隨憶挵失比丘白佛佛呵制也制意如鈔引多論是釋名者戒疏云方便動轉標心究竟名之為故體分盈緣故稱為失此是所防戒是能治之行彼能所合舉故曰也釋中分二初依文解二別釋戒本初二初明制意二具三下釋其相狀初有三意初明此戒先來之意二多論下正辨制意三四部律下述其呵詞一唱言此至施者以犯此戒自行戲失宣能維持故使佛法有速滅也今由制故自行氷潔眾仰維持故使正法久住不滅也心誹謗者多論云世人外道當言沙門釋子作不淨行與俗無異欲生天龍信心者論云若作此事雖復私屏天龍善神一切見之靈山云今若不作則能生天龍信敬心也第二別釋相狀中分二初明成犯相二明不犯法初二初明犯緣注中略并犯境二五分下正明犯相言具至犯者戒疏云律中言境有六一內色者戒疏云謂心能領納名之為受與受相應色名為受色即是人身有識持者二外色者謂非情色非心心所法領納名不受色也三內外色靈山云謂衣是無情身是有情於中作境界也五分云內色己身外色他身有少異也風中者戒疏云乃至口吹乃至餘境者花嚴一切万境皆為犯境故下犯持篇云如漏失戒觸緣斯犯何僧境想第二犯相中分三初五分約睡覺身心俱單明犯相二見論下遂本期心明犯相三律中下亂意睡眠明犯相一唱言五至也者靈山云位在下凡未能無曼故律開也鈔意律開不犯殘既言有五過失戒疏云宣非罪也如五分中不攝而眠五吉羅也此云不犯開於殘耳惡曼者戒疏云曼見煞等故見論云夢通三性若見禮誦是善乃至青黃赤白為無記也意既亂緣天如不護心不入法者心既散亂不能入於覺觀等法喜出精者律中精有七種謂青黃赤白黑酪色酪漿色青者輪王精黃者輪王太子精黑者輪王大臣精赤者犯女色多者精白者負重人也酪初果漿二果也有人於此作三千句鈔皆從略故不敘也五分第二云因有比丘夢失不淨疑犯殘白佛佛呵責云汝等不應散心眠犯吉散心有五過失與四分大同不犯中二初依當宗二十誦下諸部雜明一唱言律至也者欲想好色但起於心行時觸䏶觸衣皆摩雖觸內外色而不作出意無犯見論云精是持身之寶故遍身中若無枯瘁伽論為釋妨故來上諸不犯事緣皆約自有如是事緣不作出意故不犯也若別人故意為他出精為他揩摩令他作上事而出精古前人為他作故犯蘭也第二別解戒本四句一人二犯相三開緣四結罪可知第二戒文二初標所制之戒名二多論下依文解釋言摩至二者緣起者佛在舍衛國迦留墮夷佛制漏失便觸諸女手捉捫摸招譏呵制制意如鈔三釋名者當陽云身相捫摸為摩二境交對曰觸此是所防戒是能治之行能所通舉故曰也向下諸戒雖此結語更不述也戒疏問云僧尼俱觸而罪有輕重二人俱宿而罪無階降者答的對為言綾不綾別故有夷殘宿中懸對譏義是同故俱提也有多問答不能敘也釋中二初依文解二別戒本初文二初明制意二具五下辨釋相狀言多至故者慈云制此戒與為律者如俗人無其良伴即作諸惡出家之人若無此戒便作諸惡故制此戒用為伴也故智論二十一云僧戒是我趣涅槃之真伴如俗人種種眾惡妻子奴婢人民等是入三惡道伴令聖人伴安穩至涅槃者當淨持戒憶念如佛所說戒為伴也此約智論通約諸戒為伴准此鈔文事約此戒為伴至下引見論觸得五罪故將此五罪與諸比丘為淨伴也此是諍競根本者花嚴云諸比丘觸他妻女夫及父母兄弟聞之不忍必與比丘諍競也疑者為比丘觸女人便疑云為作大惡竟為始應提慊者為世人所慊沙門梵行今觸女人與俗何異有何道德堪為福田也第二辨釋相狀中二初明故犯相二不犯下明不犯法初二初列犯緣二初明人下隨難解釋言具至犯者身相觸者但舉是身簡互有衣犯曾非殘故戒疏第四緣云二俱無衣也隨難釋中分三先釋初緣是其犯境二有婬心下解第三染心顯其犯相三身者下合辨四五兩緣言初至中者四種女人婬戒者謂活中覺及睡死中即新死少分壞也除此四女人外餘境輕也言有至心者戒疏云心本性淨由愛生染也今言愛者謂婬欲染汙之愛非淨心也第三文二初釋身之分齊二辨相觸犯相言身至也者戒疏云從髮至足括兩頭𠕀網遍也第二辨相觸中二初牒二有三種下解釋言相觸者戒疏云律中觸相乃有三種律云捉摩乃至或捺等釋中二初約身分正辨相觸二善見下相觸通得五罪故制之為伴初二初約當宗二祇律下諸部以辨初二初約身相觸二善見下明髮爪相觸初二初約女境二若與下約二形男子初二初總舉數二初比丘下依數解釋言有三種者人解不同或言比丘與女二俱無衣中自有三也今不同之雖戒疏分也釋中依數雖戒疏分三初二俱無衣相二若互有下明互有衣觸相三二俱下對後俱衣相初二初別明二如上並下雙結別明中二初約比丘往觸彼女女來此觸比丘明其犯相二若不下唯約女人來觸比丘有心明其犯相初三初明比丘觸女二明女觸比丘三此律文下料簡前相一唱言初至殘者不問受樂下受樂者此破古釋至料簡中明女來觸比丘不必須婬心者靈山云謂女不必須有婬心來觸比丘始犯隨前女作何事來觸比丘但使比丘動身受樂皆殘也故律云女作女想女以手捫摸比丘動身婬意染著受觸樂僧殘此律文不了等者古人多釋皆約女來觸比丘中解尋戒本疏意及與律文皆不然也律云女作女想身相觸欲心染著不受樂動身偷蘭二類心染著受樂不動身偷蘭此律二句皆結偷蘭不言犯殘是不了也又覆律師言前後四句皆是女來觸比丘比丘觸女律文略也目後古人即解云受樂即殘不受樂即蘭戒疏云不同昔人受樂便犯但先有染來觸於女著便是犯何得論樂故十誦云比丘觸女不問樂不樂皆殘若女未觸比丘要須動身受樂結殘言若至殘者問何以律中女未觸比丘不動身而受樂何意有犯蘭有犯吉者答鈔云謂先有染心於前女彼女來觸比丘即犯蘭動身則殘若先無染心但犯吉也故律云若女作禮捉是覺觸樂不動身突吉羅前女者謂望前女境為前女即此女後來觸比丘故曰前後非謂有二女也先有婬心不動身受樂蘭動身受樂則殘也言如上至蘭者比丘與女二俱無衣也言若至偷蘭者戒疏云互觸有衣相計應約身動不動約心樂不樂分輕重以偷蘭含故文中不分也戒疏意律中分比丘往觸女女往觸比丘分動身不動身受樂不受樂亦今分罪輕重重即重蘭輕即輕蘭以偷蘭含於輕重也言二至羅者戒疏云對後俱衣例同准戒疏意律既分比丘觸女女來觸比丘動身不動身受樂不受樂言例同者答例同於蘭分輕重也重即吉輕即輕吉以吉含輕重也並謂律文不分蘭吉輕重故不出也第二文二初約二形辨犯相二律中下就男子辨犯相初文三初標本律二斥不了三如十誦下指律論以釋成一唱言若至蘭者不了者謂四分但言觸二形蘭不分男女二別故不了也今雖十伽分二處可為一身中佩其二境樂觸意別故得殘蘭第二文三初男子二或衣下觸非情三乃至下觸自身一唱言律至羅者律中衣鉢不自他戒疏云衣鉢並是禁約之極心為罪本故隨境制不令要起也尼結夷者大分為言約境有深淺義非觸即重也第二約髮爪中二初約他部不覺觸覺犯蘭二若依下蘭異當宗覺觸不覺得殘一唱言善至也者此一段意准戒疏云髮者釋除疑法也時有疑云捉手身肉則有適樂細滑髮是身分何業之有而結罪耶由染汙心四分不分其相應以四句明其輕重覺不覺境故善見云髮髮相著爪爪相觸悉得蘭俱無覺故若互觸者理得殘也應作四句者立云一覺觸不覺殘二不覺觸覺蘭准戒疏結三不覺觸不覺蘭准善見結四覺觸殘即二殘二蘭雖是不覺以是一身分不同衣故所以得殘若爾十誦何故以覺觸不覺得蘭故十誦云若以瘡無肉骨摩觸女人身偷蘭女身根壞亦爾答瘡是壞相雖互相觸染樂心輕故結蘭也無肉骨髮齒毛等而觸彼女於其比丘成其不覺得蘭若比丘身觸女髮等即得殘也為簡此無引十誦來故四分云若捉髮者謂以覺觸不覺也第二諸部雜辨中三初約觸畜二十誦下觸不能男女三僧祇下本是女人作男子黃門想觸一唱言僧祇至境者謂比丘忽觸女人無婬心故吉也十誦云若摩觸不能女人身得蘭若比丘不能男觸女人得蘭此不能男即比丘身非謂別有男也十中比丘不能男者謂彼宗開不能男有比丘用觸故得蘭也僧祇意謂者謂祇性戒不開想疑方便故得殘也彼律云女作男想疑觸殘又云如作黃門想疑觸殘鈔言謂前有方便心者決了律文故來南山云聖制有以文少不了豈有智人堅持不觸因事悟觸可結殘耶此謂重者前有方便欲觸此女舉手向女乃至男子黃門想疑約後心邊止吉羅可成前方便非重如何非謂南山不知彼律性戒不開想疑謂律文不了故有此決從此第二相觸通得五罪故制之為伴言善至提者論第十八舍利弗問波羅相觸得夷不答得五罪一尼觸得夷二比丘觸殘三互有衣觸得蘭四二俱有衣比丘觸女得吉五比丘指撞他比丘得提是名五罪此觸既通五篇故制以之為伴也第二不犯中三初標二律云下諸部別明三十誦四分下總會上文勸知緩急之意初如文釋中三初舉當宗有所取與相觸引僧祇釋成二若母等下明母等女人別久難緣救捉開不三僧祇下雜明應不義准設儀言律至蘭者戲非犯者戒疏云不以婬心別餘戲可為開殘故非不犯戒儀相解者為救解難也非不犯餘罪者花嚴云謂非戒儀吉也言若母至得蘭者十誦云有諸向阿脂羅河洗河水卒長諸女被溺諸比丘不敢救女言大德慈悲怜愍何處沙門釋子見為水漂而不救捉諸比丘白佛佛言聽救捉諸比丘便捉婬欲心起還放諸女言莫放須待到岸不應故觸言僧至知者如文言十誦至此者祇云有比丘河邊行有女人落水中作哀苦聲求比丘救時比丘作他想捉出不犯若授竹木繩牽牽出不犯緩急意者實是死苦即須救之若斷彼自得脫者不得捉也第二別釋戒本中五句一能犯人二染心三犯境四身相觸正明造業五結罪男可知第三麤語戒分二初標所制之戒名二七緣下依文解釋言與至三者初緣起者佛在舍衛國迦留陀夷聞佛制前二戒已便於女人前欲心向彼
